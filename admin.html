// Скидочные окна: «с 10 до 16 по будням корт 1500». Механизм расчёта в
// сервере с первого дня, здесь появился ввод.
//
// Порядок важен: побеждает первое подходящее правило, поэтому частное
// правило ставится выше общего. Отсюда кнопки «выше/ниже», а не
// сортировка по времени — сортировка молча меняла бы цены.
function renderPriceRules(view, cfg, owner) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Скидочные часы <span class="sub">цена в выбранные часы</span></h2>';
  view.appendChild(card);

  const rules = (db.config.rules || []).slice();
  if (!rules.length) card.appendChild(txt('div', 'empty', 'Окон нет — везде базовая цена ' + money(cfg.pricePerHour) + '.'));

  rules.forEach((rule, i) => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(rule.label || 'Скидочное окно') + ' — '
      + escapeHtml(money(rule.pricePerHour))
      + (rule.showOnHome ? ' <span class="pill ok">на главной</span>' : '') + '</div>'
      + '<div class="t2">' + escapeHtml(fmtRange(rule.from, rule.to) + ' · ' + daysText(rule.days)) + '</div>';

    if (owner) {
      const acts = el('div', 'acts');
      if (i > 0) acts.appendChild(btn('Выше', 'btn sm sec', () => saveRules(moveRule(rules, i, -1))));
      if (i < rules.length - 1) acts.appendChild(btn('Ниже', 'btn sm sec', () => saveRules(moveRule(rules, i, 1))));
      acts.appendChild(btn('Изменить', 'btn sm sec', () => openRuleForm(rule)));
      acts.appendChild(btn('Удалить', 'btn sm danger', () => confirmDelete(
        'Удалить скидочное окно?', rule.label || fmtRange(rule.from, rule.to),
        'Цена в эти часы вернётся к базовой. Уже заведённые брони не подорожают — цена в них записана.',
        () => saveRules(rules.filter(x => x.id !== rule.id)))));
      it.appendChild(acts);
    }

    card.appendChild(it);
  });

  if (!owner) {
    card.appendChild(txt('div', 'empty', 'Менять тарифы может только владелец.'));
    return;
  }

  const acts = el('div', 'acts');
  acts.appendChild(btn('Добавить окно', 'btn sm', () => openRuleForm(null)));
  card.appendChild(acts);

  if (rules.length > 1) {
    card.appendChild(txt('div', 'empty',
      'Побеждает первое подходящее окно сверху. Частное правило («вторник до 16:00») держите выше общего.'));
  }
}

function moveRule(rules, i, delta) {
  const next = rules.slice();
  const j = i + delta;
  const t = next[i]; next[i] = next[j]; next[j] = t;
  return next;
}

function saveRules(rules) {
  return saveSchedule('adminUpdateConfig', { patch: { pricing: { rules } } }, 'Тарифы сохранены');
}

function daysText(days) {
  if (!days || !days.length) return 'все дни';
  return [1, 2, 3, 4, 5, 6, 0].filter(d => days.indexOf(d) !== -1).map(d => WD_SHORT[d]).join(', ');
}

// preset приходит со вкладки статистики: «этот час пустует, сделать его
// скидочным» — форма открывается уже заполненной.
function openRuleForm(existing, preset) {
  const cfg = db.config;
  const source = existing || preset || {};
  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка скидочного окна' : 'Новое скидочное окно') + '</h3>'
    + '<div class="m-sub">Базовая цена центра — ' + escapeHtml(money(cfg.pricePerHour)) + ' за час.</div>';

  const label = document.createElement('input');
  label.value = source.label || '';
  label.placeholder = 'Например: дневной тариф';
  wrapField(body, 'Подпись', label);

  const price = document.createElement('input');
  price.type = 'number';
  price.value = source.pricePerHour != null ? source.pricePerHour : Math.round(cfg.pricePerHour * 0.8);
  wrapField(body, 'Цена за час в эти часы, ₽', price);

  const from = document.createElement('select');
  startTimes().forEach(t => from.appendChild(opt(t, fmtTime(t))));
  from.value = source.from || '10:00';
  wrapField(body, 'С', from);

  const to = document.createElement('select');
  for (let m = timeToMinutes(cfg.openTime) + cfg.slotStep; m <= timeToMinutes(cfg.closeTime); m += cfg.slotStep) {
    to.appendChild(opt(minutesToTime(m), fmtTime(minutesToTime(m))));
  }
  to.value = source.to || '16:00';
  wrapField(body, 'По', to);

  // Пустой список дней означает «все дни» — так же, как в файле.
  const picked = new Set(source.days || []);
  const daysRow = el('div', 'acts');
  [1, 2, 3, 4, 5, 6, 0].forEach(d => {
    const b = btn(WD_SHORT[d], 'btn sm' + (picked.has(d) ? '' : ' sec'), () => {
      if (picked.has(d)) picked.delete(d); else picked.add(d);
      b.className = 'btn sm' + (picked.has(d) ? '' : ' sec');
    });
    daysRow.appendChild(b);
  });
  wrapField(body, 'Дни недели — ничего не выбрано значит все', daysRow);

  const home = { on: !!source.showOnHome };
  body.appendChild(check('Показывать на главной странице', home.on, v => { home.on = v; },
    'Скидка станет видна всем посетителям сайта, а не только тем, кто дошёл до выбора времени.'));

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn(existing ? 'Сохранить' : 'Добавить', 'btn', () => {
    const rule = {
      id: existing ? existing.id : 'r' + Date.now().toString(36),
      days: [...picked].sort(),
      from: from.value,
      to: to.value,
      pricePerHour: Number(price.value),
      label: label.value,
      showOnHome: home.on,
    };
    if (timeToMinutes(rule.to) <= timeToMinutes(rule.from)) { toast('Окончание раньше начала'); return; }
    const rules = (db.config.rules || []).slice();
    const idx = rules.findIndex(x => x.id === rule.id);
    if (idx === -1) rules.push(rule); else rules[idx] = rule;
    closeModal();
    saveRules(rules);
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => label.focus(), 50);
}

// Закрытия кортов ведёт и администратор: ремонт и турнир — операционка,
// а не деньги клуба.
function renderClosures(view, cfg) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Закрытия кортов <span class="sub">ремонт, турниры, выходные</span></h2>';
  view.appendChild(card);

  const today = todayIso();
  const upcoming = db.exceptions.filter(x => x.date >= today)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));

  if (!upcoming.length) card.appendChild(txt('div', 'empty', 'Впереди закрытий нет.'));

  upcoming.forEach(x => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(x.reason || 'Закрыто') + '</div>'
      + '<div class="t2">' + escapeHtml(longDate(x.date) + ' · '
        + fmtRange(x.start || cfg.openTime, x.end || cfg.closeTime)
        + ' · ' + (x.courtId == null ? 'оба корта' : courtName(x.courtId))) + '</div>';
    const acts = el('div', 'acts');
    acts.appendChild(btn('Изменить', 'btn sm sec', () => openExceptionForm(x)));
    acts.appendChild(btn('Снять', 'btn sm danger',
      () => act(() => api('adminDeleteException', { id: x.id }), 'Корт снова доступен')));
    it.appendChild(acts);
    card.appendChild(it);
  });

  const add = el('div', 'acts');
  add.appendChild(btn('Закрыть корт', 'btn sm', () => openExceptionForm(null)));
  card.appendChild(add);
}

function openExceptionForm(existing) {
  const cfg = db.config;
  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка закрытия' : 'Закрыть корт') + '</h3>'
    + '<div class="m-sub">Время исчезнет из записи — и на сайте, и в панели.</div>';

  const date = document.createElement('input');
  date.type = 'date';
  date.value = existing ? existing.date : todayIso();
  wrapField(body, 'Дата', date);

  const court = document.createElement('select');
  court.appendChild(opt('', 'Оба корта'));
  db.courts.forEach(c => court.appendChild(opt(String(c.id), c.name)));
  court.value = existing && existing.courtId != null ? String(existing.courtId) : '';
  wrapField(body, 'Корт', court);

  const wholeDay = { on: !!existing && !existing.start };
  const times = el('div');

  const start = document.createElement('select');
  startTimes().forEach(t => start.appendChild(opt(t, fmtTime(t))));
  start.value = existing && existing.start ? existing.start : cfg.openTime;
  wrapField(times, 'С', start);

  const end = document.createElement('select');
  for (let m = timeToMinutes(cfg.openTime) + cfg.slotStep; m <= timeToMinutes(cfg.closeTime); m += cfg.slotStep) {
    end.appendChild(opt(minutesToTime(m), fmtTime(minutesToTime(m))));
  }
  end.value = existing && existing.end ? existing.end : cfg.closeTime;
  wrapField(times, 'По', end);

  body.appendChild(check('Весь день', wholeDay.on, v => {
    wholeDay.on = v;
    times.hidden = v;
  }, 'Так задаётся выходной центра целиком.'));
  times.hidden = wholeDay.on;
  body.appendChild(times);

  const reason = document.createElement('input');
  reason.value = existing ? existing.reason : '';
  reason.placeholder = 'Например: замена покрытия';
  wrapField(body, 'Причина', reason);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn(existing ? 'Сохранить' : 'Закрыть корт', 'btn', async () => {
    if (reason.value.trim().length < 2) { toast('Напишите причину'); return; }
    const payload = {
      date: date.value,
      courtId: court.value === '' ? null : Number(court.value),
      start: wholeDay.on ? '' : start.value,
      end: wholeDay.on ? '' : end.value,
      reason: reason.value,
    };
    if (existing) payload.id = existing.id;
    closeModal();
    await saveSchedule('adminSaveException', payload,
      existing ? 'Закрытие изменено' : 'Корт закрыт');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => reason.focus(), 50);
}

// Администраторы. Назначает и снимает только владелец — иначе
// администратор заводит себе второго, и владелец теряет контроль над
// списком тех, кто видит телефоны всех клиентов. Администратору экран
// показывается, но без кнопок: знать, кто ещё в панели, полезно всем.
function renderStaff(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Администраторы <span class="sub">кто входит в панель</span></h2>';
  view.appendChild(card);

  if (!db.staff) {
    card.appendChild(txt('div', 'empty', 'Загружаем список…'));
    return;
  }

  const owner = !!(me && me.role === 'owner');

  db.staff.forEach(s => {
    const it = el('div', 'item');
    const pills = ['<span class="pill ' + (s.role === 'owner' ? 'ok' : 'grey') + '">'
      + (s.role === 'owner' ? 'владелец' : 'администратор') + '</span>'];
    // Уведомления уходят по привязке Telegram. Администратор без неё
    // ничего не получает, и узнать об этом лучше здесь, а не по
    // пропущенной заявке.
    if (!s.hasTelegram) pills.push('<span class="pill wait">без Telegram</span>');

    it.innerHTML = '<div class="t1">' + escapeHtml(s.name) + ' ' + pills.join(' ') + '</div>'
      + '<div class="t2">' + escapeHtml(fmtPhone(s.phone)) + ' · '
      + (s.lastLoginAt
        ? 'последний вход ' + escapeHtml(s.lastLoginAt.slice(0, 10).split('-').reverse().join('.'))
        : 'в панель ещё не входил') + '</div>';

    if (owner && s.role === 'admin') {
      const acts = el('div', 'acts');
      acts.appendChild(btn('Снять роль', 'btn sm danger', () => confirmDemote(s)));
      it.appendChild(acts);
    }

    card.appendChild(it);
  });

  if (!owner) {
    card.appendChild(txt('div', 'empty', 'Менять список может только владелец.'));
    return;
  }

  const acts = el('div', 'acts');
  acts.appendChild(btn('Назначить администратора', 'btn sm', openAddAdmin));
  card.appendChild(acts);
  card.appendChild(txt('div', 'empty',
    'Администратором становится уже зарегистрированный клиент: так у него подтверждённый '
    + 'телефон, а не запись, придуманная за него. Роль владельца через панель не выдаётся.'));
}

function confirmDemote(s) {
  const body = el('div');
  body.innerHTML = '<h3>Снять роль администратора?</h3>'
    + '<div class="m-sub">' + escapeHtml(s.name + ' · ' + fmtPhone(s.phone)) + '</div>'
    + '<div class="empty">Панель и телефоны клиентов закроются сразу. Учётная запись, '
    + 'привязанный Telegram и история броней останутся — человек станет обычным клиентом центра.</div>';
  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Снять роль', 'btn danger', () => {
    closeModal();
    act(() => api('setClientRole', { clientId: s.id, role: 'client' }), 'Роль снята');
  }));
  body.appendChild(acts);
  showModal(body);
}

// Поиск идёт по тем же клиентам, что и вкладка «Клиенты», — сервером.
// Своей выборки здесь нет намеренно: два разных списка одних и тех же
// людей рано или поздно разойдутся.
function openAddAdmin() {
  const body = el('div');
  body.innerHTML = '<h3>Назначить администратора</h3>'
    + '<div class="m-sub">Найдите зарегистрированного клиента по имени или телефону.</div>';

  const search = document.createElement('input');
  search.placeholder = 'Имя или телефон';
  search.style.cssText = 'width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px';
  body.appendChild(search);

  const results = el('div');
  results.appendChild(txt('div', 'empty', 'Начните вводить.'));
  body.appendChild(results);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Закрыть', 'btn sec', closeModal));
  body.appendChild(acts);

  let timer = null;
  search.addEventListener('input', () => {
    const query = search.value.trim();
    clearTimeout(timer);
    if (query.length < 2) {
      results.innerHTML = '';
      results.appendChild(txt('div', 'empty', 'Начните вводить.'));
      return;
    }
    timer = setTimeout(async () => {
      let found;
      try { found = await api('listClients', { query }); }
      catch (e) { toast(errorText(e.code), 4000); return; }

      results.innerHTML = '';
      const list = found.clients.filter(c => (c.role || 'client') === 'client');
      if (!list.length) {
        results.appendChild(txt('div', 'empty', 'Никого не нашлось. Роль поднимают тому, кто уже зарегистрирован.'));
        return;
      }

      list.slice(0, 8).forEach(c => {
        const it = el('div', 'item');
        it.innerHTML = '<div class="t1">' + escapeHtml(c.name) + '</div>'
          + '<div class="t2">' + escapeHtml(fmtPhone(c.phone)) + ' · '
          + (c.status === 'verified' ? 'проверенный'
            : c.status === 'pending' ? 'ждёт проверки' : 'заблокирован') + '</div>';
        const row = el('div', 'acts');
        // Кнопка есть только у проверенных: сервер откажет остальным,
        // и предлагать нажатие, которое заведомо не пройдёт, незачем.
        if (c.status === 'verified') {
          row.appendChild(btn('Назначить', 'btn sm', () => {
            closeModal();
            act(() => api('setClientRole', { clientId: c.id, role: 'admin' }),
              c.name + ' — теперь администратор');
          }));
        } else {
          row.appendChild(txt('div', 'empty', 'Сначала подтвердите его на вкладке «Клиенты».'));
        }
        it.appendChild(row);
        results.appendChild(it);
      });
    }, 350);
  });

  showModal(body);
  search.focus();
}

function check(label, value, onChange, hint) {
  const wrap = el('div', 'item');
  const l = document.createElement('label');
  l.style.cssText = 'display:flex;gap:9px;align-items:flex-start;cursor:pointer';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = value; cb.style.marginTop = '3px';
  cb.addEventListener('change', () => onChange(cb.checked));
  const span = document.createElement('span');
  span.innerHTML = '<b>' + escapeHtml(label) + '</b>' + (hint ? '<div class="t2">' + escapeHtml(hint) + '</div>' : '');
  l.appendChild(cb); l.appendChild(span);
  wrap.appendChild(l);
  return wrap;
}

function numField(parent, label, value) {
  const i = document.createElement('input'); i.type = 'number'; i.value = value;
  wrapField(parent, label, i); return i;
}
function textField(parent, label, value) {
  const i = document.createElement('input'); i.value = value;
  wrapField(parent, label, i); return i;
}
function wrapField(parent, label, input) {
  wrapFieldNode(parent, label, input);
}

// То же самое, но возвращает само поле: форме турнира надо прятать
// часть полей, когда формат их не касается.
function wrapFieldNode(parent, label, input) {
  const f = el('label', 'field');
  f.innerHTML = '<span>' + escapeHtml(label) + '</span>';
  f.appendChild(input); parent.appendChild(f);
  return f;
}

// ============================================================
// Мелочи
// ============================================================

function el(tag, cls) { const d = document.createElement(tag); if (cls) d.className = cls; return d; }
function txt(tag, cls, text) { const d = el(tag, cls); d.textContent = text; return d; }
function btn(label, cls, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}
function opt(value, label) {
  const o = document.createElement('option'); o.value = value; o.textContent = label; return o;
}
function courtName(id) { const c = db.courts.find(x => x.id === id); return c ? c.name : 'Корт'; }
function statusPill(s) {
  const map = {
    confirmed: '<span class="pill ok">подтверждена</span>',
    pending: '<span class="pill wait">ждёт подтверждения</span>',
    done: '<span class="pill grey">состоялась</span>',
    noshow: '<span class="pill bad">не пришли</span>',
    cancelled: '<span class="pill grey">отменена</span>',
  };
  return map[s] || '';
}

function showModal(node) {
  const m = document.getElementById('modal');
  m.innerHTML = ''; m.appendChild(node);
  document.getElementById('backdrop').classList.add('show');
}
function closeModal() { document.getElementById('backdrop').classList.remove('show'); }
document.getElementById('backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'backdrop') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

let toastTimer = null;
function toast(text, ms) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2600);
}

// ---------- Запуск ----------

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
attachPhoneMask(document.getElementById('loginPhone'));

document.getElementById('reloadBtn').addEventListener('click', () => {
  reload().then(() => toast('Обновлено')).catch(() => toast('Не удалось обновить'));
});
document.getElementById('logoutBtn').addEventListener('click', logout);

// Сохранённый токен избавляет от входа на каждое открытие панели. Если
// он протух, сервер ответит 401 — тогда просто показываем вход.
(async () => {
  if (!token) { showLogin(); return; }
  try {
    const res = await api('me');
    await enter(res.client);
  } catch (e) {
    // Сеть не ответила — это не протухший токен. Требовать за это пароль
    // заново значит наказывать администратора за чужой сбой: токен
    // оставляем, показываем причину и предлагаем повторить.
    if (e.code === 'timeout' || e.code === 'server-unavailable') {
      showLogin('Центр не отвечает. Проверьте связь и обновите страницу — входить заново не нужно.');
      return;
    }
    setToken(null);
    showLogin();
  }
})();
