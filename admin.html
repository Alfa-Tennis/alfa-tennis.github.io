// Порядки списка клиентов. Каждый — про свой вопрос администратора:
// «кого проверить», «кому нельзя без предоплаты», «кто новенький»,
// «кому не дойдёт напоминание».
//
// По умолчанию оставлен серверный порядок (ждущие проверки сверху, потом
// имя): это единственное, что требует действия прямо сейчас, и терять
// его при каждом заходе не стоит.
const CLIENT_SORTS = [
  { id: 'default', label: 'сначала ждущие проверки' },
  { id: 'name', label: 'по имени, А→Я' },
  { id: 'rating-asc', label: 'рейтинг: сначала низкий' },
  { id: 'rating-desc', label: 'рейтинг: сначала высокий' },
  { id: 'ntrp-desc', label: 'игровой уровень: сначала сильные' },
  { id: 'ntrp-asc', label: 'игровой уровень: сначала слабые' },
  { id: 'new', label: 'сначала новые' },
  { id: 'old', label: 'сначала давние' },
  { id: 'no-tg', label: 'сначала без Telegram' },
  { id: 'games', label: 'сначала кто больше играл' },
];

function sortedClients() {
  const list = db.clients.slice();
  const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
  // Уровень известен не у всех, и «не знаем» — это не ноль: такие
  // карточки уезжают в конец при любой сортировке по NTRP, иначе они
  // притворяются самыми слабыми игроками клуба.
  const byNtrp = dir => (a, b) => {
    if ((a.ntrp == null) !== (b.ntrp == null)) return a.ntrp == null ? 1 : -1;
    if (a.ntrp == null) return byName(a, b);
    return (a.ntrp - b.ntrp) * dir || byName(a, b);
  };
  const at = c => Date.parse(c.createdAt || '') || 0;

  switch (state.clientSort) {
    case 'name': return list.sort(byName);
    case 'rating-asc': return list.sort((a, b) => a.rating - b.rating || byName(a, b));
    case 'rating-desc': return list.sort((a, b) => b.rating - a.rating || byName(a, b));
    case 'ntrp-desc': return list.sort(byNtrp(-1));
    case 'ntrp-asc': return list.sort(byNtrp(1));
    case 'new': return list.sort((a, b) => at(b) - at(a) || byName(a, b));
    case 'old': return list.sort((a, b) => at(a) - at(b) || byName(a, b));
    case 'no-tg': return list.sort((a, b) => (a.tg === b.tg) ? byName(a, b) : (a.tg ? 1 : -1));
    case 'games': return list.sort((a, b) => b.completedCount - a.completedCount || byName(a, b));
    // Порядок сервера: ждущие проверки сверху, дальше по имени.
    default: return list;
  }
}

function renderClients(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Клиенты <span class="sub">' + db.clients.length
    + (state.clientQuery ? ' по запросу' : ' человек') + '</span></h2>';

  const search = document.createElement('input');
  search.placeholder = 'Поиск по имени или телефону';
  search.value = state.clientQuery;
  search.style.cssText = 'width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:10px';
  // Ищет сервер: список клиентов целиком в браузер не тянем, а ждать
  // ответа на каждую букву незачем — отправляем, когда человек замолчал.
  let searchTimer = null;
  search.addEventListener('input', () => {
    state.clientQuery = search.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { reload().then(() => {
      const again = document.querySelector('#view input');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }); }, 350);
  });
  card.appendChild(search);

  // Порядок списка. Сортируем уже полученный список, а не переспрашиваем
  // сервер: список за один запрос и так в руках, а лишний вызов у нас
  // стоит холодного старта (см. «один запрос на экземпляр»).
  const fSort = el('label', 'field');
  fSort.innerHTML = '<span>Порядок</span>';
  const selSort = document.createElement('select');
  CLIENT_SORTS.forEach(o => selSort.appendChild(opt(o.id, o.label)));
  selSort.value = state.clientSort;
  selSort.addEventListener('change', () => { state.clientSort = selSort.value; render(); });
  fSort.appendChild(selSort);
  card.appendChild(fSort);

  // Загрузка «Корзин игроков». Кнопка живёт здесь, а не в настройках:
  // уровень — свойство клиента, и смотреть на результат импорта надо
  // там же, где потом будешь его править руками.
  const imp = el('div', 'acts');
  const file = document.createElement('input');
  file.type = 'file';
  file.accept = '.xlsx';
  file.style.display = 'none';
  file.addEventListener('change', () => {
    const chosen = file.files && file.files[0];
    if (!chosen) return;
    const reader = new FileReader();
    reader.onload = () => { file.value = ''; parseNtrpFile(reader.result); };
    reader.onerror = () => toast('Не удалось прочитать файл');
    reader.readAsDataURL(chosen);
  });
  imp.appendChild(file);
  imp.appendChild(btn('Загрузить «Корзины игроков»', 'btn sm sec', () => file.click()));
  card.appendChild(imp);

  const list = el('div');
  card.appendChild(list);
  view.appendChild(card);

  if (!db.clients.length) {
    list.appendChild(txt('div', 'empty', 'Никого не нашлось.'));
    return;
  }

  sortedClients().forEach(c => {
    const it = el('div', 'item');
    const flags = [];
    flags.push(c.status === 'verified' ? '<span class="pill ok">проверенный</span>'
      : c.status === 'pending' ? '<span class="pill wait">ждёт проверки</span>'
      : '<span class="pill bad">заблокирован</span>');
    if (c.role === 'admin' || c.role === 'owner') {
      flags.push('<span class="pill grey">' + (c.role === 'owner' ? 'владелец' : 'администратор') + '</span>');
    }
    if (!c.tg) flags.push('<span class="pill grey">без Telegram</span>');
    // Заведён при записи с улицы, сам не регистрировался. Отличать
    // важно: у зарегистрировавшегося без Telegram напоминания не дошли,
    // а этот их и не ждал — и войти в свою учётку пока не может.
    if (c.createdByAdmin) flags.push('<span class="pill grey">с улицы</span>');
    if (c.needsPrepay) flags.push('<span class="pill bad">только предоплата</span>');

    const counters = [];
    if (c.noShowCount) counters.push('неявок ' + c.noShowCount);
    if (c.lateCancelCount) counters.push('поздних отмен ' + c.lateCancelCount);
    counters.push('сыграно ' + c.completedCount);

    it.innerHTML = '<div class="t1">' + escapeHtml(c.name) + ' ' + flags.join(' ') + '</div>'
      + '<div class="t2">' + escapeHtml(fmtPhone(c.phone))
      + ' · рейтинг <b>' + String(c.rating).replace('.', ',') + '</b>'
      + ' · ' + counters.join(' · ')
      // Дата регистрации нужна не сама по себе, а рядом с порядком
      // «сначала новые»: иначе непонятно, почему список выстроился так.
      + (c.createdAt ? ' · с ' + escapeHtml(c.createdAt.slice(8, 10) + '.'
        + c.createdAt.slice(5, 7) + '.' + c.createdAt.slice(0, 4)) : '') + '</div>';

    // Откуда взялось число, если его правили руками. Без этой строки у
    // стойки не объяснить пятёрку у человека с двумя неявками.
    const lastEdit = c.ratingEdits[c.ratingEdits.length - 1];
    if (lastEdit) {
      // shortDate ждёт «ГГГГ-ММ-ДД», а здесь полная метка времени.
      it.appendChild(txt('div', 't3', 'Рейтинг правил владелец '
        + shortDateTime(lastEdit.at) + ': ' + ratingText(lastEdit.from) + ' → ' + ratingText(lastEdit.to)
        + (lastEdit.reason ? ' · ' + lastEdit.reason : '')));
    }

    it.appendChild(ntrpField(c));
    it.appendChild(passField(c));

    const note = document.createElement('textarea');
    note.rows = 2; note.value = c.notes; note.placeholder = 'Заметка для себя';
    note.style.cssText = 'width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px';
    note.addEventListener('change', () => {
      act(() => api('setClientNote', { clientId: c.id, note: note.value }), 'Заметка сохранена');
    });
    it.appendChild(note);

    const acts = el('div', 'acts');
    if (c.status === 'pending') {
      acts.appendChild(btn('Подтвердить', 'btn sm', () =>
        act(() => api('verifyClient', { clientId: c.id }), 'Клиент подтверждён')));
    }
    // Владельца заблокировать нельзя — сервер откажет (shared-ops.js), и
    // кнопки у его карточки быть не должно вовсе: одно случайное нажатие
    // на своей же строке выглядит как «сейчас закрою себе вход».
    if (c.status === 'blocked') {
      acts.appendChild(btn('Разблокировать', 'btn sm sec', () =>
        act(() => api('unblockClient', { clientId: c.id }), 'Разблокирован')));
    } else if (c.role !== 'owner') {
      acts.appendChild(btn('Заблокировать', 'btn sm danger', () =>
        act(() => api('blockClient', { clientId: c.id }), 'Заблокирован')));
    }
    // Пароль клиенту сбрасывает любой администратор — это ежедневная
    // работа. Сотруднику пароль меняет только владелец, поэтому у таких
    // карточек кнопки нет: сервер всё равно откажет.
    if (c.role === 'client' || (me && me.role === 'owner')) {
      acts.appendChild(btn('Сбросить пароль', 'btn sm sec', () => resetPassword(c)));
    }
    // Рейтинг правит только владелец: это чужая репутация, а не рабочая
    // мелочь ресепшена. Сервер откажет и администратору, но кнопки у
    // него быть не должно вовсе.
    if (me && me.role === 'owner') {
      acts.appendChild(btn('Поправить рейтинг', 'btn sm sec', () => openRatingForm(c)));
    }
    it.appendChild(acts);

    list.appendChild(it);
  });
}

// Абонемент в карточке клиента. Продаёт любой сотрудник — деньги
// принимают на ресепшене, и ждать владельца клиенту незачем. Сжигает
// остаток только владелец: это уже не приём денег, а их списание.
function passField(c) {
  const wrap = el('div');
  const left = c.pass.hours;

  const line = el('div', 't2');
  line.style.marginTop = '6px';
  line.innerHTML = left
    ? 'Абонемент: <b>' + hoursNum(left) + ' ч</b>'
      + (c.pass.expiresAt ? ' · ближайшее сгорание ' + shortDate(c.pass.expiresAt) : ' · бессрочно')
    : 'Абонемента нет';
  wrap.appendChild(line);

  const acts = el('div', 'acts');
  acts.appendChild(btn(left ? 'Продлить' : 'Продать абонемент', 'btn sm sec', () => openPassForm(c)));

  // Журнал по одному человеку. Сервер умел отдавать его с самого начала,
  // но в панели посмотреть «когда куплен и что списано» можно было только
  // общим списком за месяц на вкладке статистики — а спрашивают об этом
  // у стойки, глядя в карточку.
  if (me && me.role === 'owner') {
    acts.appendChild(btn('История', 'btn sm sec', () => openPassHistory(c, null)));
    c.passes.filter(p => p.hoursLeft > 0).forEach(p => {
      acts.appendChild(btn('Сжечь ' + hoursNum(p.hoursLeft) + ' ч', 'btn sm danger', () => openBurnPass(c, p)));
    });
  }
  wrap.appendChild(acts);

  return wrap;
}

// Что за операция — одними словами и в журнале месяца, и в карточке.
const PASS_KIND = { purchase: 'продан', spend: 'списано за игру', burn: 'сожжён остаток' };

function openPassHistory(c, month) {
  const body = el('div');
  body.innerHTML = '<h3>Абонемент: история</h3>'
    + '<div class="m-sub">' + escapeHtml(c.name + ' · ' + fmtPhone(c.phone)
      + ' · ' + (c.pass.hours ? 'остаток ' + hoursNum(c.pass.hours) + ' ч' : 'остатка нет')) + '</div>';

  const list = el('div');
  list.appendChild(txt('div', 'empty', 'Загружаем журнал…'));
  body.appendChild(list);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Закрыть', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);

  api('adminLedger', month ? { clientId: c.id, month } : { clientId: c.id })
    .then(r => {
      list.innerHTML = '';

      // Месяцы переключаются прямо в окне: абонемент покупают в одном
      // месяце, а спрашивают о нём в другом.
      if ((r.months || []).length > 1) {
        const sel = document.createElement('select');
        r.months.forEach(m => sel.appendChild(opt(m, monthLabel(m))));
        sel.value = r.month;
        sel.addEventListener('change', () => openPassHistory(c, sel.value));
        const f = el('label', 'field'); f.innerHTML = '<span>Месяц</span>';
        f.appendChild(sel);
        list.appendChild(f);
      }

      if (!r.entries.length) {
        list.appendChild(txt('div', 'empty', 'В этом месяце операций по абонементу не было.'));
        return;
      }

      const table = document.createElement('table');
      table.className = 'tbl';
      table.innerHTML = '<tr><th>Когда</th><th>Что</th><th>Часы</th><th>Сумма</th></tr>';
      r.entries.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + escapeHtml(shortDateTime(e.at)) + '</td>'
          + '<td>' + escapeHtml((PASS_KIND[e.kind] || e.kind)
            + (e.date ? ' · игра ' + shortDate(e.date) : '')
            + (e.note ? ' · ' + e.note : '')) + '</td>'
          + '<td>' + escapeHtml(hoursNum(e.hours) + ' ч') + '</td>'
          + '<td>' + escapeHtml(money2(e.sum)) + '</td>';
        table.appendChild(tr);
      });
      list.appendChild(table);
    })
    .catch(() => {
      list.innerHTML = '';
      list.appendChild(txt('div', 'empty', 'Не удалось прочитать журнал.'));
    });
}

function openPassForm(c) {
  const body = el('div');
  body.innerHTML = '<h3>Абонемент</h3>'
    + '<div class="m-sub">' + escapeHtml(c.name + ' · ' + fmtPhone(c.phone)) + '</div>';

  const hours = document.createElement('input');
  hours.type = 'number'; hours.step = '0.5'; hours.min = '0.5'; hours.value = '10';
  wrapField(body, 'Часов', hours);

  const price = document.createElement('input');
  price.type = 'number'; price.value = db.config.pricePerHour;
  wrapField(body, 'Цена часа в этом абонементе, ₽', price);

  const sum = el('div', 't2');
  const recount = () => {
    const total = Math.round(Number(hours.value) * Number(price.value)) || 0;
    sum.textContent = 'К оплате: ' + money(total)
      + (Number(price.value) < db.config.pricePerHour
        ? ' · выгода ' + money(Math.round((db.config.pricePerHour - Number(price.value)) * Number(hours.value)))
        : '');
  };
  hours.addEventListener('input', recount);
  price.addEventListener('input', recount);
  recount();
  body.appendChild(sum);

  const until = document.createElement('input');
  until.type = 'date';
  wrapField(body, 'Действует до — пусто значит бессрочно', until);

  const note = document.createElement('input');
  note.placeholder = 'Например: оплатил переводом';
  wrapField(body, 'Заметка — необязательно', note);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Записать', 'btn', () => {
    closeModal();
    act(() => api('adminAddPass', {
      clientId: c.id,
      hours: Number(hours.value),
      pricePerHour: Number(price.value),
      validUntil: until.value || null,
      note: note.value,
    }), 'Абонемент записан');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => hours.focus(), 50);
}

function openBurnPass(c, p) {
  const body = el('div');
  body.innerHTML = '<h3>Сжечь остаток абонемента</h3>'
    + '<div class="m-sub">' + escapeHtml(c.name + ' · ' + hoursNum(p.hoursLeft) + ' ч из '
      + hoursNum(p.hours) + ' по ' + money(p.pricePerHour)) + '</div>'
    + '<div class="empty">Часы исчезнут, но запись о покупке и причина останутся в журнале операций. '
    + 'Вернуть их можно только новой продажей.</div>';

  const reason = document.createElement('input');
  reason.placeholder = 'Например: вышел срок, договорились с клиентом';
  wrapField(body, 'Причина', reason);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Сжечь', 'btn danger', () => {
    if (reason.value.trim().length < 3) { toast('Напишите причину'); return; }
    closeModal();
    act(() => api('adminBurnPass', { clientId: c.id, passId: p.id, reason: reason.value }),
      'Остаток сожжён');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => reason.focus(), 50);
}

// Правка рейтинга. Форс-мажор система распознать не умеет: перелом за
// час до игры стоит тех же −0,5, что и «передумал». Разбирает человек.
//
// Значение выбирается, а не только «вернуть 5»: прощают и частично —
// снять одну отмену, оставив две неявки. Счётчики штрафов остаются как
// были, их эта кнопка не трогает.
function openRatingForm(c) {
  const body = el('div');
  body.innerHTML = '<h3>Поправить рейтинг</h3>'
    + '<div class="m-sub">' + escapeHtml(c.name + ' · сейчас ' + ratingText(c.rating)) + '</div>'
    + '<div class="empty">Счётчики неявок и поздних отмен останутся как есть — '
    + 'они история, а не наказание. Правка и причина сохранятся в карточке.</div>';

  const max = 5;
  let picked = max;

  const field = el('label', 'field');
  field.innerHTML = '<span>Новое значение</span>';
  const chips = el('div', 'chips');
  for (let v = max; v >= 0; v -= 0.5) {
    const value = v;
    const c1 = btn(ratingText(value) + (value === max ? ' · чисто' : ''),
      'chip' + (value === picked ? ' on' : ''), () => {
        picked = value;
        Array.prototype.forEach.call(chips.children, n => n.classList.remove('on'));
        c1.classList.add('on');
      });
    chips.appendChild(c1);
  }
  field.appendChild(chips);
  body.appendChild(field);

  const reason = document.createElement('input');
  reason.placeholder = 'Например: сломал руку, отменил честно';
  wrapField(body, 'Причина', reason);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Сохранить', 'btn', () => {
    if (reason.value.trim().length < 3) { toast('Напишите причину'); return; }
    closeModal();
    act(() => api('adminSetRating', { clientId: c.id, rating: picked, reason: reason.value }),
      'Рейтинг изменён');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => reason.focus(), 50);
}

// Временный пароль показываем один раз и крупно: админ диктует его или
// отправляет клиенту, второй раз этот пароль не узнать.
async function resetPassword(c) {
  try {
    const res = await api('resetPassword', { clientId: c.id });
    const body = el('div');
    body.innerHTML = '<h3>Временный пароль</h3>'
      + '<div class="m-sub">' + escapeHtml(c.name + ' · ' + fmtPhone(res.phone)) + '</div>'
      + '<div class="item" style="text-align:center;font-size:22px;letter-spacing:1px">'
      + '<b>' + escapeHtml(res.temporaryPassword) + '</b></div>'
      + '<div class="empty">Действует ' + res.validHours + ' ч. При первом входе клиент задаст свой пароль. '
      + 'Все прежние входы отключены.</div>';
    const acts = el('div', 'm-acts');
    acts.appendChild(btn('Скопировать', 'btn sec', () => {
      navigator.clipboard.writeText(res.temporaryPassword)
        .then(() => toast('Скопировано')).catch(() => toast('Не удалось скопировать'));
    }));
    acts.appendChild(btn('Готово', 'btn', closeModal));
    body.appendChild(acts);
    showModal(body);
  } catch (e) {
    toast(errorText(e.code), 4000);
  }
}

// ============================================================
// Вкладка: Постоянные брони
// ============================================================

function renderSeries(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Постоянные брони <span class="sub">повторяются каждую неделю</span></h2>';

  if (!db.series.length) card.appendChild(txt('div', 'empty', 'Постоянных броней нет.'));

  const today = todayIso();

  db.series.slice()
    .sort((a, b) => (a.weekday - b.weekday) || a.start.localeCompare(b.start))
    .forEach(s => {
      const cl = clientById(s.clientId);
      const ended = !!(s.to && s.to < today) || s.active === false;
      const it = el('div', 'item');
      it.innerHTML = '<div class="t1">' + escapeHtml(s.title)
        + (ended ? ' <span class="pill grey">завершена</span>' : '') + '</div>'
        + '<div class="t2">' + seriesSchedule(s, true) + ', ' + escapeHtml(fmtRange(s.start, s.end))
        + ' · ' + escapeHtml(courtName(s.courtId))
        + ' · с ' + shortDate(s.from) + (s.to ? ' по ' + shortDate(s.to) : ', бессрочно')
        + (cl ? ' · ' + escapeHtml(fmtPhone(cl.phone)) : '') + '</div>';

      const upcoming = nextOccurrences(s, 3);
      if (upcoming.length) {
        it.appendChild(txt('div', 't2', 'Ближайшие: ' + upcoming.map(shortDate).join(', ')));
      }

      // Снятые занятия — не справка, а список того, что можно вернуть:
      // группа отменилась на неделю, потом передумала.
      const skips = (s.skipDates || []).filter(d => d >= today);
      if (skips.length) {
        const row = el('div', 'acts');
        row.appendChild(txt('span', 't2', 'Снятые занятия:'));
        skips.slice(0, 6).forEach(d => {
          row.appendChild(btn(shortDate(d) + ' — вернуть', 'btn sm sec',
            () => act(() => api('adminSkipSeries', { seriesId: s.id, date: d, skip: false }),
              'Занятие вернулось в расписание')));
        });
        it.appendChild(row);
      }

      it.appendChild(colorPicker(s));

      const acts = el('div', 'acts');
      acts.appendChild(btn('Изменить', 'btn sm sec', () => openSeriesForm(s)));
      if (!ended) acts.appendChild(btn('Завершить', 'btn sm sec', () => openEndSeries(s)));
      // Удаление сервер разрешает только до первого занятия: стереть
      // начавшуюся серию значило бы освободить задним числом дни, в
      // которые корт был занят. Кнопку и не показываем.
      if (s.from > today) {
        acts.appendChild(btn('Удалить', 'btn sm danger', () => confirmDelete(
          'Удалить постоянную бронь?', s.title,
          'Она ещё ни разу не проводилась, поэтому удаляется целиком и без следа.',
          () => act(() => api('adminDeleteSeries', { seriesId: s.id }), 'Постоянная бронь удалена'))));
      }
      it.appendChild(acts);

      card.appendChild(it);
    });

  const add = el('div', 'acts');
  add.appendChild(btn('Завести постоянную бронь', 'btn sm', () => openSeriesForm(null)));
  card.appendChild(add);
  view.appendChild(card);

  // Раньше здесь было объяснение внутреннего устройства — «не
  // разворачивается в отдельные записи». Владельцу оно ничего не давало:
  // ему нужно знать, что нажать, а не как это хранится.
  const note = el('div', 'card');
  note.innerHTML = '<h2>Что нужно знать</h2>'
    + '<div class="empty"><b>Постоянная бронь держит одно и то же время каждую неделю.</b> '
    + 'Завели «вторник, 19:00» — корт занят во все вторники, пока бронь не завершена. '
    + 'Отдельных записей на каждую неделю не появляется, поэтому в сетке дня она '
    + 'показана полосатой клеткой.'
    + '<br><br><b>Пропустить одно занятие</b> — открыть нужный день в сетке и нажать на эту '
    + 'бронь: там кнопки «Снять это занятие» и «Записать вместо них». Время сразу '
    + 'становится свободным. Вернуть снятое занятие можно здесь же, в списке выше.'
    + '<br><br><b>Остановить совсем</b> — кнопка «Завершить» и дата последнего занятия. '
    + 'Всё, что было до неё, остаётся в истории и в отчётах; всё, что после, исчезает '
    + 'из расписания.'
    + '<br><br><b>Снятое занятие не пропадает зря:</b> сначала бот молча пишет тем, кто ждёт '
    + 'это время в очереди, а через полчаса объявление уходит в чат центра. Чат выбирается '
    + 'во вкладке «Настройки»; пока он не выбран, объявления не уходят никуда.</div>';
  view.appendChild(note);
}

// Одна форма и на заведение, и на правку: поля те же, а два окна
// разойдутся при первой доработке.
function openSeriesForm(existing) {
  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка постоянной брони' : 'Новая постоянная бронь') + '</h3>'
    + '<div class="m-sub">Повторяется каждую неделю и держит корт наравне с обычной бронью.</div>';

  const title = document.createElement('input');
  title.value = existing ? existing.title : '';
  title.placeholder = 'Например: группа Петрова';
  wrapField(body, 'Название', title);

  const court = document.createElement('select');
  db.courts.forEach(c => court.appendChild(opt(String(c.id), c.name)));
  if (existing) court.value = String(existing.courtId);
  wrapField(body, 'Корт', court);

  // Дней может быть несколько: одна группа ходит и во вторник, и в
  // четверг, и это одна договорённость — заводить под неё две почти
  // одинаковые карточки владельцу приходилось руками.
  const days = new Set(existing ? seriesDays(existing) : [weekday(todayIso())]);
  const wdField = el('div', 'field');
  wdField.innerHTML = '<span>Дни недели — можно выбрать несколько</span>';
  const wdRow = el('div', 'acts');
  WD_ORDER.forEach(i => {
    const b = btn(WD_SHORT[i], days.has(i) ? 'btn sm' : 'btn sm sec', () => {
      if (days.has(i)) days.delete(i); else days.add(i);
      b.className = days.has(i) ? 'btn sm' : 'btn sm sec';
    });
    wdRow.appendChild(b);
  });
  wdField.appendChild(wdRow);
  body.appendChild(wdField);

  const start = document.createElement('select');
  startTimes().forEach(t => start.appendChild(opt(t, fmtTime(t))));
  start.value = existing ? existing.start : '19:00';
  wrapField(body, 'Начало', start);

  const end = document.createElement('select');
  wrapField(body, 'Окончание', end);
  // Желаемое окончание приходит доводом, а не читается из поля: у пустого
  // списка значение не выставляется, и правка серии молча укорачивала бы
  // её до часа.
  const fillEnds = (want) => {
    const from = timeToMinutes(start.value) + db.config.slotStep;
    const close = timeToMinutes(db.config.closeTime);
    const keep = want || end.value;
    end.innerHTML = '';
    for (let m = from; m <= close; m += db.config.slotStep) {
      end.appendChild(opt(minutesToTime(m), fmtTime(minutesToTime(m))));
    }
    end.value = keep && timeToMinutes(keep) >= from ? keep
      : minutesToTime(Math.min(from + 60 - db.config.slotStep, close));
  };
  fillEnds(existing ? existing.end : null);
  start.addEventListener('change', () => fillEnds());

  const from = document.createElement('input');
  from.type = 'date';
  from.value = existing ? existing.from : todayIso();
  wrapField(body, 'Начиная с', from);

  const to = document.createElement('input');
  to.type = 'date';
  to.value = existing && existing.to ? existing.to : '';
  wrapField(body, 'По — пусто значит бессрочно', to);

  const picked = clientPicker(body, existing ? existing.clientId : null);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn(existing ? 'Сохранить' : 'Завести', 'btn', async () => {
    if (title.value.trim().length < 2) { toast('Укажите название'); return; }
    if (!days.size) { toast('Выберите хотя бы один день недели'); return; }
    const payload = {
      courtId: Number(court.value),
      weekdays: WD_ORDER.filter(i => days.has(i)),
      start: start.value, end: end.value,
      title: title.value, from: from.value, to: to.value || null,
      clientId: picked.id,
    };
    if (existing) payload.seriesId = existing.id;
    closeModal();
    await saveSchedule(
      existing ? 'adminUpdateSeries' : 'adminCreateSeries', payload,
      existing ? 'Постоянная бронь изменена' : 'Постоянная бронь заведена');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => title.focus(), 50);
}

function openEndSeries(s) {
  const body = el('div');
  body.innerHTML = '<h3>Завершить постоянную бронь</h3>'
    + '<div class="m-sub">' + escapeHtml(s.title) + '</div>'
    + '<div class="empty">Занятия до этой даты включительно остаются: и в истории, и в занятости '
    + 'уже прошедших дней. Всё, что после, — исчезает из расписания.</div>';

  last.type = 'date';
  last.value = todayIso();
  wrapField(body, 'Последнее занятие не позже', last);

  acts.appendChild(btn('Завершить', 'btn danger', () => {

  }));

// Привязка к учётке необязательна: у группы её и не бывает. Но если
// человек в клубе есть, связать полезно — тогда в карточке виден телефон.
function clientPicker(parent, initialId, opts) {
  const o = opts || {};
  const state = { id: initialId || null };
  const input = document.createElement('input');
  const current = clientById(initialId);
  input.value = current ? current.name : '';
  input.placeholder = o.placeholder || 'Имя или телефон — необязательно';
  wrapField(parent, o.label || 'Клиент центра', input);

  const results = el('div');
  parent.appendChild(results);

  const pick = (id) => { state.id = id; if (o.onChange) o.onChange(id); };

  let timer = null;
  input.addEventListener('input', () => {
    // Начали править текст — прежний выбор снят: иначе к серии осталась
    // бы привязана учётка, которую в поле уже не видно.
    pick(null);
    const query = input.value.trim();
    clearTimeout(timer);
    results.innerHTML = '';
    if (query.length < 2) return;
    timer = setTimeout(async () => {
      let found;
      try { found = await api('listClients', { query }); } catch (e) { return; }
      results.innerHTML = '';
      const row = el('div', 'acts');
      // Заблокированных не предлагаем: записать их всё равно нельзя, а в
      // списке они путают — особенно когда однофамильцев несколько.
      const shown = found.clients.filter(c => c.status !== 'blocked').slice(0, 6);
      shown.forEach(c => {
        row.appendChild(btn(c.name + ' · ' + fmtPhone(c.phone), 'btn sm sec', () => {
          pick(c.id);
          input.value = c.name + ' · ' + fmtPhone(c.phone);
          results.innerHTML = '';
        }));
      });
      // Однофамильцев в клубе будет много, и разбирать их по имени
      // бесполезно — поэтому телефон стоит в самой кнопке, а искать по
      // нему можно так же, как по имени (сервер сверяет цифры).
      if (!shown.length) row.appendChild(txt('span', 't2', 'Никого не нашлось — попробуйте телефон'));
      else if (found.clients.length > shown.length) {
        row.appendChild(txt('span', 't2', 'Показаны первые ' + shown.length
          + ' из ' + found.clients.length + ' — уточните запрос'));
      }
      results.appendChild(row);
    }, 350);
  });

  return state;
}

// Сохранение расписания отличается от прочих действий одним: сервер
// отказывает списком — вот эти брони мешают. Показать этот список важнее,
// чем сказать «не получилось».
async function saveSchedule(action, payload, okText) {
  try {
    await api(action, payload);
    await reload();
    toast(okText);
    return true;
  } catch (e) {
    if (e.code === 'unauthorized' || e.code === 'token-revoked') { logout(); return false; }
    if (e.code === 'bookings-clash' || e.code === 'outside-hours-conflict') {
      showClashes(e.data);
      return false;
    }
    toast(errorText(e.code), 4000);
    return false;
  }
}

function showClashes(data) {
  const body = el('div');
  body.innerHTML = '<h3>Мешают уже заведённые брони</h3>'
    + '<div class="m-sub">Сначала перенесите или отмените их, потом повторите правку.</div>';

  (data.bookings || []).forEach(b => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(longDate(b.date) + ', ' + b.start + '–' + b.end) + '</div>'
      + '<div class="t2">' + escapeHtml(courtName(b.courtId) + (b.who ? ' · ' + b.who : '')) + '</div>';
    body.appendChild(it);
  });

  (data.series || []).forEach(s => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">↻ ' + escapeHtml(s.title) + '</div>'
      + '<div class="t2">' + escapeHtml(seriesSchedule(s, true) + ', ' + s.start + '–' + s.end) + '</div>';
    body.appendChild(it);
  });

  const shown = (data.bookings || []).length + (data.series || []).length;
  if (data.total > shown) {
    body.appendChild(txt('div', 'empty', 'И ещё ' + (data.total - shown) + '. Показаны первые.'));
  }

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Понятно', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

// Цвет постоянной брони: групповая тренировка одним, индивидуальная
// другим — в сетке дня это видно взглядом, без чтения подписей.
//
// Палитра приходит с сервера и там же проверяется: произвольный цвет
// рано или поздно оказывается нечитаемым или неотличимым от «корт
// закрыт». Клиентам на сайте цвета не показываются вовсе.
function colorPicker(s) {
  const wrap = el('div', 'swatches');
  const colors = db.seriesColors || [];

  colors.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch c-' + c.id + ((s.color || 'grass') === c.id ? ' on' : '');
    b.title = c.name;
    b.addEventListener('click', async () => {
      try {
        await api('setSeriesColor', { seriesId: s.id, color: c.id });
        s.color = c.id;
        render();
        toast('Цвет: ' + c.name.toLowerCase());
      } catch (e) { toast(errorText(e.code), 3500); }
    });
    wrap.appendChild(b);
  });

  return wrap;
}

function nextOccurrences(s, n) {
  const out = [];
  for (let i = 0; i < 60 && out.length < n; i++) {
    const date = addDays(todayIso(), i);
    if (!s.active) break;
    if (s.from && date < s.from) continue;
    if (s.to && date > s.to) break;
    if (seriesDays(s).indexOf(weekday(date)) === -1) continue;
    if ((s.skipDates || []).indexOf(date) !== -1) continue;
    out.push(date);
  }
  return out;
}



// ---------- Импорт «Корзин игроков» ----------
//
// Сервер разбирает файл и возвращает предложения. Ставит уровни не он,
// а человек: одно и то же ФИО в корзинах бывает у двух разных игроков,
// и автоматическое проставление здесь означало бы тихо перепутать людей.

async function parseNtrpFile(dataUrl) {
  toast('Разбираем файл…');
  let res;
  try {
    res = await api('adminParseNtrp', { file: dataUrl });
  } catch (e) {
    toast(e.code === 'not-xlsx' ? 'Это не файл Excel (.xlsx)' : errorText(e.code), 4000);
    return;
  }
  showNtrpProposals(res);
}

function showNtrpProposals(res) {
  const body = el('div');
  const s = res.summary;
  body.innerHTML = '<h3>Корзины игроков</h3>'
    + '<div class="m-sub">' + escapeHtml(res.sheets.map(x => x.name + ' — ' + x.count).join(', ')) + '</div>';

  const sum = el('div', 'item');
  sum.innerHTML = '<div class="t1">Всего в файле: ' + s.total + '</div>'
    + '<div class="t2">Совпало с клиентами центра: <b>' + s.match + '</b>'
    + ' · уже стоит такой уровень: ' + s.same
    + ' · требуют решения: ' + s.ambiguous
    + ' · нет в центре: ' + s.unknown + '</div>';
  body.appendChild(sum);

  const ready = res.proposals.filter(p => p.status === 'match' && !p.same);
  const doubtful = res.proposals.filter(p => p.status === 'ambiguous' && p.candidates.length);

  const chosen = new Map();
  ready.forEach(p => chosen.set(p.clientId, p.ntrp));

  if (!ready.length) {
    body.appendChild(txt('div', 'empty',
      'Ставить нечего: совпавших с центром строк нет или уровни уже проставлены.'));
  } else {
    body.appendChild(txt('div', 'section-title', 'Поставим уровень'));
    ready.forEach(p => {
      const row = el('div', 'item');
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;gap:9px;align-items:flex-start;cursor:pointer';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = true; cb.style.marginTop = '3px';
      cb.addEventListener('change', () => {
        if (cb.checked) chosen.set(p.clientId, p.ntrp); else chosen.delete(p.clientId);
      });
      const span = document.createElement('span');
      span.innerHTML = '<b>' + escapeHtml(p.candidates[0].name) + '</b>'
        + ' <span class="pill ok">уровень ' + String(p.ntrp).replace('.', ',') + '</span>'
        + '<div class="t2">в файле: ' + escapeHtml(p.name + ' · ' + p.sheet)
        + (p.currentNtrp != null ? ' · сейчас ' + String(p.currentNtrp).replace('.', ',') : '')
        + '</div>';
      label.appendChild(cb); label.appendChild(span);
      row.appendChild(label);
      body.appendChild(row);
    });
  }

  // Спорные не предлагаем к простановке вовсе — только показываем, где
  // смотреть. Галочка здесь означала бы «мы всё-таки угадали», а мы нет.
  if (doubtful.length) {
    body.appendChild(txt('div', 'section-title', 'Решать вам'));
    body.appendChild(txt('div', 'empty',
      'Одно и то же имя стоит в файле на разных уровнях или совпало с несколькими учётками. '
      + 'Поставьте уровень руками в карточке клиента.'));
    doubtful.forEach(p => {
      const row = el('div', 'item');
      row.innerHTML = '<div class="t1">' + escapeHtml(p.name)
        + ' <span class="pill wait">уровень ' + String(p.ntrp).replace('.', ',') + '</span></div>'
        + '<div class="t2">' + escapeHtml(p.sheet) + ' · кандидаты: '
        + escapeHtml(p.candidates.map(c => c.name + ' ' + fmtPhone(c.phone)).join(', ')) + '</div>';
      body.appendChild(row);
    });
  }

  const acts = el('div', 'm-acts');
  if (ready.length) {
    acts.appendChild(btn('Проставить отмеченные', 'btn', () => {
      const items = [...chosen.entries()].map(([clientId, ntrp]) => ({ clientId, ntrp }));
      if (!items.length) return toast('Ничего не отмечено');
      closeModal();
      act(() => api('adminApplyNtrp', { items }), 'Уровни проставлены');
    }));
  }
  acts.appendChild(btn('Закрыть', 'btn sec', closeModal));
  body.appendChild(acts);

  showModal(body);
}

// Игровой уровень в карточке клиента. Проставляет его человек, а не
// импорт: в мужских корзинах «Иванов Дмитрий» стоит и в 6.0, и в 4.5 —
// это два разных игрока, и сопоставить их по ФИО нельзя.
function ntrpField(c) {
  const row = el('div', 'row');
  row.style.marginTop = '8px';
  row.appendChild(txt('span', 't2', 'Игровой уровень:'));

  const sel = ntrpSelect(c.ntrp, '— не знаем —');
  sel.addEventListener('change', () => {
    act(() => api('setClientNtrp', { clientId: c.id, ntrp: sel.value === '' ? null : Number(sel.value) }),
      sel.value === '' ? 'Уровень снят' : 'Уровень сохранён');
  });
  row.appendChild(sel);

  // Где человек внутри деления. Это не второй рейтинг, а уточнение к
  // тому же числу: «в верхней части четвёрки, скоро следующее деление».
  // Своей рукой владелец ставит деление — копилка встаёт на него.
  if (c.level != null && c.ntrp != null && c.level !== c.ntrp) {
    row.appendChild(txt('span', 't2', 'копилка ' + String(c.level).replace('.', ',')
      + ' · ' + plural(c.levelMatches || 0, 'матч', 'матча', 'матчей')));
  }
  return row;
}

function plural(n, one, few, many) {
  const d10 = n % 10, d100 = n % 100;
  let word = many;
  if (d10 === 1 && d100 !== 11) word = one;
  else if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) word = few;
  return n + ' ' + word;
}

// ============================================================
// Вкладка: Открытые тренировки
// ============================================================
//
// Родилась из живой практики: заявки приходят организатору в личку, он
// сводит их в голове и правит закреплённый пост в группе, дописывая
// фамилии. Болит не отсутствие странички, а эти три ручные операции —
// поэтому вкладка построена вокруг состава, а не вокруг расписания.
//
// Неполный набор система не отменяет сама: она пишет владельцу, а он
// решает. Отсюда и обязательные кнопки — перенести человека, объединить
// два полупустых окна, поменять уровень. Сказать «людей мало» и не дать
// ничего сделать хуже, чем промолчать.

function openPlaySessions() {
  return (db.openplay && db.openplay.sessions) ? db.openplay.sessions : [];
}

function renderOpenPlay(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Открытые тренировки <span class="sub">набор идёт на сайте и в боте</span></h2>';
  view.appendChild(card);

  if (!db.openplay) { card.appendChild(txt('div', 'empty', 'Загружаем…')); return; }

  const acts = el('div', 'acts');
  acts.appendChild(btn('Создать окно', 'btn sm', () => openSessionForm(null, null)));
  // «Собрать день» — не шаблон на четыре окна, а предзаполнение прошлым
  // разом: сколько времени освободилось, столько окон и заводят.
  const sample = lastFilledDay();
  if (sample) {
    acts.appendChild(btn('Собрать день как ' + shortDate(sample.date), 'btn sm sec',
      () => openRepeatDay(sample)));
  }
  card.appendChild(acts);

  const live = openPlaySessions().filter(s => s.status !== 'cancelled');
  if (!live.length) {
    card.appendChild(txt('div', 'empty',
      'Пока ничего не назначено. Окно занимает корт как обычная бронь — сетка дня это учитывает.'));
    return;
  }

  const byDate = {};
  live.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });

  Object.keys(byDate).sort().forEach(date => {
    const head = el('div', 'section-title');
    head.textContent = longDate(date);
    view.appendChild(head);

    const wrap = el('div', 'card');
    byDate[date].forEach(s => wrap.appendChild(sessionRow(s)));

    // Полупустых окон в дне больше одного — самое время предложить их
    // слепить: ровно этот выход владелец и выбирает чаще всего.
    const thin = byDate[date].filter(s => s.openPlay.taken < db.openplay.minPlayers);
    if (thin.length > 1) {
      const hint = el('div', 'empty');
      hint.textContent = 'В этот день ' + thin.length + ' окна набраны меньше чем на '
        + db.openplay.minPlayers + '. Их можно объединить — кнопка в карточке окна.';
      wrap.appendChild(hint);
    }
    view.appendChild(wrap);
  });
}

function sessionRow(s) {
  const op = s.openPlay;
  const it = el('div', 'item' + (op.taken < db.openplay.minPlayers ? ' hl' : ''));
  it.dataset.sid = s.id;

  const courts = s.segments.map(x => courtName(x.courtId));
  // Тренировка занимает корты одновременно, поэтому «и», а не стрелка:
  // стрелка означает переход посреди игры, которого здесь нет.
  const parallel = s.segments.every(x => x.start === s.segments[0].start);
  const uniqueCourts = courts.filter((c, i) => courts.indexOf(c) === i).join(parallel ? ' и ' : ' → ');

  // В шапке строки — время, корты и деньги: то, что общее у обоих
  // составов. Всё остальное — внутри блока состава.
  it.innerHTML = '<div class="t1">' + escapeHtml(fmtRange(s.start, s.end))
    + (s.rival ? ' <span class="pill wait">два состава</span>' : '')
    + (s.decidedAt ? ' <span class="pill ok">состав определился</span>' : '') + '</div>'
    + '<div class="t2">' + escapeHtml(uniqueCourts) + ' · ' + money(s.total)
    + (s.openPlay.perPerson ? ' (' + money(s.openPlay.perPerson) + ' с человека)' : '')
    + '</div>';

  it.appendChild(rosterBlock(s, 'main'));

  // Второй состав на том же времени — своим блоком под первым. Играет
  // тот, кто соберётся первым; время при этом занято один раз.
  if (s.rival) {
    it.appendChild(txt('div', 't2', '⚔ Конкурирующий состав — играет тот, кто соберётся первым'));
    it.appendChild(rosterBlock(s, 'alt'));
  }

  const acts = el('div', 'acts');
  acts.appendChild(btn('Изменить', 'btn sm sec', () => openSessionForm(s, null)));
  if (!s.rival && !s.decidedAt) {
    acts.appendChild(btn('Второй состав', 'btn sm sec', () => openRivalForm(s)));
  }
  // Окно с двумя составами не сливается: непонятно, чей состав куда
  // переезжает. Кнопку не показываем, а не отказываем после нажатия.
  if (!s.rival
    && openPlaySessions().filter(x => x.date === s.date && x.id !== s.id
      && x.status !== 'cancelled' && !x.rival).length) {
    acts.appendChild(btn('Объединить', 'btn sm sec', () => openMergeSession(s)));
  }
  acts.appendChild(btn('Отменить', 'btn sm danger', () => confirmDelete(
    'Отменить тренировку?',
    op.title + ' · ' + longDate(s.date) + ' · ' + fmtRange(s.start, s.end),
    op.taken > 0
      ? 'Записаны ' + op.taken + ' человек. Корт освободится, участникам уйдёт уведомление.'
      : 'Корт освободится.',
    () => act(() => api('adminCancelBooking', { date: s.date, bookingId: s.id, reason: 'Тренировка отменена' }),
      'Тренировка отменена'))));
  it.appendChild(acts);

  return it;
}

// Один состав внутри строки тренировки: счётчик, список, свои кнопки.
// Вынесено отдельно ровно потому, что составов бывает два и рисовать их
// надо одинаково.
function rosterBlock(s, roster) {
  const op = roster === 'alt' ? s.rival : s.openPlay;
  const wrap = el('div', 'item');
  wrap.innerHTML = '<div class="t1">' + escapeHtml(op.title)
    + ' <span class="pill ' + (op.full ? 'ok' : 'wait') + '">'
    + op.taken + ' из ' + op.seats + '</span>'
    + (op.signupsClosed ? ' <span class="pill grey">набор закрыт</span>' : '')
    + '</div>'
    + '<div class="t2">' + escapeHtml(op.level) + '</div>'
    + (op.note ? '<div class="t2">' + escapeHtml(op.note) + '</div>' : '');

  if (!op.signups.length) wrap.appendChild(txt('div', 'empty', 'Никто ещё не записался.'));
  op.signups.forEach((p, i) => wrap.appendChild(signupRow(s, p, i + 1, false)));
  op.queue.forEach((p, i) => wrap.appendChild(signupRow(s, p, i + 1, true)));

  const acts = el('div', 'acts');
  acts.appendChild(btn('Записать', 'btn sm', () => openAddSignup(s, roster)));
  if (roster === 'alt') {
    acts.appendChild(btn('Изменить состав', 'btn sm sec', () => openSessionForm(s, null, 'alt')));
    acts.appendChild(btn('Распустить', 'btn sm danger', () => confirmDelete(
      'Распустить второй состав?', op.title,
      op.taken > 0
        ? 'Записанным (' + op.taken + ') уйдёт уведомление, что состав снят. Время останется за первым составом.'
        : 'В нём никого нет. Время останется за первым составом.',
      () => act(() => api('adminUpdateOpenPlay', { date: s.date, bookingId: s.id, alt: null }),
        'Второй состав распущен'))));
  }
  wrap.appendChild(acts);
  return wrap;
}

function signupRow(s, p, num, inQueue) {
  const row = el('div', 't2');
  const who = num + '. ' + p.name
    + (p.partnerName ? ' + ' + p.partnerName + ' (пара)' : '')
    + (p.phone ? ' · ' + fmtPhone(p.phone) : '')
    + (p.ntrp ? ' · уровень ' + String(p.ntrp).replace('.', ',') : '');

  row.innerHTML = (inQueue ? '<span class="pill grey">в очереди</span> ' : '')
    + escapeHtml(who)
    // Без Telegram человеку придётся звонить руками — это надо видеть
    // до того, как понадеешься на автоматическое уведомление.
    + (p.clientId && !p.hasTelegram ? ' <span class="pill wait">без Telegram</span>' : '')
    + (!p.clientId ? ' <span class="pill grey">без учётки</span>' : '');

  const acts = el('div', 'acts');
  acts.appendChild(btn('Перенести', 'btn sm sec', () => openMoveSignup(s, p)));
  acts.appendChild(btn('Убрать', 'btn sm sec', () => act(
    () => api('adminRemoveSignup', { date: s.date, bookingId: s.id, signupId: p.id }),
    'Снят с тренировки')));
  row.appendChild(acts);
  return row;
}

// Последний день, где окна уже заводили: он и предлагается как образец.
// Ничего не копится — смотрим то же окно в три недели вперёд, что и
// список; прошедшие дни сюда не попадают вовсе. Отменённые окна тоже:
// день, где всё отменили, — не образец.
function lastFilledDay() {
  const byDate = {};
  openPlaySessions().filter(s => s.status !== 'cancelled')
    .forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const dates = Object.keys(byDate).sort();
  return dates.length ? { date: dates[dates.length - 1], sessions: byDate[dates[dates.length - 1]] } : null;
}

// ---------- Окна: создание и правка ----------

function openSessionForm(session, preset, roster) {
  const which = roster === 'alt' ? 'alt' : 'main';
  const op = session ? (which === 'alt' ? session.rival : session.openPlay) : null;
  const body = el('div');
  body.innerHTML = '<h3>' + (session
    ? (which === 'alt' ? 'Изменить второй состав' : 'Изменить окно') : 'Новое окно') + '</h3>'
    + (session ? '<div class="m-sub">' + escapeHtml(longDate(session.date) + ' · ' + fmtRange(session.start, session.end)) + '</div>' : '');

  // Время и корт у существующего окна меняются переносом брони — тем же
  // действием, что и у обычной. Дублировать его здесь значило бы завести
  // вторую, расходящуюся реализацию переноса.
  let inpDate, selStart, selDur;
  if (!session) {
    const fDate = el('label', 'field'); fDate.innerHTML = '<span>Дата</span>';
    inpDate = document.createElement('input'); inpDate.type = 'date';
    inpDate.value = (preset && preset.date) || state.date;
    fDate.appendChild(inpDate); body.appendChild(fDate);

    const fStart = el('label', 'field'); fStart.innerHTML = '<span>Начало</span>';
    selStart = document.createElement('select');
    for (let m = timeToMinutes(db.config.openTime); m < timeToMinutes(db.config.closeTime); m += db.config.slotStep) {
      selStart.appendChild(opt(minutesToTime(m), fmtTime(minutesToTime(m))));
    }
    selStart.value = (preset && preset.start) || '18:00';
    fStart.appendChild(selStart); body.appendChild(fStart);

    const fDur = el('label', 'field'); fDur.innerHTML = '<span>Длительность</span>';
    selDur = document.createElement('select');
    [90, 120, 150, 180, 210, 240].forEach(m => selDur.appendChild(opt(m, hoursText(m))));
    selDur.value = String((preset && preset.durationMinutes) || 150);
    fDur.appendChild(selDur); body.appendChild(fDur);

    // Корт не выбирается: тренировка занимает центр целиком. Сказать об
    // этом надо здесь, а не после отказа «время занято».
    body.appendChild(txt('div', 'empty',
      'Тренировка занимает все корты центра на это время, и цена считается за них все. '
      + 'Если хотя бы один корт занят, окно не создастся.'));
  }

  const fTitle = el('label', 'field'); fTitle.innerHTML = '<span>Подпись</span>';
  const inpTitle = document.createElement('input');
  inpTitle.placeholder = 'Групповая тренировка';
  inpTitle.value = op ? op.title : ((preset && preset.title) || '');
  fTitle.appendChild(inpTitle); body.appendChild(fTitle);

  const fLevel = el('div', 'field');
  fLevel.innerHTML = '<span>Игровой уровень — пусто значит «любой»</span>';
  const levelRow = el('div', 'row');
  const selMin = ntrpSelect(op ? op.ntrpMin : (preset ? preset.ntrpMin : null), 'от');
  const selMax = ntrpSelect(op ? op.ntrpMax : (preset ? preset.ntrpMax : null), 'до');
  levelRow.appendChild(selMin); levelRow.appendChild(selMax);
  fLevel.appendChild(levelRow); body.appendChild(fLevel);

  const fSeats = el('label', 'field'); fSeats.innerHTML = '<span>Мест</span>';
  const selSeats = document.createElement('select');
  for (let n = 2; n <= db.openplay.maxSeats; n++) selSeats.appendChild(opt(n, String(n)));
  selSeats.value = String(op ? op.seats : ((preset && preset.seats) || db.openplay.defaultSeats));
  fSeats.appendChild(selSeats); body.appendChild(fSeats);

  const fNote = el('label', 'field'); fNote.innerHTML = '<span>Примечание для игроков</span>';
  const inpNote = document.createElement('input');
  inpNote.placeholder = 'Например: с тренером, мячи центра';
  inpNote.value = op ? op.note : '';
  fNote.appendChild(inpNote); body.appendChild(fNote);

  // Второй состав можно завести сразу: владелец обычно так и вешает —
  // две конкурирующие группы на один хороший вечерний час.
  let rivalTitle = null;
  if (!session) {
    const fRival = el('label', 'field');
    fRival.innerHTML = '<span>Второй состав на это же время — пусто значит «не нужен»</span>';
    rivalTitle = document.createElement('input');
    rivalTitle.placeholder = 'Например: мужская одиночка';
    fRival.appendChild(rivalTitle); body.appendChild(fRival);
    body.appendChild(txt('div', 'empty',
      'Два состава делят одно время: играет тот, кто первым наберётся полностью, '
      + 'второй распускается — записанным уйдёт уведомление. Мест во втором столько же, '
      + 'потом можно поправить.'));
  }

  let closedFlag = op ? !!op.signupsClosed : false;
  if (session) {
    body.appendChild(check('Набор закрыт', closedFlag, v => { closedFlag = v; },
      'С сайта записаться будет нельзя. Администратор поставить сможет.'));
  }

  const acts = el('div', 'm-acts');
  acts.appendChild(btn(session ? 'Сохранить' : 'Создать', 'btn', () => {
    const payloadOp = {
      title: inpTitle.value.trim(),
      note: inpNote.value.trim(),
      ntrpMin: selMin.value === '' ? null : Number(selMin.value),
      ntrpMax: selMax.value === '' ? null : Number(selMax.value),
      seats: Number(selSeats.value),
    };
    if (payloadOp.ntrpMin !== null && payloadOp.ntrpMax !== null && payloadOp.ntrpMin > payloadOp.ntrpMax) {
      return toast('Уровень «от» больше, чем «до»');
    }

    closeModal();
    if (session) {
      payloadOp.signupsClosed = closedFlag;
      act(() => api('adminUpdateOpenPlay', {
        date: session.date, bookingId: session.id,
        roster: which === 'alt' ? 'alt' : undefined,
        openPlay: payloadOp,
      }), which === 'alt' ? 'Второй состав изменён' : 'Окно изменено');
    } else {
      const rival = rivalTitle && rivalTitle.value.trim();
      if (rival) payloadOp.alt = { title: rival };
      act(() => api('adminCreateOpenPlay', {
        date: inpDate.value, start: selStart.value, durationMinutes: Number(selDur.value),
        openPlay: payloadOp,
      }), rival ? 'Окно создано, составов два' : 'Окно создано');
    }
  }));
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);

  showModal(body);
}

// Второй состав к уже заведённому окну. Отдельным окошком, а не полем в
// форме правки: это не «настройка тренировки», а решение вешать на час
// вторую группу, и спрашивать надо ровно то, что её отличает.
function openRivalForm(s) {
  const body = el('div');
  body.innerHTML = '<h3>Второй состав</h3>'
    + '<div class="m-sub">' + escapeHtml(longDate(s.date) + ' · ' + fmtRange(s.start, s.end)) + '</div>';
  body.appendChild(txt('div', 'empty',
    'Играет тот состав, который первым наберётся полностью. Второй распускается — '
    + 'записанным уйдёт уведомление. Время центра при этом занято один раз.'));

  const fTitle = el('label', 'field'); fTitle.innerHTML = '<span>Подпись</span>';
  const inpTitle = document.createElement('input');
  inpTitle.placeholder = 'Например: мужская одиночка';
  fTitle.appendChild(inpTitle); body.appendChild(fTitle);

  const fLevel = el('div', 'field');
  fLevel.innerHTML = '<span>Игровой уровень — пусто значит «любой»</span>';
  const levelRow = el('div', 'row');
  const selMin = ntrpSelect(null, 'от');
  const selMax = ntrpSelect(null, 'до');
  levelRow.appendChild(selMin); levelRow.appendChild(selMax);
  fLevel.appendChild(levelRow); body.appendChild(fLevel);

  const fSeats = el('label', 'field'); fSeats.innerHTML = '<span>Мест</span>';
  const selSeats = document.createElement('select');
  for (let n = 2; n <= db.openplay.maxSeats; n++) selSeats.appendChild(opt(n, String(n)));
  selSeats.value = String(s.openPlay.seats);
  fSeats.appendChild(selSeats); body.appendChild(fSeats);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Завести', 'btn', () => {
    if (inpTitle.value.trim().length < 2) return toast('Укажите подпись состава');
    closeModal();
    act(() => api('adminUpdateOpenPlay', {
      date: s.date, bookingId: s.id,
      alt: {
        title: inpTitle.value.trim(),
        seats: Number(selSeats.value),
        ntrpMin: selMin.value === '' ? null : Number(selMin.value),
        ntrpMax: selMax.value === '' ? null : Number(selMax.value),
      },
    }), 'Второй состав заведён');
  }));
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

function ntrpSelect(value, placeholder) {
  const sel = document.createElement('select');
  sel.appendChild(opt('', placeholder));
  for (let v = 2; v <= 7; v += 0.5) sel.appendChild(opt(String(v), String(v).replace('.', ',')));
  sel.value = value == null ? '' : String(value);
  return sel;
}

// Повтор прошлого дня: форма открывается по одному окну за раз, с уже
// подставленными временем, уровнем и местами. Заводить их пачкой одним
// нажатием было бы удобнее ровно до первого раза, когда освободилось
// не столько же времени, сколько в прошлый раз.
function openRepeatDay(sample) {
  const body = el('div');
  body.innerHTML = '<h3>Собрать день как ' + escapeHtml(shortDate(sample.date)) + '</h3>'
    + '<div class="m-sub">Выберите окно — форма откроется с теми же уровнем, длительностью и числом мест.</div>';

  sample.sessions.forEach(s => {
    const dur = timeToMinutes(s.end) - timeToMinutes(s.start);
    const row = el('div', 'item');
    row.innerHTML = '<div class="t1">' + escapeHtml(fmtRange(s.start, s.end) + ' · ' + s.openPlay.title) + '</div>'
      + '<div class="t2">' + escapeHtml(s.openPlay.level + ' · ' + s.openPlay.seats + ' мест · ' + hoursText(dur)) + '</div>';
    row.appendChild(btn('Взять за образец', 'btn sm sec', () => {
      closeModal();
      openSessionForm(null, {
        date: state.date, start: s.start, durationMinutes: dur,
        title: s.openPlay.title, ntrpMin: s.openPlay.ntrpMin, ntrpMax: s.openPlay.ntrpMax,
        seats: s.openPlay.seats,
      });
    }));
    body.appendChild(row);
  });

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Закрыть', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

// ---------- Состав ----------

function openAddSignup(s, roster) {
  const which = roster === 'alt' ? 'alt' : 'main';
  const target = which === 'alt' ? s.rival : s.openPlay;
  const body = el('div');
  body.innerHTML = '<h3>Записать на тренировку</h3>'
    + '<div class="m-sub">' + escapeHtml(target.title + ' · ' + longDate(s.date) + ' · ' + fmtRange(s.start, s.end)) + '</div>';

  // Тот же поиск, что и при записи на корт: списком в три сотни имён
  // пользоваться нельзя.
  const guest = el('div');
  const who = clientPicker(body, null, {
    label: 'Клиент',
    placeholder: 'Имя или телефон — пусто значит «по имени»',
    onChange: (id) => { guest.hidden = !!id; },
  });

  const fName = el('label', 'field'); fName.innerHTML = '<span>Имя</span>';
  const inpName = document.createElement('input'); inpName.placeholder = 'Как записать';
  fName.appendChild(inpName);
  const fPhone = el('label', 'field'); fPhone.innerHTML = '<span>Телефон — не обязательно</span>';
  const inpPhone = document.createElement('input'); attachPhoneMask(inpPhone);
  fPhone.appendChild(inpPhone);
  guest.appendChild(fName); guest.appendChild(fPhone);
  body.appendChild(guest);

  const fPair = el('label', 'field');
  fPair.innerHTML = '<span>Партнёр — если пришли парой, займут два места</span>';
  const inpPair = document.createElement('input'); inpPair.placeholder = 'Имя партнёра';
  fPair.appendChild(inpPair); body.appendChild(fPair);

  const note = el('div', 'empty');
  note.textContent = (target.full
    ? 'Мест нет — запись уйдёт в очередь.'
    : 'Свободно мест: ' + target.left + '.')
    + (s.rival ? ' Человек может стоять только в одном из двух составов.' : '');
  body.appendChild(note);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Записать', 'btn', () => {
    if (!who.id && inpName.value.trim().length < 2) return toast('Найдите клиента или впишите имя');
    closeModal();
    act(() => api('adminAddSignup', {
      date: s.date, bookingId: s.id,
      roster: which === 'alt' ? 'alt' : undefined,
      clientId: who.id || undefined,
      name: who.id ? undefined : inpName.value.trim(),
      phone: who.id ? undefined : inpPhone.value.trim(),
      partnerName: inpPair.value.trim() || undefined,
    }), 'Записан');
  }));
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

function openMoveSignup(s, p) {
  const others = openPlaySessions().filter(x => x.id !== s.id && x.status !== 'cancelled');
  if (!others.length) return toast('Переносить некуда — других окон нет');

  const body = el('div');
  body.innerHTML = '<h3>Перенести участника</h3>'
    + '<div class="m-sub">' + escapeHtml(p.name + (p.partnerName ? ' + ' + p.partnerName : '')) + '</div>';

  const fTo = el('label', 'field'); fTo.innerHTML = '<span>Куда</span>';
  const selTo = document.createElement('select');
  others.forEach(x => selTo.appendChild(opt(x.id,
    shortDate(x.date) + ' ' + fmtRange(x.start, x.end) + ' · ' + x.openPlay.title
    + ' (' + x.openPlay.taken + '/' + x.openPlay.seats + ')')));
  fTo.appendChild(selTo); body.appendChild(fTo);

  body.appendChild(txt('div', 'empty',
    'Если в новом окне мест нет, человек встанет в его очередь — потерять его перенос не может.'));

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Перенести', 'btn', () => {
    const to = others.find(x => x.id === selTo.value);
    closeModal();
    act(() => api('adminMoveSignup', {
      date: s.date, fromBookingId: s.id, toBookingId: to.id, signupId: p.id,
    }), 'Перенесён');
  }));
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

function openMergeSession(s) {
  const others = openPlaySessions().filter(x => x.id !== s.id && x.date === s.date && x.status !== 'cancelled');
  if (!others.length) return toast('Объединять не с чем');

  const body = el('div');
  body.innerHTML = '<h3>Объединить окна</h3>'
    + '<div class="m-sub">Все записанные переедут в «' + escapeHtml(s.openPlay.title) + '», '
    + escapeHtml(fmtRange(s.start, s.end)) + '</div>';

  const fFrom = el('label', 'field'); fFrom.innerHTML = '<span>Откуда забрать людей</span>';
  const selFrom = document.createElement('select');
  others.forEach(x => selFrom.appendChild(opt(x.id,
    fmtRange(x.start, x.end) + ' · ' + x.openPlay.title + ' (' + x.openPlay.taken + ' чел.)')));
  fFrom.appendChild(selFrom); body.appendChild(fFrom);

  body.appendChild(txt('div', 'empty',
    'Корт под опустевшим окном останется занят — отменить его нужно отдельно, если он не нужен. '
    + 'Если мест не хватит, лишние встанут в очередь: увеличьте число мест заранее.'));

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Объединить', 'btn', () => {
    const from = selFrom.value;
    closeModal();
    act(() => api('adminMergeOpenPlay', {
      date: s.date, targetBookingId: s.id, sourceBookingId: from,
    }), 'Окна объединены');
  }));
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
}

// Клик по тренировке в сетке дня. Вкладка «День» состава не читает —
// он приходит только с adminOpenPlayWeek, — поэтому отсюда честно
// отправляем на вкладку, где всё есть, а не показываем полупустую
// карточку с «загружаем».
// Из сетки переходим не просто на вкладку, а к самому окну: в дне их
// бывает четыре, и «ищите нужное сами» — ровно та работа, ради которой
// состав и вынесен в клетку.
function openSessionFromGrid(b) {
  state.tab = 'openplay';
  state.focusSession = b.id;
  closeModal();
  reload().catch(() => toast('Не удалось открыть тренировку'));
}

// Подсветка живёт до следующей перерисовки: панель перечитывает себя
// целиком, и снимать её отдельно было бы нечем.
function focusSessionRow() {
  if (!state.focusSession) return;
  const row = document.querySelector('[data-sid="' + state.focusSession + '"]');
  state.focusSession = null;
  if (!row) return;
  row.classList.add('flash');
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// ============================================================
// Вкладка: Афиша турниров
// ============================================================
//
// Ведёт афишу только владелец: она говорит от имени клуба, и правку в
// ней видит весь город. Администратору она показывается — знать, что в
// субботу турнир, ему нужно, — но без кнопок.

function renderEvents(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Афиша турниров <span class="sub">видна на главной странице сайта</span></h2>';
  view.appendChild(card);

  if (!db.events) {
    card.appendChild(txt('div', 'empty', 'Загружаем афишу…'));
    return;
  }

  const canEdit = !!db.events.canEdit;

  if (!db.events.events.length) {
    card.appendChild(txt('div', 'empty', canEdit
      ? 'Турниров пока нет. Добавленный появится на главной сразу.'
      : 'Турниров пока нет. Добавить турнир может владелец.'));
  }

  db.events.events.forEach(e => {
    const it = el('div', 'item' + (e.past ? ' past' : ''));
    it.innerHTML = '<div class="t1">' + escapeHtml(e.title)
      + ' <span class="pill ' + (e.past ? 'grey' : 'wait') + '">' + escapeHtml(e.categoryName) + '</span>'
      + (e.past ? ' <span class="pill grey">прошёл</span>' : '') + '</div>'
      + '<div class="t2">' + escapeHtml(longDate(e.date))
      + (e.note ? ' · ' + escapeHtml(e.note) : '') + '</div>';

    if (canEdit) {
      const acts = el('div', 'acts');
      acts.appendChild(btn('Изменить', 'btn sm sec', () => openEventForm(e)));
      acts.appendChild(btn('Удалить', 'btn sm danger', () => confirmDelete(
        'Удалить турнир?', e.title + ' · ' + longDate(e.date),
        'Объявление пропадёт с главной страницы сразу.',
        () => act(() => api('deleteEvent', { id: e.id }), 'Турнир удалён'))));

    card.appendChild(it);
  });

  if (canEdit) {
    const acts = el('div', 'acts');
    acts.appendChild(btn('Добавить турнир', 'btn sm', () => openEventForm(null)));
    card.appendChild(acts);
  }

  renderNews(view);
}

// Новости из группы клуба. Модерация здесь доступна любому
// администратору, в отличие от афиши: текст пишет сам клуб в своей
// группе, а здесь решается не «что написать», а «показывать ли».
function renderNews(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Новости из группы <span class="sub">попадают сюда черновиком</span></h2>';
  view.appendChild(card);

  if (!db.news) {
    card.appendChild(txt('div', 'empty', 'Загружаем…'));
    return;
  }

  if (!db.news.enabled) {
    card.appendChild(txt('div', 'empty', 'Сбор новостей выключен в настройках центра.'));
  }

  if (!db.news.news.length) {
    card.appendChild(txt('div', 'empty',
      'Постов ещё не было. Бот забирает из группы только те, где есть один из хештегов: '
      + db.news.hashtags.join(', ') + '. Всё остальное в чате он пропускает мимо.'));
    return;
  }

  db.news.news.forEach(n => {
    const it = el('div', 'item' + (n.status === 'draft' ? ' hl' : ''));

    const row = el('div', 'goods');
    if (n.photoUrl) {
      const pic = el('div', 'thumb');
      const img = document.createElement('img');
      img.src = n.photoUrl; img.alt = '';
      img.addEventListener('error', () => { pic.innerHTML = ''; pic.classList.add('empty-thumb'); });
      pic.appendChild(img);
      row.appendChild(pic);
    }

    const text = el('div', 'goods-text');
    text.innerHTML = '<div class="t1">'
      + (n.status === 'draft' ? '<span class="pill wait">черновик</span>'
        : '<span class="pill ok">на сайте</span>')
      + ' <span class="t2" style="display:inline">' + escapeHtml(shortDateTime(n.postedAt)) + '</span></div>'
      + '<div class="t2" style="white-space:pre-line">' + escapeHtml(n.text || '(только фотография)') + '</div>';
    row.appendChild(text);
    it.appendChild(row);

    const acts = el('div', 'acts');
    if (n.status === 'draft') {
      acts.appendChild(btn('Опубликовать', 'btn sm', () =>
        act(() => api('setNewsStatus', { id: n.id, status: 'published' }), 'Новость на сайте')));
    } else {

      () => act(() => api('deleteNews', { id: n.id }), 'Новость удалена'))));

function renderCatalog(view) {

    const text = el('div', 'goods-text');

function priceText(item) {
  const parts = [];
  if (item.options && item.options.length) {
    parts.push(item.options.map(o => o.name + ' — ' + (o.price == null ? 'по запросу' : money(o.price))).join(' · '));
  } else if (item.price == null) {
    parts.push('Цена по запросу');
  } else {
    parts.push(money(item.price) + (item.priceNote ? ' ' + item.priceNote : ''));
  }
  return parts.join(' · ');
}

// чему прикреплять. Для человека это одно нажатие «Сохранить».

  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка позиции' : 'Новая позиция') + '</h3>'
    + '<div class="m-sub">Появится на витрине главной страницы.</div>';

  const cat = document.createElement('select');
  Object.keys(db.catalog.categories).forEach(id => cat.appendChild(opt(id, db.catalog.categories[id])));

  wrapField(body, 'Раздел', cat);

  const name = document.createElement('input');
  name.value = existing ? existing.name : '';

  wrapField(body, 'Название', name);

  const desc = document.createElement('textarea');
  desc.rows = 3;
  desc.value = existing ? existing.description : '';
  desc.placeholder = 'Вес, размер, состояние — что важно знать покупателю';

  // Уточняющий вопрос. У натяжки это «Струны — свои или клубные»: без

  const q = (existing && existing.question) || null;

  qWrap.appendChild(txt('div', 'field-label', 'Уточняющий вопрос — задаётся в форме заявки'));
  const qName = document.createElement('input');
  qName.value = q ? q.name : '';
  qName.placeholder = 'Например: Струны';
  wrapField(qWrap, 'Вопрос', qName);
  const qAnswers = document.createElement('input');
  qAnswers.value = q ? q.answers.join(', ') : '';
  qAnswers.placeholder = 'Свои, Клубные';
  wrapField(qWrap, 'Ответы через запятую — от двух до четырёх', qAnswers);
  qWrap.appendChild(txt('div', 'empty',
    'Пусто — вопроса не будет. Если вопрос задан, заявку без ответа система не примет.'));
  body.appendChild(qWrap);

  const available = check('В продаже', existing ? existing.available : true, () => {},
    'Снятая позиция остаётся здесь, но с витрины пропадает.');
  const availableBox = available.querySelector('input');
  body.appendChild(available);

  // Фотография
  let photoData = null;
  const photoWrap = el('div', 'field');
  photoWrap.innerHTML = '<span>Фотография</span>';
  const preview = el('div', 'thumb big');
  if (existing && existing.photoUrl) {

    img.src = existing.photoUrl; img.alt = '';
    preview.appendChild(img);
  } else {
    preview.classList.add('empty-thumb');
  }
  photoWrap.appendChild(preview);

  const file = document.createElement('input');
  file.type = 'file';
  file.accept = 'image/jpeg,image/png,image/webp';
  file.addEventListener('change', async () => {
    const chosen = file.files && file.files[0];
    if (!chosen) return;
    try {
      photoData = await shrinkImage(chosen, 1200, db.catalog.photoMaxBytes);
      preview.innerHTML = '';
      preview.classList.remove('empty-thumb');
      const img = document.createElement('img');
      img.src = photoData; img.alt = '';
      preview.appendChild(img);
    } catch (e) {
      photoData = null;
      toast('Не удалось прочитать файл — нужна фотография', 3600);
    }
