  photoWrap.appendChild(file);
  body.appendChild(photoWrap);

  if (existing && existing.photoUrl) {
    body.appendChild(btn('Убрать фотографию', 'btn sm sec', () => {
      closeModal();
      act(() => api('removeCatalogPhoto', { id: existing.id }), 'Фотография убрана');
    }));
  }

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  const save = btn(existing ? 'Сохранить' : 'Добавить', 'btn', async () => {
    if (name.value.trim().length < 2) { toast('Укажите название'); return; }
    save.disabled = true;

    const payload = {
      category: cat.value,
      name: name.value,
      description: desc.value,
      price: price.value === '' ? null : Number(price.value),
      priceNote: priceNote.value,
      contactPhone: contactPhone.value,
      options: readOptionRows(rows),
      question: {
        name: qName.value,
        answers: qAnswers.value.split(',').map(s => s.trim()).filter(Boolean),
      },
      available: availableBox.checked,
    };
    if (existing) payload.id = existing.id;

    closeModal();
    await act(async () => {
      const res = await api('saveCatalogItem', payload);
      if (photoData) await api('setCatalogPhoto', { id: res.item.id, photo: photoData });
      return res;
    }, existing ? 'Позиция изменена' : 'Позиция добавлена');
  });
  acts.appendChild(save);
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => name.focus(), 50);
}

function addOptionRow(wrap, option) {
  const row = el('div', 'opt-row');
  const name = document.createElement('input');
  name.placeholder = 'Например: для клиентов центра';
  name.value = option ? option.name : '';
  const price = document.createElement('input');
  price.type = 'number'; price.min = '0'; price.step = '50';
  price.placeholder = '₽';
  price.value = option && option.price != null ? String(option.price) : '';
  row.appendChild(name); row.appendChild(price);
  wrap.appendChild(row);
}

function readOptionRows(wrap) {
  return Array.prototype.map.call(wrap.querySelectorAll('.opt-row'), row => {
    const inputs = row.querySelectorAll('input');
    return { name: inputs[0].value, price: inputs[1].value === '' ? null : Number(inputs[1].value) };
  }).filter(o => o.name.trim());
}

// Фотографию ужимаем в браузере: в тело запроса к функции не должно
// уезжать восемь мегабайт прямо с телефона, а витрине хватает 1200
// пикселей по длинной стороне.
function shrinkImage(file, maxSide, maxBytes) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('not-an-image'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        // Прозрачный PNG на белом: иначе прозрачность станет чёрной.
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let quality = 0.85;
        let out = canvas.toDataURL('image/jpeg', quality);
        while (out.length * 0.75 > (maxBytes || 1500000) && quality > 0.4) {
          quality -= 0.12;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============================================================
// Вкладка: Турниры
// ============================================================
//
// Карточку и жеребьёвку ведёт владелец, счёт вбивает любой
// администратор: турнир идёт в выходные, а владелец в это время играет
// сам. Права проверяет сервер, здесь только показ кнопок.
//
// Экран двухуровневый: перечень турниров и открытый турнир. Открытый
// приезжает отдельной частью склейки, потому что круговой на
// шестнадцать человек — это сто двадцать матчей, и таскать их вместе
// с перечнем незачем.

const T_STATUS = {
  signup: '<span class="pill wait">идёт запись</span>',
  groups: '<span class="pill ok">групповой этап</span>',
  playoff: '<span class="pill ok">плей-офф</span>',
  finished: '<span class="pill grey">завершён</span>',
};

const T_SCORING = {
  set1: 'один сет',
  set2: 'два сета',
  proset8: 'про-сет до 8',
};

// Места словами — для подписи «Только третьи места» в настройке БЕТА.
const PLACE_WORDS = {
  2: 'вторые', 3: 'третьи', 4: 'четвёртые', 5: 'пятые',
  6: 'шестые', 7: 'седьмые', 8: 'восьмые', 9: 'девятые',
};

function tournamentDates(t) {
  const days = t.dateFrom === t.dateTo ? longDate(t.dateFrom)
    : longDate(t.dateFrom) + ' — ' + longDate(t.dateTo);
  // Время показываем через fmtTime: клубные сутки уходят за полночь, и
  // «25:00» человеку писать нельзя.
  if (t.dateFrom !== t.dateTo || !t.timeFrom) return days;
  return days + ', ' + fmtTime(t.timeFrom) + (t.timeTo ? '–' + fmtTime(t.timeTo) : '');
}

function renderTournaments(view) {
  if (state.tournamentId) { renderTournamentCard(view); return; }

  const card = el('div', 'card');
  card.innerHTML = '<h2>Турниры <span class="sub">сетка видна клиентам на отдельной странице</span></h2>';
  view.appendChild(card);

  if (!db.tournaments) {
    card.appendChild(txt('div', 'empty', 'Загружаем турниры…'));
    return;
  }

  const canEdit = !!db.tournaments.canEdit;
  const list = db.tournaments.tournaments || [];

  if (!list.length) {
    card.appendChild(txt('div', 'empty', canEdit
      ? 'Турниров пока нет. Заведённый сразу откроется для записи.'
      : 'Турниров пока нет. Заводит их владелец.'));
  }

  list.forEach(t => {
    const it = el('div', 'item' + (t.status === 'finished' ? ' past' : ''));
    it.innerHTML = '<div class="t1">' + escapeHtml(t.title) + ' '
      + (T_STATUS[t.status] || '') + '</div>'
      + '<div class="t2">' + escapeHtml(tournamentDates(t))
      + ' · ' + escapeHtml(t.level)
      + ' · ' + t.taken + ' из ' + t.maxParticipants
      + (t.fee ? ' · взнос ' + t.fee + ' ₽' : ' · без взноса')
      + (t.signupsClosed ? ' · запись закрыта' : '') + '</div>';

    const acts = el('div', 'acts');
    acts.appendChild(btn('Открыть', 'btn sm', () => {
      state.tournamentId = t.id;
      // Матчи открытого турнира в слепке ещё не лежат — дочитываем.
      reload().catch(() => toast('Не удалось загрузить турнир'));
    }));
    if (canEdit) {
      acts.appendChild(btn('Изменить', 'btn sm sec', () => openTournamentForm(t)));
      acts.appendChild(btn('Удалить', 'btn sm danger', () => confirmDelete(
        'Удалить турнир?', t.title + ' · ' + tournamentDates(t),
        'Пропадут состав, жеребьёвка и все результаты. Отменить это нельзя.',
        () => act(() => api('adminDeleteTournament', { id: t.id }), 'Турнир удалён'))));
    }
    it.appendChild(acts);
    card.appendChild(it);
  });

  if (canEdit) {
    const acts = el('div', 'acts');
    acts.appendChild(btn('Новый турнир', 'btn sm', () => openTournamentForm(null)));
    card.appendChild(acts);
  }

  renderTourPoints(view, canEdit);
}

// Зачёт очков — второй картой на той же вкладке. Устроен как таблицы
// владельца в Excel: строка на человека, колонка на турнир, сумма
// справа, места диапазонами при равенстве.
function renderTourPoints(view, canEdit) {
  const data = db.tourPoints;
  const card = el('div', 'card');
  card.innerHTML = '<h2>Зачёт очков <span class="sub">по итогам турниров сезона</span></h2>';
  view.appendChild(card);

  if (!data) { card.appendChild(txt('div', 'empty', 'Загружаем зачёт…')); return; }

  if ((data.seasons || []).length > 1) {
    const sel = document.createElement('select');
    data.seasons.forEach(s => sel.appendChild(opt(s, s + ' год')));
    sel.value = data.season;
    sel.addEventListener('change', () => {
      state.season = sel.value;
      reload().catch(() => toast('Не удалось загрузить зачёт'));
    });
    const row = el('div', 'row');
    row.appendChild(txt('span', 't2', 'Сезон:'));
    row.appendChild(sel);
    card.appendChild(row);
  }

  if (!(data.tables || []).length) {
    card.appendChild(txt('div', 'empty',
      'Очков пока нет. Они начисляются, когда завершён турнир с выбранными '
      + 'категорией и составом играющих.'));
  }

  (data.tables || []).forEach(table => {
    const box = el('div', 'item');
    box.appendChild(txt('div', 't1', table.label));

    // Таблица уезжает вбок на телефоне: колонок столько, сколько
    // турниров за сезон, и ужимать их нельзя — числа станут нечитаемы.
    const scroll = el('div', 'cross-wrap');
    let html = '<table class="tbl"><thead><tr><th>Место</th><th>Ф.И.О.</th>';
    table.events.forEach(ev => {
      html += '<th title="' + escapeHtml(ev.title) + '">' + escapeHtml(shortDate(ev.date)) + '</th>';
    });
    html += '<th>Сумма</th></tr></thead><tbody>';
    table.rows.forEach(r => {
      html += '<tr><td>' + escapeHtml(r.place) + '</td><td>' + escapeHtml(r.name) + '</td>';
      table.events.forEach(ev => {
        html += '<td>' + (r.scores[ev.id] == null ? '' : r.scores[ev.id]) + '</td>';
      });
      html += '<td><b>' + r.total + '</b></td></tr>';
    });
    html += '</tbody></table>';
    scroll.innerHTML = html;
    box.appendChild(scroll);
    card.appendChild(box);
  });

  if (canEdit) {
    const acts = el('div', 'acts');
    acts.appendChild(btn('Пересобрать зачёт', 'btn sm sec', () => confirmDelete(
      'Пересобрать зачёт?', 'Сезон ' + data.season,
      'Очки будут посчитаны заново по всем турнирам. Нужно, если правили счёт '
      + 'задним числом, меняли категорию турнира или начисление в настройках. '
      + 'Потерять здесь нечего — зачёт всегда собирается из турниров.',
      () => act(() => api('adminRebuildTourPoints', {}), 'Зачёт пересобран'))));
    card.appendChild(acts);
  }
}

// Дата турнира в шапке колонки — как у владельца в таблицах: «01.03».
function shortDate(iso) {
  const s = String(iso || '');
  return s.length >= 10 ? s.slice(8, 10) + '.' + s.slice(5, 7) : s;
}

function renderTournamentCard(view) {
  const back = el('div', 'acts');
  back.appendChild(btn('← Ко всем турнирам', 'btn sm sec', () => {
    state.tournamentId = null;
    render();
  }));
  view.appendChild(back);

  const t = db.tournament;
  if (!t || t.id !== state.tournamentId) {
    const card = el('div', 'card');
    card.appendChild(txt('div', 'empty', 'Загружаем турнир…'));
    view.appendChild(card);
    return;
  }

  const canEdit = !!(db.tournaments && db.tournaments.canEdit);

  const head = el('div', 'card');
  head.innerHTML = '<h2>' + escapeHtml(t.title) + ' ' + (T_STATUS[t.status] || '') + '</h2>'
    + '<div class="t2">' + escapeHtml(tournamentDates(t))
    + ' · ' + escapeHtml(t.level)
    + ' · счёт: ' + escapeHtml(T_SCORING[t.scoring.mode] || '')
    + (t.scoring.mode === 'set2'
      ? (t.scoring.decider === 'tb10' ? ', решающий — тай-брейк до 10' : ', решающий — полный сет') : '')
    + (t.fee ? ' · взнос ' + t.fee + ' ₽, собрано ' + t.feeTotal + ' ₽' : ' · без взноса')
    + '</div>'
    + (t.note ? '<div class="t2">' + escapeHtml(t.note) + '</div>' : '');
  view.appendChild(head);

  const acts = el('div', 'acts');
  // Ссылка на публичную сетку — она же и печатается. Открываем в новой
  // вкладке: панель у стойки держат открытой весь день.
  const link = document.createElement('a');
  link.className = 'btn sm sec';
  link.href = 'tournament.html?t=' + encodeURIComponent(t.id);
  link.target = '_blank';
  link.rel = 'noopener';
  link.textContent = 'Сетка и печать';
  acts.appendChild(link);

  if (canEdit && !t.drawnAt) {
    acts.appendChild(btn('Провести жеребьёвку', 'btn sm', () => confirmDraw(t)));
  }
  if (canEdit && t.drawnAt && t.status !== 'finished') {
    acts.appendChild(btn('Сбросить жеребьёвку', 'btn sm sec', () => confirmDelete(
      'Сбросить жеребьёвку?', t.title,
      'Группы и сетка будут собраны заново. Это возможно, только пока не сыгран ни один матч.',
      () => act(() => api('adminTournamentResetDraw', { id: t.id }), 'Жеребьёвка сброшена'))));
  }
  if (t.canStartPlayoff) {
    acts.appendChild(btn('Запустить плей-офф', 'btn sm', () =>
      act(() => api('adminStartPlayoff', { id: t.id }), 'Плей-офф собран')));
  }
  if (canEdit && t.finished && !t.countedAt) {
    acts.appendChild(btn('Завершить турнир', 'btn sm', () => confirmFinish(t)));
  }
  // Сводку могли закрыть не глядя, а счёт — поправить задним числом.
  // Расчёт детерминированный, повторяется из текущих данных сколько
  // угодно раз, поэтому кнопка остаётся, пока уровни не применены.
  if (canEdit && t.countedAt && !t.levelAppliedAt) {
    acts.appendChild(btn('Пересчитать уровни', 'btn sm', async () => {
      const res = await act(() => api('adminLevelPreview', { id: t.id }));
      if (res && res.levels) openLevels(t, res.levels);
    }));
  }
  head.appendChild(acts);

  // Корты под турнир. Время правится здесь же, правкой карточки: время
  // турнира и время закрытия — одно и то же, и разъезжаться им нельзя.
  if (t.blockCourts && db.courtsBlocked) {
    const where = t.blockCourtId == null ? 'Оба корта заняты' : courtName(t.blockCourtId) + ' занят';
    head.appendChild(txt('div', 'empty', where + ' под турнир: '
      + fmtTime(t.timeFrom) + '–' + fmtTime(t.timeTo) + '. Игр стало меньше — '
      + 'нажмите «Изменить» и ужмите время, освободившееся вернётся в продажу.'));
  }

  // Закрытие не встало: в это время стояла чужая бронь. Убрали её —
  // занять корты можно одной кнопкой, не заполняя форму заново.
  if (canEdit && t.blockCourts && !db.courtsBlocked) {
    const warn = el('div', 'notice');
    warn.textContent = 'Корты под турнир не заняты — в это время стояла чужая бронь. '
      + 'Перенесите или отмените её, и нажмите «Занять корты».';
    head.appendChild(warn);
    const row = el('div', 'acts');
    row.appendChild(btn('Занять корты', 'btn sm', async () => {
      try {
        await api('adminTournamentCourts', { id: t.id });
        await reload();
        toast('Корты заняты под турнир');
      } catch (e) {
        if (e.code === 'bookings-clash') {
          const who = ((e.data && e.data.bookings) || []).map(b => b.clientName || 'бронь').join(', ');
          toast('Это время всё ещё занято: ' + who, 6000);
        } else {
          toast(errorText(e.code), 4000);
        }
      }
    }));
    head.appendChild(row);
  }

  if (t.countedAt) {
    head.appendChild(txt('div', 'empty',
      'Турнир завершён, сыгранное записано участникам в профиль.'
      + (t.levelAppliedAt ? ' Игровые уровни пересчитаны.' : ' Игровые уровни ещё не пересчитаны.')));
  }

  // Итоги — сразу под шапкой: за ними обращаются чаще всего, когда
  // турнир доигран.
  if (t.podium && t.podium.length) {
    const board = el('div', 'card');
    board.innerHTML = '<h2>Итоги</h2>';
    const medals = ['🥇', '🥈', '🥉'];
    t.podium.forEach(row => {
      const line = el('div', 'item');
      line.innerHTML = '<div class="t1"><span class="medal">' + medals[row.place - 1] + '</span> '
        + escapeHtml(row.name || '') + '</div>'
        + '<div class="t2">' + row.place + ' место</div>';
      board.appendChild(line);
    });
    view.appendChild(board);
  }

  renderTournamentRoster(view, t, canEdit);
  (t.groups || []).forEach(g => renderTournamentGroup(view, t, g));
  // Клуб зовёт сетки «АЛЬФА» и «БЕТА», и людям знакомы именно эти
  // названия — в объявлениях турнира стоят они.
  renderTournamentBracket(view, t, 'main', 'АЛЬФА', 'основная сетка');
  renderThirdPlace(view, t, t.third, 'Матч за третье место АЛЬФА');
  renderTournamentBracket(view, t, 'consolation', 'БЕТА', betaSub(t));
  renderThirdPlace(view, t, t.consThird, 'Матч за третье место БЕТА');
}

// Кого собрали в БЕТА — подпись читается с настройки турнира, чтобы
// администратор не гадал, почему четвёртых мест в сетке нет.
function betaSub(t) {
  const places = (t.format && t.format.consolationPlaces) || 0;
  if (places === 1) return 'третьи места из групп';
  if (places > 1) return 'места с третьего по ' + (2 + places) + '-е';
  return 'кто не вышел из группы';
}

function renderThirdPlace(view, t, match, title) {
  if (!match) return;
  const card = el('div', 'card');
  card.innerHTML = '<h2>' + escapeHtml(title) + '</h2>';
  if (!match.a && !match.b) {
    card.appendChild(txt('div', 'empty', 'Играют проигравшие в полуфиналах — ждём их.'));
  } else {
    card.appendChild(matchRow(t, match));
  }
  view.appendChild(card);
}

// Кто ещё не сдал взнос. Снявшегося считаем должником, только если он
// успел сыграть: не вышедший на корт не должен ничего, а отыгравший
// группу и ушедший — должен. Сколько с него взять — решает организатор,
// наше дело показать, что человек в списке.
function feeDebtors(t) {
  if (!t.fee) return [];
  return (t.participants || []).filter(p => !p.paid && (p.status !== 'withdrawn' || p.played));
}

function renderTournamentRoster(view, t, canEdit) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Состав <span class="sub">' + t.taken + ' из ' + t.maxParticipants + '</span></h2>';
  view.appendChild(card);

  // Взносы сдают весь день по мере прихода, поэтому в списке отмечены обе
  // стороны: и кто внёс, и с кого ещё причитается.
  const debtors = new Set(feeDebtors(t).map(p => p.id));

  if (!t.participants.length) {
    card.appendChild(txt('div', 'empty', 'Пока никто не записан.'));
  }

  if (!t.drawnAt && t.participants.length) {
    card.appendChild(txt('div', 'empty',
      'Номер — это место в списке записи, он же будет на мяче во время жеребьёвки. '
      + 'Отметьте сеяных: они разойдутся по разным группам, а в какую попадёт каждый — жребий.'));
  }

  if (t.fee && t.participants.length) {
    const due = debtors.size * t.fee;
    card.appendChild(txt('div', 'empty', 'Взносы: собрано ' + t.feeTotal + ' из '
      + (t.feeTotal + due) + ' ₽'
      + (debtors.size ? ' · не сдали ' + debtors.size + ', ещё ' + due + ' ₽' : ' · сдали все')));
  }

  t.participants.forEach(p => {
    const it = el('div', 'item' + (p.status === 'withdrawn' ? ' past' : ''));
    it.innerHTML = '<div class="t1"><b>' + p.number + '.</b> ' + escapeHtml(p.name)
      + (p.seeded ? ' <span class="pill ok">сеяный</span>' : '')
      + (p.group ? ' <span class="pill grey">группа ' + escapeHtml(p.group) + '</span>' : '')
      + (p.status === 'withdrawn' ? ' <span class="pill bad">снялся</span>' : '')
      + (p.paid ? ' <span class="pill ok">взнос внесён</span>'
        : (debtors.has(p.id) ? ' <span class="pill bad">взнос не сдан</span>' : '')) + '</div>'
      + '<div class="t2">' + (p.ntrp == null ? 'уровень неизвестен' : 'уровень ' + String(p.ntrp).replace('.', ','))
      + (p.phone ? ' · ' + escapeHtml(p.phone) : '')
      + (p.replacedFrom ? ' · заменил: ' + escapeHtml(p.replacedFrom) : '') + '</div>';

    const acts = el('div', 'acts');
    if (!t.drawnAt && p.status !== 'withdrawn') {
      acts.appendChild(btn(p.seeded ? 'Убрать из сеяных' : 'Сеяный', 'btn sm sec', () =>
        act(() => api('adminTournamentParticipant',
          { id: t.id, op: 'seed', participantId: p.id, seeded: !p.seeded }),
        p.seeded ? 'Больше не сеяный' : 'Отмечен сеяным')));
    }
    if (t.fee) {
      acts.appendChild(btn(p.paid ? 'Снять отметку взноса' : 'Взнос внесён', 'btn sm sec', () =>
        act(() => api('adminTournamentParticipant',
          { id: t.id, op: 'paid', participantId: p.id, paid: !p.paid }), 'Отметка изменена')));
    }
    if (p.status !== 'withdrawn') {
      if (!t.drawnAt) {
        acts.appendChild(btn('Убрать', 'btn sm danger', () =>
          act(() => api('adminTournamentParticipant',
            { id: t.id, op: 'remove', participantId: p.id }), 'Убран из состава')));
      } else {
        acts.appendChild(btn('Заменить', 'btn sm sec', () => openPickClient(t,
          'Кем заменить: ' + p.name, (clientId) =>
            act(() => api('adminTournamentParticipant',
              { id: t.id, op: 'replace', participantId: p.id, clientId }), 'Участник заменён'))));
        acts.appendChild(btn('Снять с турнира', 'btn sm danger', () => confirmDelete(
          'Снять с турнира?', p.name,
          'Несыгранные матчи станут техническими поражениями, а в сетке соперники пройдут дальше. '
          + 'Сыгранное останется: оно уже вошло в очки других.',
          () => act(() => api('adminTournamentParticipant',
            { id: t.id, op: 'withdraw', participantId: p.id }), 'Участник снят'))));
      }
    }
    it.appendChild(acts);
    card.appendChild(it);
  });

  if (!t.drawnAt) {
    const add = el('div', 'acts');
    add.appendChild(btn('Добавить участника', 'btn sm', () => openPickClient(t, 'Кого записать', (clientId) =>
      act(() => api('adminTournamentParticipant', { id: t.id, op: 'add', clientId }), 'Записан'))));
    card.appendChild(add);
  }

  if (t.waitlist.length) {
    const wait = el('div', 'card');
    wait.innerHTML = '<h2>Лист ожидания <span class="sub">уровень не подошёл или состав полон</span></h2>';
    view.appendChild(wait);
    t.waitlist.forEach(p => {
      const it = el('div', 'item');
      it.innerHTML = '<div class="t1">' + escapeHtml(p.name) + '</div>'
        + '<div class="t2">' + (p.ntrp == null ? 'уровень неизвестен' : 'уровень ' + String(p.ntrp).replace('.', ','))
        + (p.waitReason === 'level' ? ' · не подходит по уровню' : ' · состав был полон')
        + (p.phone ? ' · ' + escapeHtml(p.phone) : '') + '</div>';
      const acts = el('div', 'acts');
      if (!t.drawnAt) {
        acts.appendChild(btn('В состав', 'btn sm', () =>
          act(() => api('adminTournamentParticipant',
            { id: t.id, op: 'promote', participantId: p.id }), 'Переведён в состав')));
      }
      acts.appendChild(btn('Убрать', 'btn sm danger', () =>
        act(() => api('adminTournamentParticipant',
          { id: t.id, op: 'remove', participantId: p.id }), 'Убран')));
      it.appendChild(acts);
      wait.appendChild(it);
    });
  }
}

function participantName(t, id) {
  const p = (t.participants || []).find(x => x.id === id);
  return p ? p.name : '—';
}

function matchScoreText(m) {
  if (!m.winner) return '';
  if (m.walkover) return 'без игры';
  return (m.sets || []).map(s => s[0] + ':' + s[1]).join(' ');
}

// Группа — крестовина, как в бумажном протоколе и как на всех турнирных
// сайтах: строки и столбцы это одни и те же игроки, в клетке счёт их
// встречи. Счёт вбивается прямо по клетке — списка пар больше нет, у
// кругового на шестнадцать человек он был на сто двадцать строк.
function renderTournamentGroup(view, t, g) {
  const card = el('div', 'card');
  const left = g.matches.filter(m => !m.winner).length;
  card.innerHTML = '<h2>Группа ' + escapeHtml(g.key)
    + ' <span class="sub">' + (left
      ? 'не сыграно ' + left + ' из ' + g.matches.length + ' · нажмите на клетку, чтобы вписать счёт'
      : 'все матчи сыграны') + '</span></h2>';
  view.appendChild(card);

  const members = g.table.map(row => (t.participants || []).find(p => p.id === row.participantId))
    .filter(Boolean);

  const scroll = el('div', 'cross-wrap');
  const table = el('table', 'tbl cross');
  let head = '<thead><tr><th class="pl">#</th><th class="who">Игрок</th>';
  members.forEach(p => { head += '<th class="sc">' + p.number + '</th>'; });
  head += '<th class="agg">Очки</th><th class="agg">Сеты</th><th class="agg">Геймы</th>'
    + '<th class="pl">Место</th></tr></thead>';
  table.innerHTML = head;

  const body = document.createElement('tbody');
  g.table.forEach(row => {
    const me = members.find(p => p.id === row.participantId);
    const tr = document.createElement('tr');
    const advance = t.format.groupCount > 0 ? t.format.advance : 0;
    if (row.status === 'withdrawn') tr.className = 'off';
    else if (advance && row.place <= advance) tr.className = 'up';

    const pl = el('td', 'pl'); pl.textContent = row.place || '—';
    tr.appendChild(pl);

    const who = el('td', 'who');
    who.innerHTML = '<span class="no">' + (me ? me.number : '') + '</span> ' + escapeHtml(row.name);
    tr.appendChild(who);

    members.forEach(op => {
      const td = el('td', 'sc');
      if (!me || op.id === me.id) { td.className = 'sc self'; tr.appendChild(td); return; }
      const m = g.matches.find(x => (x.a === me.id && x.b === op.id) || (x.a === op.id && x.b === me.id));
      td.innerHTML = crossCellHtml(m, me.id);
      if (m && t.status !== 'finished') {
        td.classList.add('hit');
        td.title = row.name + ' — ' + (members.find(p => p.id === op.id) || {}).name;
        td.addEventListener('click', () => openScoreForm(t, m));
      }
      tr.appendChild(td);
    });

    const pts = el('td', 'pts'); pts.innerHTML = '<b>' + row.points + '</b>';
    tr.appendChild(pts);
    // Сеты и геймы — то, чем решается место при равных очках. Без них
    // непонятно, почему один выше другого при тех же двух победах.
    const sets = el('td', 'agg');
    sets.innerHTML = row.setsWon + ':' + row.setsLost + ' ' + diffTag(row.setDiff);
    tr.appendChild(sets);
    const games = el('td', 'agg');
    games.innerHTML = row.gamesWon + ':' + row.gamesLost + ' ' + diffTag(row.gameDiff);
    tr.appendChild(games);
    const place = el('td', 'pl'); place.textContent = row.place || '—';
    tr.appendChild(place);

    body.appendChild(tr);
  });
  table.appendChild(body);
  scroll.appendChild(table);
  card.appendChild(scroll);
}

// Разница со знаком: ею и решается место при равных очках, поэтому она
// подписана отдельно и цветом.
function diffTag(d) {
  const v = Number(d) || 0;
  if (!v) return '<span class="diff zero">0</span>';
  return '<span class="diff ' + (v > 0 ? 'plus' : 'minus') + '">'
    + (v > 0 ? '+' : '−') + Math.abs(v) + '</span>';
}

// Счёт глазами того, чья это строка. Пустая клетка — матч не сыгран.
function crossCellHtml(m, meId) {
  if (!m) return '';
  if (!m.winner) return '<span class="pend">—</span>';
  const iAmA = m.a === meId;
  const won = (m.winner === 'a') === iAmA;
  if (m.walkover) return '<span class="' + (won ? 'w' : 'l') + '">' + (won ? '+' : '−') + '</span>';
  const sets = (m.sets || []).map(s => (iAmA ? s[0] + ':' + s[1] : s[1] + ':' + s[0])).join(' ');
  return '<span class="' + (won ? 'w' : 'l') + '">' + escapeHtml(sets) + '</span>';
}

function renderTournamentBracket(view, t, key, title, sub) {
  const bracket = t[key];
  if (!bracket) return;
  const card = el('div', 'card');
  card.innerHTML = '<h2>' + escapeHtml(title)
    + (sub ? ' <span class="sub">' + escapeHtml(sub) + '</span>' : '') + '</h2>';
  view.appendChild(card);

  bracket.rounds.forEach(r => {
    card.appendChild(txt('div', 't2', r.label));
    r.matches.forEach(m => card.appendChild(matchRow(t, m)));
  });
}

function matchRow(t, m) {
  const it = el('div', 'item' + (m.winner ? '' : ' hl'));
  const a = participantName(t, m.a), b = participantName(t, m.b);
  const winA = m.winner === 'a', winB = m.winner === 'b';
  it.innerHTML = '<div class="t1">'
    + (winA ? '<b>' + escapeHtml(a) + '</b>' : escapeHtml(a))
    + ' — '
    + (winB ? '<b>' + escapeHtml(b) + '</b>' : escapeHtml(b))
    + (m.winner ? ' <span class="pill ok">' + escapeHtml(matchScoreText(m)) + '</span>' : '')
    + '</div>';

  if (t.status !== 'finished') {
    const acts = el('div', 'acts');
    if (m.a && m.b) {
      acts.appendChild(btn(m.winner ? 'Изменить счёт' : 'Счёт', 'btn sm', () => openScoreForm(t, m)));
    } else {
      it.appendChild(txt('div', 't2', 'Соперник ещё не определился.'));
    }
    it.appendChild(acts);
  }
  return it;
}

// Ввод счёта. Полей ровно столько, сколько сетов в формате турнира:
// лишние клетки — прямой путь к «6:4 6:3 0:0» в таблице.
function openScoreForm(t, m) {
  const body = el('div');
  body.innerHTML = '<h3>Счёт матча</h3>'
    + '<div class="m-sub">' + escapeHtml(participantName(t, m.a))
    + ' — ' + escapeHtml(participantName(t, m.b)) + '</div>';

  const maxSets = t.scoring.mode === 'set2' ? 3 : 1;
  const rows = [];
  for (let i = 0; i < maxSets; i++) {
    const row = el('div', 'score-row');
    const left = document.createElement('input');
    const right = document.createElement('input');
    [left, right].forEach(inp => {
      inp.type = 'number'; inp.min = '0'; inp.max = '99'; inp.inputMode = 'numeric';
      inp.value = m.sets && m.sets[i] ? String(m.sets[i][inp === left ? 0 : 1]) : '';
    });
    row.appendChild(left);
    row.appendChild(txt('span', 'score-sep', ':'));
    row.appendChild(right);
    const label = maxSets === 1 ? 'Счёт'
      : (i === 2 ? (t.scoring.decider === 'tb10' ? 'Решающий тай-брейк' : 'Третий сет') : (i + 1) + '-й сет');
    wrapField(body, label + (i === 2 ? ' — если играли' : ''), row);
    rows.push([left, right]);
  }

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  if (m.winner) {
    acts.appendChild(btn('Стереть счёт', 'btn danger', () => {
      closeModal();
      act(() => api('adminTournamentScore', { id: t.id, matchId: m.id, clear: true }), 'Счёт стёрт');
    }));
  }
  acts.appendChild(btn('Сохранить', 'btn', () => {
    const sets = [];
    for (const [left, right] of rows) {
      if (left.value === '' && right.value === '') continue;
      sets.push([Number(left.value), Number(right.value)]);
    }
    if (!sets.length) { toast('Введите счёт'); return; }
    closeModal();
    act(() => api('adminTournamentScore', { id: t.id, matchId: m.id, sets }), 'Счёт записан');
  }));
  body.appendChild(acts);

  // Не пришёл — техническое поражение. Отдельными кнопками, а не
  // счётом 6:0: в таблице это разные вещи, и геймы за неявку не идут.
  const wo = el('div', 'acts');
  wo.appendChild(txt('div', 't2', 'Не явился:'));
  wo.appendChild(btn(participantName(t, m.a), 'btn sm sec', () => {
    closeModal();
    act(() => api('adminTournamentScore',
      { id: t.id, matchId: m.id, walkover: 'b' }), 'Техническое поражение');
  }));
  wo.appendChild(btn(participantName(t, m.b), 'btn sm sec', () => {
    closeModal();
    act(() => api('adminTournamentScore',
      { id: t.id, matchId: m.id, walkover: 'a' }), 'Техническое поражение');
  }));
  body.appendChild(wo);

  showModal(body);
}

// Выбор клиента из базы: участник турнира — всегда карточка клиента,
// с улицы в сетку не попасть. Ищем по тому же списку, что и на вкладке
// «Клиенты», — он уже приехал вместе с панелью.
function openPickClient(t, title, onPick) {
  const body = el('div');
  body.innerHTML = '<h3>' + escapeHtml(title) + '</h3>'
    + '<div class="m-sub">В турнир записываются только клиенты центра. '
    + 'Если человека нет в списке — сначала заведите ему карточку на вкладке «Клиенты».</div>';

  const search = document.createElement('input');
  search.placeholder = 'Имя или телефон';
  wrapField(body, 'Поиск', search);

  const list = el('div', 'picklist');
  body.appendChild(list);

  const taken = new Set();
  (t.participants || []).concat(t.waitlist || []).forEach(p => (p.players || []).forEach(id => taken.add(id)));

  function draw() {
    const q = search.value.trim().toLowerCase();
    list.innerHTML = '';
    const found = (db.clients || [])
      .filter(c => !taken.has(c.id))
      .filter(c => !q || c.name.toLowerCase().indexOf(q) >= 0 || String(c.phone || '').indexOf(q) >= 0)
      .slice(0, 20);
    if (!found.length) { list.appendChild(txt('div', 'empty', 'Никого не нашли.')); return; }
    found.forEach(c => {
      const it = el('div', 'item');
      it.innerHTML = '<div class="t1">' + escapeHtml(c.name) + '</div>'
        + '<div class="t2">' + escapeHtml(c.phone || '')
        + (c.ntrp == null ? ' · уровень неизвестен' : ' · уровень ' + String(c.ntrp).replace('.', ',')) + '</div>';
      it.addEventListener('click', () => { closeModal(); onPick(c.id); });
      list.appendChild(it);
    });
  }
  search.addEventListener('input', draw);
  draw();

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  body.appendChild(acts);
  showModal(body);
  setTimeout(() => search.focus(), 50);
}

// Как лягут люди по группам: поровну, остаток по первым. Тот же расчёт,
// что на сервере, — здесь он только для показа, решает всё равно сервер.
function groupSizes(count, groupCount) {
  if (!groupCount) return [];
  const base = Math.floor(count / groupCount);
  const extra = count % groupCount;
  return Array.from({ length: groupCount }, (_, i) => base + (i < extra ? 1 : 0));
}

function confirmDraw(t) {
  const count = t.taken;
  const body = el('div');
  body.innerHTML = '<h3>Провести жеребьёвку?</h3>'
    + '<div class="m-sub">' + escapeHtml(t.title) + ' · записалось ' + count
    + ' из ' + t.maxParticipants + '</div>';

  const withGroups = t.format.groupCount > 0;
  // Замысел карточки задаёт желаемый размер группы, а не жёсткое их
  // число: четыре группы на шестнадцать мест — это «по четыре в группе».
  // При одиннадцати записавшихся групп нужно три (4-4-3), иначе выйдет
  // 3-3-3-2, и из двойки пройдут оба, сыграв один матч вместо трёх.
  const target = Math.max(2, Math.ceil(t.maxParticipants / (t.format.groupCount || 1)));
  const suggested = Math.max(1, Math.min(6, t.format.groupCount, Math.ceil(count / target)));

  const groups = document.createElement('select');
  for (let n = 1; n <= Math.min(6, Math.floor(count / 2)); n++) {
    groups.appendChild(opt(String(n), n === 1 ? 'одна группа, все со всеми' : n + ' группы'));
  }
  groups.value = String(suggested);

  const advance = document.createElement('select');
  const note = el('div', 'empty');

  function refresh() {
    const g = Number(groups.value);
    const sizes = groupSizes(count, g);
    const smallest = Math.min.apply(null, sizes);

    const keep = Number(advance.value);
    advance.innerHTML = '';
    for (let n = 1; n < Math.max(2, smallest); n++) {
      advance.appendChild(opt(String(n), n === 1 ? 'по одному' : 'по ' + n));
    }
    advance.value = String(Math.min(keep || t.format.advance, Math.max(1, smallest - 1)));

    const out = g * Number(advance.value);
    const size = Math.pow(2, Math.ceil(Math.log2(Math.max(2, out))));
    let text = 'Группы: ' + sizes.join(', ') + '. Выходит ' + out + ', сетка на ' + size + '.';
    if (out < size) text += ' Недостающих доберём лучшими из невышедших.';
    if (smallest <= Number(advance.value)) {
      text += ' ⚠ Из группы в ' + smallest + ' выходят все — они сыграют меньше остальных.';
    }
    note.textContent = text;
  }

  if (withGroups) {
    wrapField(body, 'Сколько групп', groups);
    wrapField(body, 'Выходит из группы', advance);
    body.appendChild(note);
    groups.addEventListener('change', refresh);
    advance.addEventListener('change', refresh);
    refresh();
  }

  body.appendChild(txt('div', 'empty',
    'Жеребьёвка проводится один раз. Пересдать её можно только сбросом, и только пока '
    + 'не сыгран ни один матч. Сама раскладка появится на странице сетки — там её показывают людям.'));

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Разыграть', 'btn', () => {
    closeModal();
    act(() => api('adminTournamentDraw', Object.assign({ id: t.id },
      withGroups ? { groupCount: Number(groups.value), advance: Number(advance.value) } : {})),
    'Жеребьёвка проведена');
  }));
  body.appendChild(acts);
  showModal(body);
}

function confirmFinish(t) {
  const body = el('div');
  body.innerHTML = '<h3>Завершить турнир?</h3>'
    + '<div class="m-sub">' + escapeHtml(t.title) + '</div>'
    + '<div class="empty">Всем, кто сыграл хотя бы матч, прибавится сыгранный турнир в профиль, '
    + 'а победителю — победа. Начисляется один раз. Следом откроется пересчёт игровых уровней — '
    + 'он ничего не меняет, пока вы не согласитесь.</div>';
  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn('Завершить', 'btn', async () => {
    closeModal();
    const res = await act(() => api('adminFinishTournament', { id: t.id }), 'Турнир завершён');
    if (res && res.levels) openLevels(t, res.levels, res.points);
  }));
  body.appendChild(acts);
  showModal(body);
}

// ---------- Пересчёт игровых уровней ----------
//
// Считает сервер, здесь только показ и правка рукой. Числа из этого
// окна назад не уходят: при «согласен» сервер пересчитывает всё заново,
// а из формы принимает единственное — выбранное владельцем деление.

const LEVEL_ERRORS = {
  'doubles-paused': 'Парные турниры пока не влияют на игровой уровень.',
  'no-anchor': 'Не от чего считать: уровень не известен ни у кого из участников, '
    + 'и у турнира не задан диапазон.',
  'no-matches': 'В турнире нет сыгранных матчей.',
  disabled: 'Пересчёт уровней выключен в настройках.',
};

function levelNum(v) {
  return v == null ? '—' : String(v).replace('.', ',');
}

function levelDelta(v) {
  const s = (v > 0 ? '+' : (v < 0 ? '−' : '')) + String(Math.abs(v).toFixed(2)).replace('.', ',');
  return v === 0 ? '0' : s;
}

// Очки, в отличие от уровня, подтверждать нечего: это строка из
// таблицы по занятому месту. Поэтому они уже начислены, и в сводке
// показываются справкой — чтобы владелец видел, что зачёт пополнился.
const POINTS_ERRORS = {
  'no-category': 'Очки не начислены: у турнира не выбрана категория.',
  'no-gender': 'Очки не начислены: у турнира не указано, кто играет.',
  'unknown-category': 'Очки не начислены: для этой категории в настройках нет множителя.',
  disabled: 'Начисление очков выключено в настройках.',
  'not-counted': 'Очки будут начислены после завершения турнира.',
};

function pointsNote(data) {
  if (!data) return null;
  if (data.error) return txt('div', 'empty', POINTS_ERRORS[data.error] || 'Очки не начислены.');
  const total = (data.rows || []).reduce((a, r) => a + r.points, 0);
  return txt('div', 'empty', 'Очки начислены в зачёт «' + data.label + '»: '
    + plural(data.rows.length, 'участник', 'участника', 'участников') + ', '
    + total + ' очков всего.');
}

// Долги по взносам в сводке. Турнир доигран, люди ещё не разошлись —
// это последний момент, когда спросить проще, чем потом звонить.
function feeDebtNote(t) {
  const debt = feeDebtors(t);
  if (!debt.length) return null;
  const box = el('div', 'card');
  box.style.padding = '8px 10px';
  box.style.marginTop = '6px';
  box.innerHTML = '<div class="t1"><span class="pill bad">взнос не сдан</span> '
    + plural(debt.length, 'участник', 'участника', 'участников')
    + ', ' + (debt.length * t.fee) + ' ₽</div>';
  debt.forEach(p => {
    box.appendChild(txt('div', 't2', p.name
      + (p.phone ? ' · ' + p.phone : '')
      + (p.status === 'withdrawn' ? ' · снялся, но сыграл' : '')));
  });
  box.appendChild(txt('div', 't2', 'Отметить можно в составе — кнопкой «Взнос внесён».'));
  return box;
}

function openLevels(t, data, pointsData) {
  const body = el('div');
  body.innerHTML = '<h3>Пересчёт игровых уровней</h3>'
    + '<div class="m-sub">' + escapeHtml(t.title) + '</div>';

  const note = pointsNote(pointsData);
  if (note) body.appendChild(note);

  const debt = feeDebtNote(t);
  if (debt) body.appendChild(debt);

  if (data.error || !data.rows || !data.rows.length) {
    body.innerHTML += '<div class="empty">'
      + escapeHtml(LEVEL_ERRORS[data.error] || 'Двигать некого: никто не сыграл ни одного матча.')
      + '</div>';
    const only = el('div', 'm-acts');
    only.appendChild(btn('Закрыть', 'btn sec', closeModal));
    body.appendChild(only);
    showModal(body);
    return;
  }

  body.appendChild(txt('div', 'empty',
    'Уровень копится непрерывно, а деление шкалы меняется, только когда копилка '
    + 'перевалит за середину. Строку можно поправить рукой — тогда выбранное деление '
    + 'станет новой точкой отсчёта.'));

  // Правки владельца: id клиента → выбранное деление. Пусто значит
  // «строку не трогали», это не то же самое, что «снять уровень».
  const overrides = new Map();

  const list = el('div');
  list.style.maxHeight = '52vh';
  list.style.overflowY = 'auto';

  // Первые восемь развёрнуты, остальные под кнопкой: прятать их совсем
  // нельзя — сдвиг записывается и им тоже.
  const HEAD = 8;
  const draw = (limit) => {
    list.innerHTML = '';
    data.rows.slice(0, limit).forEach(row => list.appendChild(levelRow(row, overrides)));
    if (limit < data.rows.length) {
      const more = btn('Показать остальных (' + (data.rows.length - limit) + ')', 'btn sm sec',
        () => draw(data.rows.length));
      more.style.marginTop = '8px';
      list.appendChild(more);
    }
  };
  draw(Math.min(HEAD, data.rows.length));
  body.appendChild(list);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Позже', 'btn sec', closeModal));
  acts.appendChild(btn('Согласен, внести поправки', 'btn', () => {
    const payload = [];
    overrides.forEach((v, clientId) => payload.push({ clientId, ntrp: v }));
    closeModal();
    act(() => api('adminApplyLevels', { id: t.id, overrides: payload }), 'Уровни обновлены');
  }));
  body.appendChild(acts);
  showModal(body);
}

function levelRow(row, overrides) {
  const wrap = el('div', 'card');
  wrap.style.padding = '8px 10px';
  wrap.style.marginTop = '6px';

  const head = el('div', 'row');
  head.appendChild(txt('strong', '', row.name || 'Без имени'));

  const move = levelNum(row.ntrp) + ' → ' + levelNum(row.ntrpAfter)
    + '  ' + levelDelta(row.delta)
    + '  (' + levelNum(row.level) + ' → ' + levelNum(row.levelAfter) + ')';
  head.appendChild(txt('span', row.divisionChanged ? 'pill ok' : 't2', move));
  wrap.appendChild(head);

  const why = row.reason + (row.capped === 'tournament'
    ? ' · упёрлись в предел за турнир'
    : (row.capped === 'year' ? ' · упёрлись в предел за год' : ''));
  wrap.appendChild(txt('div', 't2', why));

  const fix = el('div', 'row');
  fix.style.marginTop = '4px';
  fix.appendChild(txt('span', 't2', 'Поставить руками:'));
  const sel = ntrpSelect(row.ntrpAfter, '— не трогать —');
  sel.addEventListener('change', () => {
    if (sel.value === '' || Number(sel.value) === row.ntrpAfter) overrides.delete(row.clientId);
    else overrides.set(row.clientId, Number(sel.value));
  });
  fix.appendChild(sel);
  wrap.appendChild(fix);
  return wrap;
}

// Одна форма и на создание, и на правку — как у афиши.
function openTournamentForm(existing) {
  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка турнира' : 'Новый турнир') + '</h3>'
    + '<div class="m-sub">Состав, жеребьёвка и результаты правкой карточки не меняются.</div>';

  const title = document.createElement('input');
  title.value = existing ? existing.title : '';
  title.placeholder = 'Например: Турнир выходного дня';
  wrapField(body, 'Название', title);

  const from = document.createElement('input');
  from.type = 'date';
  from.value = existing ? existing.dateFrom : todayIso();
  wrapField(body, 'Начало', from);

  const to = document.createElement('input');
  to.type = 'date';
  to.value = existing ? existing.dateTo : todayIso();
  wrapField(body, 'Окончание', to);

  const timeFrom = document.createElement('input');
  timeFrom.type = 'time';
  timeFrom.value = existing && existing.timeFrom ? existing.timeFrom : '10:00';
  wrapField(body, 'Начало игр', timeFrom);

  const timeTo = document.createElement('input');
  timeTo.type = 'time';
  timeTo.value = existing && existing.timeTo ? existing.timeTo : '22:00';
  wrapField(body, 'Окончание игр — до этого времени заняты корты', timeTo);

  // Корты закрываются только у однодневного турнира. Многодневный
  // круговой играют когда договорятся и бронируют сами — держать оба
  // корта закрытыми месяц нельзя.
  const block = document.createElement('select');
  block.appendChild(opt('none', 'Не занимать корты'));
  block.appendChild(opt('all', 'Занять оба корта'));
  (db.courts || []).forEach(c => block.appendChild(opt(String(c.id), 'Занять только ' + c.name)));
  block.value = existing && existing.blockCourts
    ? (existing.blockCourtId == null ? 'all' : String(existing.blockCourtId))
    : 'none';
  const blockField = wrapFieldNode(body, 'Корты на время турнира', block);

  const fee = document.createElement('input');
  fee.type = 'number'; fee.min = '0'; fee.step = '100';
  fee.value = existing ? String(existing.fee) : '0';
  wrapField(body, 'Взнос, ₽ — 0, если без взноса', fee);

  const size = document.createElement('input');
  size.type = 'number'; size.min = '4'; size.max = '24';
  size.value = existing ? String(existing.maxParticipants) : '16';
  wrapField(body, 'Сколько участников', size);

  // Пол, разряд и категория решают, в какой зачёт лягут очки: у
  // владельца это отдельные листы Excel, здесь — отдельные таблицы.
  // Незаполненные поля не мешают провести турнир, но очки за него не
  // начислятся, и панель скажет об этом словами.
  const gender = document.createElement('select');
  gender.appendChild(opt('', '— не выбран, очки не начисляются —'));
  gender.appendChild(opt('m', 'мужской'));
  gender.appendChild(opt('w', 'женский'));
  gender.appendChild(opt('mixed', 'микст'));
  gender.value = existing && existing.gender ? existing.gender : '';
  wrapField(body, 'Кто играет', gender);

  // Категория и тип турнира — одно и то же: первая это мастерс, вторая
  // тур, третья челленджер. Поэтому список один, и подписи к нему
  // приходят с сервера, а не живут копией в панели.
  const category = document.createElement('select');
  category.appendChild(opt('', '— не выбрана, очки не начисляются —'));
  ((db.tournaments && db.tournaments.categories) || []).forEach(c =>
    category.appendChild(opt(String(c.id), c.label)));
  category.value = existing && existing.category != null ? String(existing.category) : '';
  wrapField(body, 'Категория турнира — от неё зависит начисление очков', category);

  const ntrpMin = document.createElement('input');
  ntrpMin.type = 'number'; ntrpMin.min = '1'; ntrpMin.max = '7'; ntrpMin.step = '0.5';
  ntrpMin.value = existing && existing.ntrpMin != null ? String(existing.ntrpMin) : '';
  wrapField(body, 'Игровой уровень от — пусто, если без ограничения', ntrpMin);

  const ntrpMax = document.createElement('input');
  ntrpMax.type = 'number'; ntrpMax.min = '1'; ntrpMax.max = '7'; ntrpMax.step = '0.5';
  ntrpMax.value = existing && existing.ntrpMax != null ? String(existing.ntrpMax) : '';
  wrapField(body, 'Игровой уровень до', ntrpMax);

  // Три пресета вместо голого числа групп: «одна группа» и «групп нет»
  // читаются людьми как разные турниры, хотя движок у них один.
  const shape = document.createElement('select');
  shape.appendChild(opt('groups', 'Группы, потом плей-офф'));
  shape.appendChild(opt('rr', 'Круговой: все со всеми, потом плей-офф'));
  shape.appendChild(opt('ko', 'Сразу навылет, без групп'));
  const prevCount = existing ? existing.format.groupCount : 4;
  shape.value = prevCount === 0 ? 'ko' : (prevCount === 1 ? 'rr' : 'groups');
  wrapField(body, 'Формат', shape);

  const groups = document.createElement('input');
  groups.type = 'number'; groups.min = '2'; groups.max = '6';
  groups.value = String(prevCount > 1 ? prevCount : 4);
  const groupsField = wrapFieldNode(body, 'Сколько групп', groups);

  const advance = document.createElement('input');
  advance.type = 'number'; advance.min = '1'; advance.max = '8';
  advance.value = existing ? String(existing.format.advance) : '2';
  const advanceField = wrapFieldNode(body, 'Сколько выходит из группы', advance);

  // Состав БЕТА. У турниров, созданных до этого выбора, поля в данных
  // нет — им подставляем «все невышедшие», как они и играли, а новым
  // предлагаем клубный порядок: одни третьи места.
  const consolation = document.createElement('select');
  consolation.appendChild(opt('no', 'Нет'));
  consolation.appendChild(opt('next', 'Только третьи места'));
  consolation.appendChild(opt('all', 'Все, кто не вышел из группы'));
  consolation.value = existing
    ? (existing.format.consolation ? (existing.format.consolationPlaces === 1 ? 'next' : 'all') : 'no')
    : 'next';
  const consolationField = wrapFieldNode(body, 'Сетка БЕТА', consolation);

  const third = document.createElement('select');
  third.appendChild(opt('yes', 'Играется'));
  third.appendChild(opt('no', 'Не играется'));
  third.value = existing && existing.format.thirdPlace === false ? 'no' : 'yes';
  const thirdField = wrapFieldNode(body, 'Матч за третье место', third);

  const mode = document.createElement('select');
  Object.keys(T_SCORING).forEach(k => mode.appendChild(opt(k, T_SCORING[k])));
  mode.value = existing ? existing.scoring.mode : 'set1';
  wrapField(body, 'Матч играется до', mode);

  const decider = document.createElement('select');
  decider.appendChild(opt('tb10', 'Тай-брейк до 10'));
  decider.appendChild(opt('set', 'Полный третий сет'));
  decider.value = existing ? existing.scoring.decider : 'tb10';
  const deciderField = wrapFieldNode(body, 'При 1:1 по сетам играется', decider);

  const note = document.createElement('textarea');
  note.rows = 3;
  note.value = existing ? existing.note : '';
  note.placeholder = 'Время начала, как оплачивается взнос, что взять с собой';
  wrapField(body, 'Подробности — необязательно', note);

  const closed = document.createElement('select');
  closed.appendChild(opt('open', 'Открыта'));
  closed.appendChild(opt('closed', 'Закрыта'));
  closed.value = existing && existing.signupsClosed ? 'closed' : 'open';
  wrapField(body, 'Запись', closed);

  function syncShape() {
    const withGroups = shape.value !== 'ko';
    // Многодневный турнир корты не занимает — прячем выбор совсем,
    // чтобы не обещать того, чего система не сделает.
    const oneDay = !to.value || to.value === from.value;
    blockField.style.display = oneDay ? '' : 'none';
    groupsField.style.display = shape.value === 'groups' ? '' : 'none';
    advanceField.style.display = withGroups ? '' : 'none';
    consolationField.style.display = withGroups ? '' : 'none';
    // Какие места уедут в БЕТА, зависит от того, сколько выходит из
    // группы: при двоих это третьи, при одном — вторые.
    consolation.options[1].textContent = 'Только '
      + (PLACE_WORDS[Number(advance.value) + 1] || 'следующие') + ' места';
    deciderField.style.display = mode.value === 'set2' ? '' : 'none';
    // Бронзу разыгрывают только там, где есть полуфиналы: у кругового
    // без плей-офф места расставляет таблица.
    thirdField.style.display = shape.value === 'rr' && Number(advance.value) < 4 ? 'none' : '';
  }
  shape.addEventListener('change', syncShape);
  // От числа выходящих зависят и подпись БЕТА, и то, есть ли вообще
  // полуфиналы под матч за третье место.
  advance.addEventListener('input', syncShape);
  mode.addEventListener('change', syncShape);
  from.addEventListener('change', syncShape);
  to.addEventListener('change', syncShape);
  syncShape();

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn(existing ? 'Сохранить' : 'Создать', 'btn', () => {
    if (title.value.trim().length < 2 || !from.value) { toast('Заполните название и дату'); return; }
    const groupCount = shape.value === 'ko' ? 0 : (shape.value === 'rr' ? 1 : Number(groups.value));
    const payload = {
      title: title.value,
      dateFrom: from.value,
      dateTo: to.value || from.value,
      timeFrom: timeFrom.value || null,
      timeTo: timeTo.value || null,
      blockCourts: block.value !== 'none',
      blockCourtId: block.value === 'all' || block.value === 'none' ? null : Number(block.value),
      gender: gender.value || null,
      category: category.value === '' ? null : Number(category.value),
      fee: Number(fee.value) || 0,
      maxParticipants: Number(size.value),
      ntrpMin: ntrpMin.value === '' ? null : Number(ntrpMin.value),
      ntrpMax: ntrpMax.value === '' ? null : Number(ntrpMax.value),
      format: {
        groupCount,
        advance: Number(advance.value),
        consolation: groupCount > 0 && consolation.value !== 'no',
        consolationPlaces: consolation.value === 'next' ? 1 : 0,
        thirdPlace: third.value === 'yes',
      },
      scoring: { mode: mode.value, decider: decider.value },
      note: note.value,
      signupsClosed: closed.value === 'closed',
    };
    if (existing) payload.id = existing.id;
    closeModal();
    act(async () => {
      const res = await api('adminSaveTournament', payload);
      // Турнир сохранился, а корты могли не закрыться: в это время уже
      // стоит чья-то бронь. Сносить её молча система не должна, поэтому
      // просто говорим об этом вслед за сообщением об успехе.
      if (res && res.closure && res.closure.error === 'bookings-clash') {
        const who = (res.closure.bookings || []).map(b => b.clientName || 'бронь').join(', ');
        setTimeout(() => toast('Корты не закрыты — это время занято: ' + who, 6000), 1400);
      }
      return res;
    }, existing ? 'Турнир изменён' : 'Турнир создан');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => title.focus(), 50);
}

// ============================================================
// Вкладка: Статистика
// ============================================================
//
// Считается сервером из файлов дней. Здесь только показ — и одна
// важная оговорка, которая написана прямо на экране: это начисленная
// стоимость броней, а не касса. Наличные и переводы система не видит
// и видеть не может, онлайн-кассы у клуба нет.

const state_stats = { kind: 'weekday' };

function renderStats(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Статистика <span class="sub">итоги месяца</span></h2>';
  view.appendChild(card);

  if (!db.monthly) {
    card.appendChild(txt('div', 'empty', 'Считаем месяц по дням — это дольше остальных экранов…'));
    return;
  }

  const s = db.monthly.stats;

  const head = el('div', 'acts');
  const sel = document.createElement('select');
  db.monthly.months.forEach(m => sel.appendChild(opt(m, monthLabel(m))));
  sel.value = s.month;
  sel.addEventListener('change', () => {
    state.statsMonth = sel.value;
    db.monthly = null;
    render();
    reload().catch(() => toast('Не удалось посчитать месяц'));
  });
  head.appendChild(sel);
  head.appendChild(btn('Пересчитать', 'btn sm sec', async () => {
    try {
      db.monthly = await api('adminStats', { month: s.month, refresh: true });
      render();
      toast('Пересчитано');
    } catch (e) { toast(errorText(e.code), 4000); }
  }));
  card.appendChild(head);

  const dayWord = s.days === s.daysInMonth ? 'месяц целиком' : 'по ' + s.days + ' дн. из ' + s.daysInMonth;
  card.appendChild(txt('div', 't2', monthLabel(s.month) + ' · ' + dayWord
    + (db.monthly.stored ? ' · итог закрыт и сохранён' : ' · считается заново при каждом заходе')));

  // ---------- деньги ----------
  const money = el('div', 'card');
  money.innerHTML = '<h2>Деньги</h2>';
  const kpis = el('div', 'kpis');
  [
    [money2(s.money.revenue), 'начислено за месяц'],
    [money2(s.money.courts), 'корты'],
    [money2(s.money.extras), 'аренда'],
    [money2(s.money.lost), 'потеряно на неявках'],
  ].forEach(([v, l]) => {
    const k = el('div', 'kpi');
    k.innerHTML = '<div class="v">' + escapeHtml(v) + '</div><div class="l">' + escapeHtml(l) + '</div>';
    kpis.appendChild(k);
  });
  money.appendChild(kpis);
  money.appendChild(txt('div', 'empty',
    'Это начисленная стоимость броней, а не касса: наличные и переводы система не видит. '
    + 'Отменённое в сумму не входит — за месяц отменено на ' + money2(s.money.cancelled) + '.'));
  view.appendChild(money);

  // ---------- игры ----------
  const games = el('div', 'card');
  games.innerHTML = '<h2>Игры и клиенты</h2>';
  const kpis2 = el('div', 'kpis');
  [
    [String(s.games.played), 'игр состоялось'],
    [String(hoursNum(s.hours.total)), 'часов занято'],
    [Math.round(s.load.overall * 100) + '%', 'загрузка кортов'],
    [String(s.games.noShow), 'неявок'],
    [s.games.cancelled + ' / ' + s.games.lateCancelled, 'отмен / поздних'],
    [String(s.clients.newClients), 'новых клиентов'],
  ].forEach(([v, l]) => {
    const k = el('div', 'kpi');
    k.innerHTML = '<div class="v">' + escapeHtml(v) + '</div><div class="l">' + escapeHtml(l) + '</div>';
    kpis2.appendChild(k);
  });
  games.appendChild(kpis2);

  const rows = [
    ['Обычные брони', hoursNum(s.hours.bookings) + ' ч'],
    ['Постоянные брони', hoursNum(s.hours.series) + ' ч'],
    ['Открытые тренировки', hoursNum(s.hours.openPlay) + ' ч'
      + (s.openPlay.sessions ? ' · ' + s.openPlay.sessions + ' окон, мест занято '
        + s.openPlay.filled + ' из ' + s.openPlay.seats : '')],
    ['Корт был закрыт', hoursNum(s.hours.closed) + ' ч'],
    ['Играли разные люди', String(s.clients.active)],
  ];
  if (s.games.pendingExpired) {
    rows.push(['Заявок сгорело без ответа', String(s.games.pendingExpired)]);
  }
  rows.forEach(([label, value]) => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(label) + '</div>'
      + '<div class="t2">' + escapeHtml(value) + '</div>';
    games.appendChild(it);
  });
  view.appendChild(games);

  // ---------- загрузка по часам ----------
  const load = el('div', 'card');
  load.innerHTML = '<h2>Загрузка по часам <span class="sub">доля занятых кортов</span></h2>';

  const switcher = el('div', 'acts');
  [['weekday', 'Будни'], ['weekend', 'Выходные']].forEach(([id, label]) => {
    switcher.appendChild(btn(label, 'btn sm' + (state_stats.kind === id ? '' : ' sec'), () => {
      state_stats.kind = id;
      render();
    }));
  });
  load.appendChild(switcher);

  const list = s.load[state_stats.kind] || [];
  const bars = el('div', 'bars');
  list.forEach(h => {
    const col = el('div', 'bar-col');
    const bar = el('div', 'bar' + (h.load < 0.2 ? ' low' : ''));
    bar.style.height = Math.max(2, Math.round(h.load * 100)) + '%';
    bar.title = h.label + ' — ' + Math.round(h.load * 100) + '%';
    col.appendChild(bar);
    // Подписываем каждый второй час: иначе на телефоне цифры сливаются.
    col.appendChild(txt('div', 'bar-lb', h.hour % 2 === 0 ? h.label.slice(0, 2) : ''));
    bars.appendChild(col);
  });
  load.appendChild(bars);
  if (!list.some(h => h.cells)) {
    load.appendChild(txt('div', 'empty', 'В этом месяце таких дней ещё не было.'));
  }
  view.appendChild(load);

  // ---------- пустые часы ----------
  const idle = el('div', 'card');
  idle.innerHTML = '<h2>Самые пустые часы <span class="sub">будни</span></h2>';
  if (!s.idle.length) {
    idle.appendChild(txt('div', 'empty',
      'Пока не из чего выбирать: за месяц слишком мало игр в будни.'));
  }

  s.idle.forEach(h => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(h.label) + ' — '
      + Math.round(h.load * 100) + '% загрузки</div>';
    const acts = el('div', 'acts');
    // Готовое предложение, а не просто цифра: ради этого владелец сюда
    // и заходит. Окно предлагаем на два часа от пустого — час скидки
    // редко кого сдвигает с места.
    acts.appendChild(btn('Сделать скидочным', 'btn sm sec', () => openRuleForm(null, {
      from: minutesToTime(h.hour * 60),
      to: minutesToTime(Math.min(h.hour * 60 + 120, timeToMinutes(db.config.closeTime))),
      days: [1, 2, 3, 4, 5],
      pricePerHour: Math.round(db.config.pricePerHour * 0.8 / 100) * 100,
    })));
    it.appendChild(acts);
    idle.appendChild(it);
  });
  idle.appendChild(txt('div', 'empty',
    'Показаны часы, в которые играют, но мало: скидка сдвигает существующий спрос, а не создаёт новый. '
    + 'Список окон и их порядок — во вкладке «Настройки».'));
  view.appendChild(idle);

  renderLedger(view);
}

// Журнал абонементов: продали, списали, сожгли. Каждая строка с автором
// и причиной — на этом и держится доверие к остатку в карточке клиента.
function renderLedger(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Абонементы <span class="sub">журнал операций</span></h2>';
  view.appendChild(card);

  if (!db.ledger) {
    card.appendChild(txt('div', 'empty', 'Загружаем журнал…'));
    return;
  }

  if (!db.ledger.entries.length) {
    card.appendChild(txt('div', 'empty', 'В этом месяце операций не было.'));
    return;
  }

  const table = document.createElement('table');
  table.className = 'tbl';
  table.innerHTML = '<tr><th>Когда</th><th>Клиент</th><th>Что</th><th>Часы</th><th>Сумма</th></tr>';
  db.ledger.entries.slice(0, 60).forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + escapeHtml(shortDateTime(e.at)) + '</td>'
      + '<td>' + escapeHtml(e.clientName) + '</td>'
      + '<td>' + escapeHtml((PASS_KIND[e.kind] || e.kind)
        + (e.date ? ' · ' + shortDate(e.date) : '')
        + (e.note ? ' · ' + e.note : '')) + '</td>'
      + '<td>' + escapeHtml(hoursNum(e.hours) + ' ч') + '</td>'
      + '<td>' + escapeHtml(money2(e.sum)) + '</td>';
    table.appendChild(tr);
  });
  card.appendChild(table);

  if (db.ledger.total > 60) {
    card.appendChild(txt('div', 'empty', 'Показаны последние 60 из ' + db.ledger.total + '.'));
  }
  card.appendChild(txt('div', 'empty',
    'Списание идёт по факту состоявшейся игры, через двое суток — столько есть у администратора, '
    + 'чтобы отметить неявку. За неявку часы не списываются: она наказывается рейтингом.'));
}

function hoursNum(v) {
  return String(Math.round(Number(v) * 10) / 10).replace('.', ',');
}
function ratingText(v) {
  return String(Number(v)).replace('.', ',');
}
function money2(v) {
  return Math.round(Number(v) || 0).toLocaleString('ru-RU') + ' ₽';
}

// ============================================================
// Вкладка: Настройки
// ============================================================

// Часы работы клуб меняет сам и не по календарю: «до часу ночи» может
// смениться на «до полуночи» и в октябре, и в марте. Поэтому форма, а не
// строчка в файле на сервере.
//
// Правит только владелец. Администратору те же значения показываются
// текстом: знать, как настроен клуб, ему нужно, а менять цену — нет.
function renderSettings(view) {
  const cfg = db.config;
  const owner = !!(me && me.role === 'owner');

  const c1 = el('div', 'card');
  c1.innerHTML = '<h2>Как настроен центр</h2>';
  view.appendChild(c1);

  if (owner) renderSettingsForm(c1, cfg);
  else {
    [
      ['Цена за час', money(cfg.pricePerHour)],
      ['Часы работы', fmtRange(cfg.openTime, cfg.closeTime)],
      ['Шаг сетки', cfg.slotStep + ' мин'],
      ['Минимальная бронь', hoursText(cfg.minBookingMinutes)],
      ['Подтверждать брони от', hoursText(cfg.approvalFromMinutes)],
      ['Отмена без потери клиентского рейтинга не позднее чем за', cfg.cancelDeadlineHours + ' ч'],
      ['…и всегда в первые', (cfg.cancelGraceMinutes || 0) + ' мин после брони'],
      ['Активных броней на клиента', String(cfg.maxActiveBookingsPerClient)],
      ['Запись открыта на', cfg.horizonDays + ' дн.'],
      ['Брони с переходом между кортами', cfg.allowCourtSwitch ? 'разрешены' : 'запрещены'],
      ['Уплотнять занятость кортов', cfg.packCourts ? 'да' : 'нет'],
    ].forEach(([label, value]) => {
      const it = el('div', 'item');
      it.innerHTML = '<div class="t1">' + escapeHtml(label) + '</div>'
        + '<div class="t2">' + escapeHtml(value) + '</div>';
      c1.appendChild(it);
    });
    c1.appendChild(txt('div', 'empty', 'Менять настройки может только владелец.'));
  }

  if (owner) renderClubInfo(view);
  renderPriceRules(view, cfg, owner);
  if (owner) renderCourts(view);
  if (owner) renderReminders(view);
  if (owner) renderAnnounceChat(view);
  renderClosures(view, cfg);
  renderStaff(view);

  const c3 = el('div', 'card');
  c3.innerHTML = '<h2>Вы вошли как</h2>'
    + '<div class="item"><div class="t1">' + escapeHtml(me ? me.name : '')
    + '</div><div class="t2">' + escapeHtml(me ? fmtPhone(me.phone) : '')
    + ' · ' + (me && me.role === 'owner' ? 'владелец' : 'администратор') + '</div></div>';
  view.appendChild(c3);
}

// Витрина главной: телефон, адрес, чипы под шапкой и ссылки. Всё это
// лежит в настройках и раньше правилось только руками в бакете — то
// есть через разработчика. Для строки «кондиционер/отопление» это
// слишком дорогой путь, поэтому форма.
//

// Шага сетки в форме нет намеренно: все заведённые брони и постоянные
// занятия выровнены по получасу, и смена шага разъехала бы сетку задним
// числом. Скидочных часов тоже нет — у них будет свой редактор, когда
// появится статистика простоя.
function renderSettingsForm(card, cfg) {
  const draft = { allowCourtSwitch: cfg.allowCourtSwitch, packCourts: cfg.packCourts };

  const price = numField(card, 'Цена за час, ₽', cfg.pricePerHour);

  // Часы — выбором из сетки, а не строкой: «до часу ночи» внутри живёт
  // как 25:00, и вводить это руками владелец не должен.
  const open = timeSelect(card, 'Центр открывается', cfg.openTime, 0, 12 * 60);
  const close = timeSelect(card, 'Центр закрывается', cfg.closeTime, 18 * 60, 30 * 60);

  const quick = el('div', 'acts');
  quick.appendChild(txt('span', 't2', 'Обычные варианты:'));
  quick.appendChild(btn('до полуночи', 'btn sm sec', () => { close.value = '24:00'; }));
  quick.appendChild(btn('до часу ночи', 'btn sm sec', () => { close.value = '25:00'; }));
  card.appendChild(quick);

  const minBook = pickField(card, 'Минимальная бронь', cfg.minBookingMinutes,
    [30, 60, 90, 120], hoursText);
  const approval = pickField(card, 'Подтверждать администратором брони от', cfg.approvalFromMinutes,
    [60, 90, 120, 150, 180, 240, 300], hoursText);

  // Два поля рядом читаются как «от и до»: передумал в первые полчаса —
  // штрафа нет, дальше рейтинг бережёт только заблаговременность. Без
  // первого поля вечернюю бронь, заведённую уже за дедлайном, нельзя
  // было снять без потери рейтинга даже через минуту.
  const cancelM = numField(card, 'Отмена без потери клиентского рейтинга в первые, мин после брони',
    cfg.cancelGraceMinutes == null ? 30 : cfg.cancelGraceMinutes);
  const cancelH = numField(card, '…и не позднее чем за, ч до игры', cfg.cancelDeadlineHours);
  const maxActive = numField(card, 'Активных броней на клиента', cfg.maxActiveBookingsPerClient);
  const horizon = numField(card, 'Запись открыта на, дней', cfg.horizonDays);
  const lead = numField(card, 'Запас до начала игры, мин', cfg.minLeadMinutes);
  const switches = numField(card, 'Переходов между кортами в одной брони', cfg.maxSwitches);
  const recent = numField(card, 'Показывать «Что нового» на вкладке «Заявки» за последние, ч',
    cfg.recentWindowHours == null ? 12 : cfg.recentWindowHours);

  card.appendChild(check('Разрешать брони с переходом между кортами',
    draft.allowCourtSwitch, v => { draft.allowCourtSwitch = v; },
    'Игрок доигрывает на соседнем корте — так продаётся время, которое иначе простаивало бы.'));
  card.appendChild(check('Уплотнять занятость кортов',
    draft.packCourts, v => { draft.packCourts = v; },
    'Складывать брони плотнее, оставляя второй корт цельным под длинные брони.'));

  const acts = el('div', 'acts');
  acts.appendChild(btn('Сохранить', 'btn sm', () => saveSchedule('adminUpdateConfig', {
    patch: {
      booking: {
        openTime: open.value,
        closeTime: close.value,
        minBookingMinutes: Number(minBook.value),
        approvalFromMinutes: Number(approval.value),
        cancelDeadlineHours: Number(cancelH.value),
        cancelGraceMinutes: Number(cancelM.value),
        maxActiveBookingsPerClient: Number(maxActive.value),
        horizonDays: Number(horizon.value),
        minLeadMinutes: Number(lead.value),
        maxSwitches: Number(switches.value),
        recentWindowHours: Number(recent.value),
        allowCourtSwitch: draft.allowCourtSwitch,
        packCourts: draft.packCourts,
      },
      pricing: { pricePerHour: Number(price.value) },
    },
  }, 'Настройки сохранены')));
  card.appendChild(acts);

  card.appendChild(txt('div', 'empty',
    'Новые настройки расходятся по серверу в течение минуты — столько живёт кэш. '
    + 'Сокращать часы работы поверх уже заведённых броней система не даст: сначала покажет, какие мешают.'));
}

// Список получасовых меток. Заполночные подписаны словами: «01:00 ночи»
// читается однозначно, а «01:00» в строке про закрытие — нет.
function timeSelect(parent, label, value, fromMin, toMin) {
  const sel = document.createElement('select');
  const values = [];
  for (let m = fromMin; m <= toMin; m += db.config.slotStep) values.push(m);
  const cur = timeToMinutes(value);
  if (values.indexOf(cur) === -1) values.push(cur);
  values.sort((a, b) => a - b).forEach(m => {
    const text = m === 1440 ? 'полночь' : (m > 1440 ? fmtTime(minutesToTime(m)) + ' ночи' : fmtTime(minutesToTime(m)));
    sel.appendChild(opt(minutesToTime(m), text));
  });
  sel.value = minutesToTime(cur);
  wrapField(parent, label, sel);
  return sel;
}

function pickField(parent, label, value, options, format) {
  const sel = document.createElement('select');
  const list = options.indexOf(value) === -1 ? options.concat(value).sort((a, b) => a - b) : options;
  list.forEach(v => sel.appendChild(opt(String(v), format(v))));
  sel.value = String(value);
  wrapField(parent, label, sel);
  return sel;
}

// Корты. Удаления нет: на корт ссылаются прошлые брони, и стёртый
// справочник превратил бы историю в «Корт undefined». Вместо удаления —
// выключение, и то лишь когда на корте нет будущих броней.
function renderCourts(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Корты <span class="sub">названия и покрытие</span></h2>';
  view.appendChild(card);

  (db.allCourts || []).forEach(c => {
    const it = el('div', 'item');
    it.innerHTML = '<div class="t1">' + escapeHtml(c.name)
      + (c.active === false ? ' <span class="pill grey">выключен</span>' : '') + '</div>'

function openCourtForm(existing) {
  const body = el('div');
  body.innerHTML = '<h3>' + (existing ? 'Правка корта' : 'Новый корт') + '</h3>'
    + '<div class="m-sub">Название видно клиентам в сетке и в письмах бота.</div>';

  const name = document.createElement('input');
  name.value = existing ? existing.name : '';
  name.placeholder = 'Например: Корт 3';
  wrapField(body, 'Название', name);

  const surface = document.createElement('input');
  surface.value = existing ? (existing.surface || '') : 'хард';
  surface.placeholder = 'хард, грунт, ковёр';
  wrapField(body, 'Покрытие', surface);

  const flags = { indoor: existing ? existing.indoor !== false : true,
    active: existing ? existing.active !== false : true };
  body.appendChild(check('Крытый', flags.indoor, v => { flags.indoor = v; }));
  body.appendChild(check('Работает', flags.active, v => { flags.active = v; },
    'Выключенный корт не показывается ни в панели, ни на сайте.'));

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  acts.appendChild(btn(existing ? 'Сохранить' : 'Добавить', 'btn', async () => {
    if (name.value.trim().length < 2) { toast('Укажите название'); return; }
    const payload = {
      name: name.value, surface: surface.value, indoor: flags.indoor, active: flags.active,
    };
    if (existing) payload.id = existing.id;
    closeModal();
    await saveSchedule('adminSaveCourt', payload, existing ? 'Корт изменён' : 'Корт добавлен');
  }));
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => name.focus(), 50);
}

// Куда бот пишет объявления об освободившемся времени и откуда берёт
// новости. Список чатов бот набирает сам — из тех групп, где он состоит
// и что-то видел: числовой id группы владельцу взять неоткуда.
function renderAnnounceChat(view) {
  const card = el('div', 'card');
  card.innerHTML = '<h2>Чат центра <span class="sub">объявления и новости</span></h2>';
  view.appendChild(card);

  if (!db.chats) {
    card.appendChild(txt('div', 'empty', 'Загружаем список чатов…'));
    return;
  }

  if (!db.chats.chats.length) {
    card.appendChild(txt('div', 'empty',
      'Бот пока не видел ни одной группы. Добавьте его в чат центра администратором и '
      + 'напишите там что-нибудь — группа появится в этом списке в течение минуты.'));
    return;
  }

  const announceSel = document.createElement('select');
  announceSel.appendChild(opt('', 'Не публиковать'));
  db.chats.chats.forEach(c => announceSel.appendChild(opt(String(c.id), c.title)));
  announceSel.value = db.chats.groupChatId || '';
  wrapField(card, 'Объявления об освободившемся времени', announceSel);

  // Тема форума. В группе с темами сообщение без неё падает в «General»,
  // где его никто не ждёт. Названия тем бот узнаёт не всегда — тогда
  // тема подписана номером, и выбрать её всё равно можно.
  const threadSel = document.createElement('select');
  const fillThreads = () => {
    const chat = db.chats.chats.find(c => String(c.id) === announceSel.value);
    const topics = (chat && chat.topics) || [];
    const keep = threadSel.value;
    threadSel.innerHTML = '';
    threadSel.appendChild(opt('', topics.length ? 'Без темы — в общую ленту' : 'Тем в этом чате не видно'));
    topics.forEach(t => threadSel.appendChild(opt(String(t.id), t.title || ('тема №' + t.id))));
    threadSel.value = keep || db.chats.groupThreadId || '';
    threadSel.disabled = !topics.length;
  };
  fillThreads();
  announceSel.addEventListener('change', fillThreads);
  wrapField(card, 'Тема для объявлений', threadSel);

  const newsSel = document.createElement('select');
  newsSel.appendChild(opt('', 'Из любой группы, где стоит бот'));
  db.chats.chats.forEach(c => newsSel.appendChild(opt(String(c.id), c.title)));
  newsSel.value = db.chats.newsChatId || '';
  wrapField(card, 'Новости на главную брать из', newsSel);

  const acts = el('div', 'acts');
  acts.appendChild(btn('Сохранить', 'btn sm', () => saveSchedule('adminUpdateConfig', {
    patch: {
      announce: { groupChatId: announceSel.value, groupThreadId: threadSel.value },
      news: { chatId: newsSel.value },
    },
  }, 'Чат сохранён')));
  card.appendChild(acts);

  card.appendChild(txt('div', 'empty',
    'Объявление уходит, когда освобождается постоянное время или отменяют бронь ближе чем за '
    + db.chats.freeSlotHours + ' ч до игры. Первые ' + db.chats.priorityMinutes
    + ' минут время предлагается только тем, кто стоит в очереди ожидания, — и лишь потом '
    + 'попадает в чат. Несколько отмен подряд склеиваются в одно сообщение.'
    + (db.chats.lastPostAt ? ' Последнее объявление: ' + shortDateTime(db.chats.lastPostAt) + '.' : '')));

  renderMembershipGate(view);
}

// Кто может завести учётку через бота. Подтверждённый Telegram номер
// отвечает на вопрос «настоящий ли телефон», но не на вопрос «кто это»;
