<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Единственный заголовок безопасности, который нам доступен: заголовки
     ответа задаёт GitHub Pages, а не мы, и добавить HSTS или
     X-Frame-Options на статике некуда — в теге браузер их игнорирует.

     Скрипт и стиль вынесены в js/ и css/ ради одного: политика обходится
     без 'unsafe-inline'. Попади в страницу чужая разметка — <script>,
     onerror=, style= — браузер её не выполнит. Поэтому никаких встроенных
     обработчиков и атрибутов style ни в разметке, ни в шаблонах скрипта:
     стиль задаётся классом или через el.style (CSSOM под запрет не
     попадает). tests/test-pages.js следит за этим сам.

     connect-src и img-src не дают увезти данные на чужой хост. Список
     адресов держать в порядке — фотографии каталога и новостей идут из
     бакета, запросы уходят только в функцию. Локальный стенд подставляет
     свой адрес в connect-src сам, файл на диске при этом не меняется
     (tools/dev-server.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://storage.yandexcloud.net/alfa-tennis-data/; connect-src https://functions.yandexcloud.net/d4e0s6c0a0a800fl5cdt; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Альфа — панель администратора</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg?v=cb42754a48">
<meta name="theme-color" content="#3F6CA3">
<link rel="stylesheet" href="css/admin.css?v=93def858eb">
</head>
<body>

<!-- ---------- Вход ---------- -->
<div class="login" id="login">
  <div class="login-card">
    <img class="login-logo" src="img/logo.svg?v=ae8bf22e85" alt="Логотип теннисного центра «Альфа»">
    <h1>Панель администратора</h1>
    <p class="who">Теннисный центр «Альфа»</p>
    <div class="login-note" id="loginNote">
      Вход для администратора и владельца центра.
    </div>
    <input class="inp" id="loginPhone" type="tel" inputmode="tel" autocomplete="username"
           placeholder="+7 (___) ___-__-__">
    <div class="pass-wrap">
      <input class="inp" id="loginPass" type="password" autocomplete="current-password"
             placeholder="Пароль">
      <button type="button" class="pass-eye" id="loginPassEye"></button>
    </div>
    <button class="btn" id="loginBtn">Войти</button>
  </div>
</div>

<!-- ---------- Приложение ---------- -->
<div id="app" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <span class="logo"><img src="img/logo.svg?v=ae8bf22e85" alt=""></span>
      <span class="title">Альфа · панель администратора</span>
      <span class="badge-demo" id="whoBadge"></span>
      <span class="spacer"></span>
      <button class="link-out" id="reloadBtn">Обновить</button>
      <button class="link-out" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>

  <main id="view"></main>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- Лист тренировки на печать. На экране скрыт всегда, на бумаге —
     единственное, что остаётся от страницы. -->
<div id="printArea"></div>

<script src="js/admin.js?v=2d98e13753"></script>
</body>
</html>
