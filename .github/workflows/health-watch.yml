# Внешний сторож за каналом до Telegram.
#
# Живёт здесь, а не в Яндекс-облаке, намеренно: сторож, работающий рядом
# с тем, что он сторожит, ляжет вместе с ним. И пишет он вторым ботом —
# основной в момент поломки как раз молчит, это ровно тот канал, о
# котором надо сообщить.
#
# Лежит в публичном репозитории тоже намеренно: минуты Actions бесплатны
# без ограничений только для публичных. Токен и чат живут в секретах
# репозитория и в этот файл не попадают.
name: Сторож за ботом

on:
  schedule:
    # Раз в десять минут. Чаще смысла нет: сама тревога поднимается
    # только после пятнадцати минут молчания, а GitHub всё равно
    # запускает расписание с задержкой до четверти часа.
    - cron: '*/10 * * * *'
  workflow_dispatch:        # кнопка «проверить сейчас» на вкладке Actions

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Прошлое состояние. Ключ всегда новый, поэтому запись проходит
      # каждый раз; restore-keys подтягивает самую свежую запись по
      # префиксу. Кеш GitHub — вещь best-effort: пропал, значит следующая
      # тревога придёт повторно. Это лучше, чем не прийти вовсе.
      - name: Достать прошлое состояние
        uses: actions/cache@v4
        with:
          path: state
          key: alfa-health-${{ github.run_id }}
          restore-keys: alfa-health-

      - name: Спросить здоровье и решить, писать ли
        env:
          API: https://functions.yandexcloud.net/d4e0s6c0a0a800fl5cdt
          BOT: ${{ secrets.WATCH_BOT_TOKEN }}
          CHAT: ${{ secrets.WATCH_CHAT_ID }}
        run: |
          set -u
          if [ -z "${BOT}" ] || [ -z "${CHAT}" ]; then
            echo "Секреты WATCH_BOT_TOKEN и WATCH_CHAT_ID не заданы — сторож молчит."
            exit 0
          fi

          mkdir -p state
          PREV=$(cat state/last 2>/dev/null || echo "unknown")

          # Три попытки: одиночный сетевой сбой между GitHub и Яндексом
          # не должен выглядеть как поломка клуба.
          NOW="down"
          for i in 1 2 3; do
            BODY=$(curl -sS --max-time 25 -X POST "$API" \
              -H 'Content-Type: application/json' \
              -d '{"action":"health"}' || echo '')
            echo "попытка $i: ${BODY:-нет ответа}"
            case "$BODY" in
              *'"ok":true'*)  NOW="up";   break ;;
              *'"ok":false'*) NOW="down"; break ;;   # функция жива, молчит бот
            esac
            NOW="unreachable"                        # не ответила сама функция
            sleep 10
          done

          echo "было: $PREV, стало: $NOW"
          printf '%s' "$NOW" > state/last

          # Пишем только на переходе. Иначе при суточной поломке
          # прилетело бы полторы сотни одинаковых сообщений, и читать
          # их перестали бы на третьем.
          [ "$NOW" = "$PREV" ] && { echo "состояние не менялось — молчим"; exit 0; }

          # Текст кладём в файл и отдаём curl ссылкой на него: русский
          # текст через переменную окружения зависит от локали агента, и
          # Telegram отвечает «strings must be encoded in UTF-8». Файл
          # такой зависимости не имеет.
          case "$NOW" in
            up)
              [ "$PREV" = "unknown" ] && { echo "первый запуск и всё в порядке — молчим"; exit 0; }
              cat > msg.txt <<'MSG'
✅ Бот клуба снова отвечает.

Напоминания и уведомления уходят как обычно.
MSG
              ;;
            down)
              cat > msg.txt <<'MSG'
⚠️ Бот клуба молчит.

Сервер отвечает, но канал до Telegram не работает: напоминания клиентам и уведомления администратору сейчас не уходят. Сайт и панель при этом работают.
MSG
              ;;
            *)
              cat > msg.txt <<'MSG'
🛑 Сервер клуба не отвечает.

Не удалось достучаться до функции с трёх попыток. Проверьте сайт alfa-tennis.ru — возможно, лежит не только бот.
MSG
              ;;
          esac

          curl -sS --max-time 25 -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text@msg.txt" \
            -o /dev/null -w 'отправлено, код %{http_code}\n'
