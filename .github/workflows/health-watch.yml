# Внешний сторож за каналом до Telegram.
#
# Живёт здесь, а не в Яндекс-облаке, намеренно: сторож, работающий рядом
# с тем, что он сторожит, ляжет вместе с ним. И пишет он вторым ботом —
# основной в момент поломки как раз молчит, это ровно тот канал, о
# котором надо сообщить.
#
# Лежит в публичном репозитории тоже намеренно: минуты Actions бесплатны
# без ограничений только для публичных. Токен и чат живут в секретах
# репозитория и в этот файл не попадают.
name: Сторож за ботом

on:
  schedule:
    # Раз в десять минут. Чаще смысла нет: сама тревога поднимается
    # только после пятнадцати минут молчания, а GitHub всё равно
    # запускает расписание с задержкой до четверти часа.
    - cron: '*/10 * * * *'
  workflow_dispatch:        # кнопка «Run workflow» на вкладке Actions
    inputs:
      test:
        description: Прислать пробное сообщение — проверка, что канал живой
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Прошлое состояние. Ключ всегда новый, поэтому запись проходит
      # каждый раз; restore-keys подтягивает самую свежую запись по
      # префиксу. Кеш GitHub — вещь best-effort: пропал, значит следующая
      # тревога придёт повторно. Это лучше, чем не прийти вовсе.
      - name: Достать прошлое состояние
        uses: actions/cache@v4
        with:
          path: state
          key: alfa-health-${{ github.run_id }}
          restore-keys: alfa-health-

      - name: Спросить здоровье и решить, писать ли
        env:
          API: https://functions.yandexcloud.net/d4e0s6c0a0a800fl5cdt
          BOT: ${{ secrets.WATCH_BOT_TOKEN }}
          CHAT: ${{ secrets.WATCH_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
        run: |
          set -u
          # Без секретов шаг раньше просто выходил с нулём, и снаружи
          # «всё хорошо» было не отличить от «сторож не настроен». Теперь
          # это видно по коду выхода.
          if [ -z "${BOT}" ] || [ -z "${CHAT}" ]; then
            echo "Не заданы секреты WATCH_BOT_TOKEN и WATCH_CHAT_ID — сторожить нечем."
            exit 1
          fi

          # Проверка связи по требованию. Настоящая тревога приходит
          # редко, а убедиться, что канал живой, надо уметь в любой день.
          if [ "${TEST:-false}" = "true" ]; then
            printf '%b' '🔔 Проверка связи со сторожем.\n\nКанал работает: если бот клуба замолчит, сообщение придёт сюда.' > msg.txt
            curl -sS --fail --max-time 25 -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text@msg.txt" \
              -o /dev/null -w 'пробное сообщение отправлено, код %{http_code}\n' \
              || { echo "не дошло: проверьте WATCH_BOT_TOKEN и WATCH_CHAT_ID"; exit 1; }
            exit 0
          fi

          mkdir -p state
          PREV=$(cat state/last 2>/dev/null || echo "unknown")

          # Три попытки: одиночный сетевой сбой между GitHub и Яндексом
          # не должен выглядеть как поломка клуба.
          NOW="down"
          for i in 1 2 3; do
            BODY=$(curl -sS --max-time 25 -X POST "$API" \
              -H 'Content-Type: application/json' \
              -d '{"action":"health"}' || echo '')
            echo "попытка $i: ${BODY:-нет ответа}"
            case "$BODY" in
              *'"ok":true'*)  NOW="up";   break ;;
              *'"ok":false'*) NOW="down"; break ;;
              *)              NOW="unreachable" ;;
            esac
            sleep 10
          done

          echo "было: $PREV, стало: $NOW"

          # Состояние запоминается только после того, как о нём удалось
          # сообщить. Иначе сорванная отправка теряла бы тревогу
          # навсегда: следующий запуск считал бы, что уже написал.
          remember() { printf '%s' "$NOW" > state/last; }

          # Пишем только на переходе. Иначе при суточной поломке
          # прилетело бы полторы сотни одинаковых сообщений, и читать
          # их перестали бы на третьем.
          if [ "$NOW" = "$PREV" ]; then
            remember
            echo "состояние не менялось — молчим"
            exit 0
          fi

          # Текст держим в переменной, а не в heredoc: тело heredoc
          # пришлось бы писать от нулевой колонки, то есть вне блока
          # run, и YAML разобрал бы его как разметку. Ровно на этом
          # workflow один раз и не запустился.
          case "$NOW" in
            up)
              if [ "$PREV" = "unknown" ]; then
                remember
                echo "первый запуск и всё в порядке — молчим"
                exit 0
              fi
              MSG='✅ Бот клуба снова отвечает.\n\nНапоминания и уведомления уходят как обычно.'
              ;;
            down)
              MSG='⚠️ Бот клуба молчит.\n\nСервер отвечает, но канал до Telegram не работает: напоминания клиентам и уведомления администратору сейчас не уходят. Сайт и панель при этом работают.'
              ;;
            *)
              MSG='🛑 Сервер клуба не отвечает.\n\nНе удалось достучаться до функции с трёх попыток. Проверьте сайт alfa-tennis.ru — возможно, лежит не только бот.'
              ;;
          esac

          # Текст уходит файлом, а не значением параметра: русский текст
          # через переменную зависит от локали, и Telegram отвечает
          # «strings must be encoded in UTF-8».
          printf '%b' "$MSG" > msg.txt
          if curl -sS --fail --max-time 25 -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
               --data-urlencode "chat_id=${CHAT}" \
               --data-urlencode "text@msg.txt" \
               -o /dev/null -w 'отправлено, код %{http_code}\n'; then
            remember
          else
            echo "отправить не удалось — состояние не запоминаем, повторим на следующем запуске"
            exit 1
          fi
