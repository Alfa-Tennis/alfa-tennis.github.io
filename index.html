<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теннисный центр «Альфа» — бронирование кортов в Краснодаре</title>
<meta name="description" content="Онлайн-бронирование кортов теннисного центра «Альфа», Краснодар. Два крытых корта, с 5:00 до 24:00 без выходных.">
<style>
/* Палитра снята прямо из вектора логотипа: #3F6CA3 у знака и надписи,
   #A4DB00 у мяча — это не подбор на глаз, а те же значения из файла.
   Золота в логотипе больше нет, и раньше `--gold` тянул две несовместимые
   роли сразу — призыв и предупреждение. Теперь это разные переменные:
   лайм зовёт (`--ball`), янтарь предупреждает (`--warn`). Звезда рейтинга
   осталась жёлтой намеренно: лаймовая звезда читается как ошибка. */
:root {
  --ink: #22272C;
  --ink-soft: #5F6B72;
  --line: #DDE3E5;
  --bg: #F2F4F5;
  --surface: #FFFFFF;

  --court: #3F6CA3;
  --court-dk: #2F5480;
  --court-tint: #E8F0F9;
  --court-line: #C6D9EE;

  --ball: #A4DB00;
  --ball-dk: #4C6600;
  --ball-tint: #F0F8D8;

  --warn: #C98A14;
  --warn-dk: #7A5410;
  --warn-tint: #FDF3DE;
  --warn-line: #EFDCB2;

  --star: #F0B429;

  --grass: #5C752F;
  --danger: #B23B3B;
  --danger-tint: #FBEDED;

  --radius: 12px;
  --shadow: 0 1px 2px rgba(34,39,44,.06), 0 8px 24px rgba(34,39,44,.07);
}

* { box-sizing: border-box; }
/* Любое правило вроде `display: flex` на элементе сильнее браузерного
   `[hidden] { display: none }`, и скрытый блок остаётся на экране.
   Закрываем это раз и навсегда для всей страницы. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 104px;
}
a { color: var(--court-dk); }
button { font: inherit; }
input, select, textarea { font: inherit; color: inherit; }

/* ---------- Шапка ---------- */
.hero { background: linear-gradient(160deg, #1E3A5F 0%, #2C4F7C 100%); color: #fff; padding: 20px 16px 24px; }
.hero-inner { max-width: 920px; margin: 0 auto; }
.hero-top { display: flex; align-items: center; gap: 14px; }
/* Вектор логотипа шире, чем выше (444×263), и в квадратной плашке
   давал бы белые поля сверху и снизу. Плашка под пропорции знака. */
.logo { width: 92px; height: 56px; border-radius: 12px; background: #fff; padding: 5px 8px; flex: 0 0 auto; }
.logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.hero h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -.01em; }
.hero .where { margin: 2px 0 0; font-size: 14px; color: rgba(255,255,255,.72); }
.hero-top .grow { flex: 1; }

/* Отдельной строкой на всю ширину: рядом с названием на телефоне фраза
   рвалась посередине — «4,9 · 64 / оценки на / Яндекс.Картах». */
.rating { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 14px; color: rgba(255,255,255,.85); margin-top: 12px; }
.rating .star { color: var(--star); }

.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.fact {
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px; padding: 6px 12px; font-size: 14px;
}
.fact b { font-weight: 600; }
.fact.accent { background: var(--ball); border-color: var(--ball); color: #2C3A08; }
.hero a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }

/* Чем клуб хорош — читают до выбора времени, а не после, поэтому это
   в шапке, а не в подвале. */
.about { margin: 14px 0 0; font-size: 14px; color: rgba(255,255,255,.72); line-height: 1.45; }
.about .svc { display: block; margin-top: 4px; }

.who {
  appearance: none; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08);
  color: #fff; border-radius: 999px; padding: 8px 15px; cursor: pointer; white-space: nowrap;
}
.who:hover { background: rgba(255,255,255,.16); }

/* ---------- Навигация ---------- */
.nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.nav-inner { max-width: 920px; margin: 0 auto; display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; }
.nav button {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 13px 14px; cursor: pointer; color: var(--ink-soft); white-space: nowrap;
}
.nav button:hover { color: var(--ink); }
.nav button.on { color: var(--court-dk); border-bottom-color: var(--court); font-weight: 600; }
.nav .dot { background: var(--ball); color: #2C3A08; border-radius: 999px; font-size: 11px; padding: 1px 6px; margin-left: 5px; font-weight: 600; }

main { max-width: 920px; margin: 0 auto; padding: 0 12px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 22px 4px 10px; text-transform: uppercase; letter-spacing: .05em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card h2 { margin: 0 0 10px; font-size: 16px; }

.notice { margin: 14px 0 0; background: var(--warn-tint); border: 1px solid var(--warn-line); color: var(--warn-dk); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; }
.notice.info { background: var(--court-tint); border-color: var(--court-line); color: var(--court-dk); }
.empty { color: var(--ink-soft); font-size: 14px; padding: 4px 2px; }

/* ---------- Кнопки ---------- */
.btn { appearance: none; border: 0; border-radius: 10px; background: var(--court); color: #fff; font-weight: 600; padding: 11px 20px; cursor: pointer; }
.btn:hover { background: var(--court-dk); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { padding: 7px 13px; font-size: 14px; }
.btn.sec { background: #EDF0F1; color: var(--ink); }
.btn.sec:hover { background: #E2E7E9; }
.btn.danger { background: var(--danger); }
.btn.danger:hover { background: #96302F; }
.btn.ghost { background: transparent; color: var(--ink-soft); font-weight: 400; padding: 11px 8px; }
.btn.wide { width: 100%; }

.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: #fff; }
.field input:focus { outline: 2px solid var(--court-tint); border-color: var(--court); }

.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; border: 1px solid var(--line); }
.pill.ok { background: var(--court-tint); border-color: var(--court-line); color: var(--court-dk); }
.pill.wait { background: var(--warn-tint); border-color: var(--warn-line); color: var(--warn-dk); }
.pill.bad { background: var(--danger-tint); border-color: #EEC9C9; color: var(--danger); }
.pill.grey { background: #EFF2F3; color: var(--ink-soft); }

/* ---------- Дни ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 10px; }
.day { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 14px; cursor: pointer; text-align: center; min-width: 94px; }
.day:hover { border-color: var(--court); }
.day .d-label { font-size: 14px; font-weight: 600; white-space: nowrap; }
.day .d-free { font-size: 12px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
.day.active { background: var(--court); border-color: var(--court); color: #fff; }
.day.active .d-free { color: rgba(255,255,255,.82); }

/* ---------- Панель подбора ---------- */
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.picker-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.picker-row .lab { font-size: 14px; color: var(--ink-soft); }
.chips { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.chip { appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
.chip:hover { border-color: var(--court); }
.chip.on { background: var(--court); border-color: var(--court); color: #fff; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }

/* Вариантов бывает три десятка — без ограничения высоты они отодвигают
   сетку кортов далеко за пределы экрана телефона. */
.opts { display: flex; flex-wrap: wrap; gap: 8px; max-height: 216px; overflow-y: auto; }
.opt { appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; text-align: left; line-height: 1.25; cursor: pointer; }
.opt:hover { border-color: var(--court); }
.opt.on { border-color: var(--court); background: var(--court-tint); }
.opt .o-time { display: block; font-weight: 600; font-size: 15px; }
.opt .o-court { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; white-space: nowrap; }
.opt.split .o-court { color: var(--warn-dk); }
.opts-empty { font-size: 14px; color: var(--ink-soft); padding: 2px; }
.picker-foot { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); }
.grid-hint { margin: 10px 4px 0; font-size: 13px; color: var(--ink-soft); }

/* ---------- Сетка ---------- */
/* overflow: clip, а не hidden — намеренно. `hidden` делает карточку
   собственной областью прокрутки, и `position: sticky` у шапки сетки
   начинает считать отступ от карточки, а не от окна: шапка встаёт на
   49 пикселей ниже своей строки и навсегда накрывает 05:00 и половину
   05:30. Именно это и видел владелец. `clip` обрезает так же, но
   области прокрутки не создаёт. */
.grid-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: clip; }
.grid { display: grid; }
.g-head { position: sticky; top: var(--nav-h, 53px); z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 6px; font-size: 14px; font-weight: 600; text-align: center; }
.g-head.corner { z-index: 4; }
.g-head .g-sub { display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.g-time { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); padding: 0 8px; display: flex; align-items: center; justify-content: flex-end; height: 34px; }
.g-time.hour { color: var(--ink); font-weight: 600; }

.cell { height: 34px; border-bottom: 1px solid #EEF1F2; border-right: 1px solid #EEF1F2; position: relative; }
.cell.hour-line { border-top: 1px solid var(--line); }
.cell.free { background: var(--surface); cursor: pointer; }
.cell.free:hover { background: var(--court-tint); }
.cell.busy { background: #E5E9EA; cursor: pointer; }
.cell.busy:hover { background: #DCE1E3; }
.cell.regular { background: repeating-linear-gradient(45deg, #E5E9EA 0 6px, #DBE1E2 6px 12px); cursor: pointer; }
/* Открытая тренировка — занято, но не чужое: сюда можно записаться,
   и клетка обязана отличаться от обычной брони с первого взгляда. */
.cell.openplay { background: var(--ball-tint); cursor: pointer; box-shadow: inset 3px 0 0 var(--ball); }
.cell.openplay:hover { background: #E7F4C4; }
.cell.openplay .tag { color: var(--ball-dk); font-weight: 600; }
.cell.closed { background: repeating-linear-gradient(45deg, #D2D8DA 0 6px, #C7CED0 6px 12px); }
.cell.past { background: #F7F8F9; }
.cell.mine { background: var(--grass); }
.cell.sel { background: var(--court); }
.cell.sel:hover { background: var(--court-dk); }
/* Белая черта в месте перехода на соседний корт: видно, что бронь одна,
   но играть её придётся на двух кортах. */
.cell.sel.seg-break, .cell.mine.seg-break { box-shadow: inset 0 3px 0 #fff; }
.cell .tag { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #8B979C; pointer-events: none; white-space: nowrap; }
.cell.mine .tag { color: #fff; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 4px 0; font-size: 13px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.sw.free { background: #fff; }
.sw.busy { background: #E5E9EA; }
.sw.regular { background: repeating-linear-gradient(45deg, #E5E9EA 0 4px, #DBE1E2 4px 8px); }
.sw.openplay { background: var(--ball-tint); box-shadow: inset 3px 0 0 var(--ball); }
.sw.closed { background: repeating-linear-gradient(45deg, #D2D8DA 0 4px, #C7CED0 4px 8px); }
.sw.mine { background: var(--grass); }

/* ---------- Нижняя панель ---------- */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(34,39,44,.09); transform: translateY(110%); transition: transform .18s ease-out; }
.bar.show { transform: none; }
.bar-inner { max-width: 920px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar .info { flex: 1 1 210px; min-width: 0; }
.bar .info .t1 { font-weight: 600; }
.bar .info .t2 { font-size: 14px; color: var(--ink-soft); }
.bar .info .switch-note { color: var(--warn-dk); }
.bar .info .switch-note:empty { display: none; }

/* ---------- Мои брони ---------- */
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.item.past { opacity: .72; }
.item .t1 { font-weight: 600; }
.item .t2 { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
.item .t3 { font-size: 13px; color: var(--warn-dk); margin-top: 4px; }
.item .acts { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Модальные окна ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(34,39,44,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.backdrop.show { display: flex; }
.modal { background: var(--surface); border-radius: 14px; max-width: 420px; width: 100%; max-height: 90vh; overflow: auto; padding: 20px; }
.modal h3 { margin: 0 0 4px; font-size: 19px; }
.modal .m-sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; }
.modal .m-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tabs2 { display: flex; gap: 6px; margin-bottom: 16px; }
.tabs2 button { flex: 1; appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 9px; cursor: pointer; }
.tabs2 button.on { background: var(--court); border-color: var(--court); color: #fff; font-weight: 600; }

/* Код сверки при входе через Telegram: его читают глазами и сравнивают
   с сообщением бота, поэтому он крупный и с разрядкой. */
.tg-or { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 13px; margin: 16px 0 12px; }
.tg-or::before, .tg-or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.tg-code { font-size: 32px; font-weight: 700; letter-spacing: .22em; text-align: center;
  background: var(--court-tint); border-radius: 10px; padding: 14px 10px 14px 18px; margin: 14px 0; }

.summary { background: var(--court-tint); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.summary .s-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 2px 0; }
.summary .s-row.total { font-weight: 600; font-size: 16px; border-top: 1px solid var(--court-line); margin-top: 6px; padding-top: 8px; }
.rent { margin-bottom: 14px; }
.rent-head { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.rent-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
.rent-row.on { border-color: var(--ball); background: var(--ball-tint); }
.rent-name b { display: block; font-size: 14px; font-weight: 600; }
.rent-name span { font-size: 12.5px; color: var(--ink-soft); }
.stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
/* Кнопки крупные не для красоты: по ним попадают пальцем на телефоне,
   а промах здесь стоит лишней ракетки в счёте. */
.stepper-b { width: 34px; height: 34px; border: 1px solid var(--line); background: #fff;
  border-radius: 9px; font-size: 18px; line-height: 1; cursor: pointer; color: var(--ink); }
.stepper-b:active { background: var(--court-tint); }
.stepper-n { min-width: 22px; text-align: center; font-weight: 600; font-size: 15px; }
.rent-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

.toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(12px); background: var(--ink); color: #fff; font-size: 14px; padding: 11px 17px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 60; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.state { padding: 40px 10px; text-align: center; color: var(--ink-soft); }

/* Главная */
.cta { background: var(--court); color: #fff; border-radius: var(--radius); padding: 18px 16px; margin-top: 18px; }
.cta h2 { margin: 0 0 4px; font-size: 19px; }
/* Цена и часы стоят здесь, у самой кнопки, теми же чипами, что и в
   шапке: там они были вторым экземпляром той же строки. */
.cta .facts { margin: 12px 0 0; }
.cta .fact.accent { font-size: 15px; padding: 7px 14px; }
.cta p { margin: 12px 0 14px; font-size: 14px; color: rgba(255,255,255,.82); line-height: 1.45; }
.cta .btn { background: var(--ball); color: #2C3A08; }
.cta .btn:hover { background: #93C400; }
.ev { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.ev-when { flex: 0 0 auto; text-align: center; min-width: 52px; }
.ev-when .d { font-size: 20px; font-weight: 600; line-height: 1.1; }
.ev-when .m { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; }
.ev-what { min-width: 0; }
.ev-what .t1 { font-weight: 600; }
.ev-what .t2 { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }
.post { padding: 12px 0; border-bottom: 1px solid var(--line); }
.post:last-of-type { border-bottom: 0; }
.post-pic { border-radius: 10px; overflow: hidden; margin-bottom: 10px; max-width: 460px; }
.post-pic img { width: 100%; display: block; }
.post-when { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
.post-text { margin-top: 5px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
.goods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.goods-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.goods-pic { aspect-ratio: 4 / 3; background: #fff; }
.goods-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.goods-pic.no-pic { background: repeating-linear-gradient(45deg, #F2F4F5 0 8px, #E9EDEE 8px 16px); }
.goods-body { padding: 10px 11px 12px; }
.goods-body .t1 { font-weight: 600; font-size: 15px; line-height: 1.25; }
.goods-body .t-price { margin-top: 4px; font-weight: 600; color: var(--court-dk); }
.goods-body .t2 { margin-top: 5px; font-size: 13px; color: var(--ink-soft); line-height: 1.4; white-space: pre-line; }
.goods-body .btn { margin-top: 10px; }
.svc-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
.svc-row.sub { padding-left: 14px; font-size: 14px; color: var(--ink-soft); }
.svc-row:last-child { border-bottom: 0; }
.svc-row b { white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
footer { max-width: 920px; margin: 26px auto 0; padding: 0 16px; color: var(--ink-soft); font-size: 13px; }

<script>
// ============================================================
// Клиентская страница теннисного центра «Альфа».
//
// Занятость кортов видна всем без входа — ради этого сюда и заходят.
// Бронировать может только проверенный клиент: предоплаты нет, поэтому
// администратор один раз подтверждает человека, и дальше он бронирует
// сам.
//
// Адрес функции подставляется при развёртывании. Локальный стенд
// (tools/dev-server.js) подменяет его на свой при отдаче страницы —
// сам файл при этом не меняется.
// ============================================================

const API_URL = 'https://functions.yandexcloud.net/d4e0s6c0a0a800fl5cdt';

const state = {
  config: null,
  data: null,          // ответ getAvailability
  date: null,
  plan: null,          // { fromIdx, toIdx, switches, segments }
  duration: 60,
  courtFilter: null,
  noSwitch: false,
  view: 'home',
  landing: null,       // ответ getLanding: афиша и всё, что на главной
  openPlay: null,      // ответ openPlayList: открытые тренировки
  auth: null,          // { token, client }
  mine: null,          // ответ myBookings
  passHistory: null,   // операции по абонементу; читаются по кнопке
  tgUnlinked: false,   // открыли из Telegram, но учётка не привязана
  pendingAfterLogin: false,
};

const TOKEN_KEY = 'alfa_token';

// Обращение к localStorage может выбросить исключение: приватный режим,
// отключённое хранилище, открытие файла по data:-адресу. Без обёртки
// это роняет всю страницу целиком, включая сетку занятости, которая
// вообще-то никакого хранилища не требует.
const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* работаем без запоминания входа */ } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* нечего чистить */ } },
};

// ---------- Время и формат ----------

function timeToMinutes(t) {
  const m = /^(\d{1,2}):([0-5]\d)$/.exec(String(t));
  return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
}
function minutesToTime(mins) {
  return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
}
// Клубные сутки уходят за полночь: зимой корт работает до часу ночи, и
// внутри такое время живёт как «24:30». Хранить и сравнивать удобно
// именно так — строки времени сортируются как строки, и «00:30» уехало
// бы в начало дня. Человеку показываем настоящие часы.
function fmtTime(t) {
  const min = timeToMinutes(t);
  if (!Number.isFinite(min)) return String(t == null ? '' : t);
  return minutesToTime(min >= 1440 ? min - 1440 : min);
}
function fmtRange(from, to) { return fmtTime(from) + '–' + fmtTime(to); }
function addDays(dateIso, n) {
  const d = new Date(dateIso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
// Момент слота в поясе клуба, а не браузера: человек может смотреть
// сайт из другого региона, «прошедшее» считается по времени Краснодара.
function slotTimestamp(dateIso, timeStr) {
  const tz = (state.config && state.config.booking.timezoneOffset) || '+03:00';
  const min = timeToMinutes(timeStr);
  // Всё, что от 24:00 и дальше, физически наступает следующим утром.
  if (min >= 1440) return new Date(addDays(dateIso, 1) + 'T' + minutesToTime(min - 1440) + ':00' + tz).getTime();
  return new Date(dateIso + 'T' + timeStr + ':00' + tz).getTime();
}

const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

function dayLabel(dateIso, today) {
  if (dateIso === today) return 'Сегодня';
  if (dateIso === addDays(today, 1)) return 'Завтра';
  const d = new Date(dateIso + 'T00:00:00Z');
  return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
}
function dayLabelLong(dateIso, today) {
  const d = new Date(dateIso + 'T00:00:00Z');
  const base = d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
  if (dateIso === today) return 'сегодня, ' + base;
  if (dateIso === addDays(today, 1)) return 'завтра, ' + base;
  return WD[d.getUTCDay()] + ', ' + base;
}
function money(v) { return Math.round(v).toLocaleString('ru-RU') + ' ₽'; }
function hoursText(minutes) {
  return (Math.round(minutes / 60 * 10) / 10).toString().replace('.', ',') + ' ч';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function el(tag, cls) { const d = document.createElement(tag); if (cls) d.className = cls; return d; }
function btn(label, cls, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

// ---------- Телефон ----------
//
// Маска только для удобства ввода: сервер всё равно приводит номер к
// десяти цифрам сам, поэтому вставленный из буфера «+7 (918) 111-22-33»
// или «89181112233» тоже пройдёт.

function formatPhoneInput(raw) {
  let digits = String(raw).replace(/\D/g, '');
  if (!digits) return '';                       // поле можно полностью очистить
  if (digits[0] === '8') digits = '7' + digits.slice(1);
  if (digits[0] !== '7') digits = '7' + digits; // человек начал сразу с кода оператора
  digits = digits.slice(0, 11);

  const rest = digits.slice(1);
  let out = '+7';
  if (rest.length) out += ' ' + rest.slice(0, 3);
  if (rest.length > 3) out += ' ' + rest.slice(3, 6);
  if (rest.length > 6) out += '-' + rest.slice(6, 8);
  if (rest.length > 8) out += '-' + rest.slice(8, 10);
  return out;
}

function attachPhoneMask(input) {
  input.type = 'tel';
  input.inputMode = 'tel';
  input.maxLength = 16;
  input.placeholder = '+7 918 000-00-00';
  input.addEventListener('focus', () => { if (!input.value) input.value = '+7 '; });
  input.addEventListener('input', () => { input.value = formatPhoneInput(input.value); });
  input.addEventListener('blur', () => { if (input.value === '+7' || input.value === '+7 ') input.value = ''; });
}

// ---------- Слой API ----------

// Одна неудачная попытка не должна оставлять страницу с вечной надписью
// «Загружаем сетку…». Так и случилось 27.08.2026 на боевом контуре: первое
// обращение к холодной функции упёрлось в 504, и страница осталась пустой,
// хотя следующий же запрос прошёл бы за долю секунды. Повторяем только то,
// что заведомо безопасно повторить.
async function request(payload, retries) {
  let lastError = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 400 * attempt));
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      // 5xx — это «сервер не смог», такое повторяют. 4xx — «запрос не тот»,
      // повторять бессмысленно, ответ не изменится.
      if (res.status >= 500 && attempt < retries) { lastError = new Error('server-' + res.status); continue; }
      return res;
    } catch (e) {
      lastError = e; // сеть не ответила вовсе
    }
  }
  throw lastError || new Error('request-failed');
}

// Действия, которые ничего не меняют. Их можно молча повторить: сеть
// моргнула — клиент этого даже не заметил. Всё остальное повторять нельзя,
// человек должен сам решить, нажимать ли второй раз.
//
// `bootstrap` здесь обязателен: он собрал в себя весь первый экран, и без
// повтора холодный отказ функции оставлял бы человека перед пустой
// страницей — ровно там, где раньше переспрашивал каждый из четырёх
// запросов по отдельности.
const SAFE_TO_REPEAT = [
  'bootstrap', 'getConfig', 'getAvailability', 'getLanding', 'openPlayList',
  'me', 'myBookings',
];

async function api(action, body) {
  const payload = Object.assign({ action }, body || {});
  if (state.auth && state.auth.token) payload.token = state.auth.token;

  const res = await request(payload, SAFE_TO_REPEAT.indexOf(action) > -1 ? 2 : 0);
  // Шлюз при ошибке отвечает не JSON, а страницей с текстом. Без этой
  // подстраховки разбор падал бы невнятной ошибкой разметки вместо
  // понятного «сервер недоступен».
  const data = await res.json().catch(() => ({ error: res.ok ? 'bad-response' : 'server-unavailable' }));
  if (!res.ok) {
    const err = new Error(data.error || 'request-failed');
    err.code = data.error;
    // Часть отказов несёт подробность, без которой их не показать
    // по-человечески: «уровень ниже» и «уровень выше» — разные тексты.
    err.data = data;
    err.hint = data.hint;
    // Токен протух или отозван — вычищаем, иначе страница будет
    // бесконечно упираться в 401 на каждом действии.
    if (res.status === 401) logout(true);
    throw err;
  }
  return data;
}

// ---------- Загрузка ----------

// Подписанные данные Mini App.
//
// Официальный способ — скрипт telegram-web-app.js с серверов Telegram, но
// страница обязана оставаться самодостаточной одним файлом, а у части
// провайдеров в РФ домен Telegram и вовсе недоступен. К счастью, те же
// данные Telegram кладёт в адрес страницы при открытии, и подпись у них
// та же самая — проверяет её всё равно сервер.
function telegramInitData() {
  const wa = window.Telegram && window.Telegram.WebApp;
  if (wa && wa.initData) return wa.initData;
  const m = /[#&]tgWebAppData=([^&]*)/.exec(window.location.hash || '');
  return m ? decodeURIComponent(m[1]) : '';
}

// Вход из Telegram: пароль не спрашиваем вовсе. Обычный вход по телефону
// при этом никуда не девается — им пользуются те, у кого Telegram нет.
async function tryTelegramLogin() {
  const initData = telegramInitData();
  if (!initData) return false;
  try {
    const r = await api('tgAuth', { initData });
    state.auth = { token: r.token, client: r.client };
    store.set(TOKEN_KEY, r.token);
    return true;
  } catch (e) {
    // Telegram подтверждает личность, но телефон в Mini App не отдаёт.
    // Поэтому незнакомого человека отправляем в бота — там он поделится
    // контактом одним нажатием, и телефон придёт подтверждённым.
    if (e.code === 'not-linked') state.tgUnlinked = true;
    return false;
  }
}

async function refreshMe() {
  if (!state.auth) return;
  try {
    const me = await api('me');
    state.auth.client = me.client;
    renderNav();
    if (state.view === 'profile') renderProfile();
  } catch (e) { /* молча: это фоновое обновление, а не действие человека */ }
}

async function load() {
  // Афиша едет вместе с настройками и сеткой: главная — первый экран,
  // ждать её содержимое отдельным заходом человеку негде.
  //
  // Упавшая афиша не должна уносить с собой сетку занятости: главное на
  // странице — забронировать корт, объявления вторичны.
  // Один запрос вместо четырёх параллельных. У функции один запрос на
  // экземпляр, поэтому четыре параллельных поднимали до четырёх
  // контейнеров, из которых тёплым был один: остальные платили холодный
  // старт, и первое открытие после тишины занимало полторы-две секунды.
  const boot = await api('bootstrap', { days: 14 });
  state.config = boot.config;
  state.data = boot.availability;
  state.landing = boot.landing;
  state.openPlay = boot.openPlay;
  state.date = state.data.today;

  // Ссылка из объявления в чате клуба: «освободилось время в субботу
  // 19:00» → ?date=2026-09-05&start=19:00. Человек, пришедший по такой
  // ссылке, должен увидеть тот самый день, а не сегодняшний, — иначе
  // ему придётся искать время, о котором ему только что написали.
  const asked = new URLSearchParams(location.search);
  const askedDate = asked.get('date');
  if (askedDate && state.data.days && state.data.days[askedDate]) state.date = askedDate;

  // В Telegram личность подтверждена подписью — она главнее сохранённого
  // токена, который мог остаться от другого человека на общем телефоне.
  await tryTelegramLogin();

  const saved = !state.auth && store.get(TOKEN_KEY);
  if (saved) {
    state.auth = { token: saved, client: null };
    try {
      const me = await api('me');
      state.auth.client = me.client;
    } catch (e) { state.auth = null; }
  }

  renderHero();
  renderNav();
  renderDays();
  renderGrid();
  renderPicker();

  // Из Telegram открывают кнопкой «Забронировать» — там главная лишний
  // шаг: человек уже сказал, зачем пришёл. В браузере наоборот, первый
  // экран — главная. Ссылка из объявления об освободившемся времени —
  // тот же случай, что и Telegram: человек шёл занимать корт.
  showView(telegramInitData() || askedDate || /[#&]book\b/.test(location.hash) ? 'book' : 'home');
  if (state.auth) refreshMine();
}

async function refreshAvailability() {
  if (!API_URL) return;
  state.data = await api('getAvailability', { days: 14 });
  // Состав тренировок обновляем тем же заходом: набор меняется чаще
  // самой сетки, и показывать «2 места» там, где мест уже нет, —
  // ровно тот случай, когда человек жмёт кнопку и получает отказ.
  try { state.openPlay = await api('openPlayList', { days: 14 }); } catch (e) { /* сетка важнее */ }
}

async function refreshMine() {
  if (!state.auth) { state.mine = null; return; }
  try {
    state.mine = await api('myBookings');
    markMySessions();
  } catch (e) { state.mine = null; }
  renderNav();
  if (state.view === 'mine') renderMine();
}

// Общий список тренировок собирается до того, как страница вспомнит вход
// (токен восстанавливается позже, а из Mini App подпись разбирается ещё
// позже). Поэтому пометки «вы записаны» в нём пустые. Свои записи уже
// приехали вместе с кабинетом — переносим их сюда, вместо того чтобы
// спрашивать сервер второй раз о том же.
function markMySessions() {
  const mine = (state.mine && state.mine.openPlay) || [];
  if (!mine.length || !state.openPlay || !state.openPlay.sessions) return;
  state.openPlay.sessions = state.openPlay.sessions.map(s => {
    const own = mine.find(m => m.id === s.id);
    return own || s;
  });
}

function renderHero() {
  const c = state.config;
  document.getElementById('clubName').textContent = c.club.name;

  // Правила в подвале берём из настроек, а не пишем текстом: срок отмены
  // меняли уже дважды, и зашитая цифра каждый раз оставалась старой.
  //
  // «Бесплатная отмена» отсюда убрана намеренно: денег за отмену клуб не
  // берёт никогда, и слово «бесплатная» обещало платную — которой нет.
  // Поздняя отмена стоит рейтинга, так и написано.
  document.getElementById('footerRules').textContent =
    'Бронирование от ' + hoursText(c.booking.minBookingMinutes) + ', шаг '
    + c.booking.slotStep + ' минут. Отмена без потери рейтинга — не позже чем за '
    + c.booking.cancelDeadlineHours + ' ч до начала.';
  document.getElementById('clubWhere').textContent =
    [c.club.city, c.club.address].filter(Boolean).join(' · ');

  const rating = document.getElementById('clubRating');
  // «на Яндекс.Картах» — ссылка на карточку: оттуда и рейтинг, человеку
  // логично хотеть посмотреть отзывы целиком.
  const mapsLink = c.club.mapUrl
    ? '<a href="' + escapeHtml(c.club.mapUrl) + '" target="_blank" rel="noopener">на Яндекс.Картах</a>'
    : 'на Яндекс.Картах';
  rating.innerHTML = c.club.rating
    ? '<span class="star">★</span> ' + escapeHtml(c.club.rating)
      + (c.club.ratingCount ? ' · ' + c.club.ratingCount + ' оценки ' + mapsLink : '')
    : '';

  // Цену, часы и число кортов шапка не повторяет намеренно: ровно то же
  // самое стоит ниже, в блоке «Забронировать корт», и там оно к месту —
  // рядом с кнопкой, по которой человек и пойдёт. Наверху — то, чем клуб
  // отличается от соседнего: покрытие, кондиционеры, пушки.
  // В настройках это одна строка через запятую — здесь она разбирается
  // на отдельные чипы, и каждый начинается с большой буквы: «Быстрое
  // покрытие», «Кондиционеры», а не хвост перечисления.
  const facts = String(c.club.features || '')
    .split(/\s*,\s*/)
    .map(s => s.trim())
    .filter(Boolean)
    .map(s => '<span class="fact">' + escapeHtml(s.charAt(0).toUpperCase() + s.slice(1)) + '</span>');

  if (c.club.phone) facts.push('<span class="fact"><a href="tel:' + escapeHtml(c.club.phone.replace(/[^\d+]/g, '')) + '">' + escapeHtml(c.club.phone) + '</a></span>');
  if (c.club.mapUrl) facts.push('<span class="fact"><a href="' + escapeHtml(c.club.mapUrl) + '" target="_blank" rel="noopener">Как проехать</a></span>');
  document.getElementById('facts').innerHTML = facts.join('');

  // Строка под чипами осталась для услуги, которой нет отдельной
  // карточки: натяжка струн живёт позицией каталога, но человеку про
  // неё полезно узнать сразу.
  document.getElementById('clubAbout').innerHTML = c.club.extraService
    ? escapeHtml(c.club.extraService) + '.' : '';

  const who = document.getElementById('whoBtn');
  who.textContent = state.auth && state.auth.client
    ? state.auth.client.name.split(' ')[0]
    : 'Войти';

  renderStatusNotice();
}

function renderStatusNotice() {
  const n = document.getElementById('statusNotice');
  const client = state.auth && state.auth.client;

  // Открыли из Telegram, но учётка не привязана. Молча показывать форму
  // пароля здесь неправильно: человек пришёл из мессенджера и пароля,
  // скорее всего, не заводил. Один шаг в боте решает всё.
  if (!client && state.tgUnlinked) {
    const bot = state.config.club.botUsername;
    n.hidden = false;
    n.className = 'notice';
    n.innerHTML = '<b>Ещё пара секунд.</b> Откройте бота клуба и нажмите «Поделиться номером» — '
      + 'после этого вход сюда будет без пароля.'
      + (bot ? ` <a href="https://t.me/${bot}" target="_blank" rel="noopener">Открыть бота</a>` : '');
    return;
  }

  if (!client || client.status === 'verified') { n.hidden = true; return; }
  n.hidden = false;
  n.className = 'notice';
  n.innerHTML = client.status === 'pending'
    ? '<b>Заявка на рассмотрении.</b> Администратор подтвердит вас, обычно в течение дня. '
      + 'После этого бронировать можно будет самостоятельно. Занятость кортов видна и сейчас.'
    : '<b>Доступ закрыт.</b> Обратитесь к администратору клуба.';
}

function renderHome() {
  const view = document.getElementById('viewHome');
  const c = state.config;
  view.innerHTML = '';

  // Первым экраном — то, зачем человек пришёл. Цена и часы стоят здесь,
  // а не в шапке: рядом с кнопкой они работают, а наверху были вторым
  // экземпляром той же строки.
  //
  // Если есть тариф дешевле базового, показываем «от», а не одну цену:
  // иначе человек видит 1800 и не узнаёт, что днём корт стоит меньше.
  const rules = (c.pricing.rules || []).filter(r => r.pricePerHour < c.pricing.pricePerHour);
  const cheapest = rules.reduce((min, r) => Math.min(min, r.pricePerHour), c.pricing.pricePerHour);
  const priceFact = cheapest < c.pricing.pricePerHour
    ? 'от <b>' + money(cheapest) + '</b> / час'
    : '<b>' + money(c.pricing.pricePerHour) + '</b> / час';

  const chips = [
    '<span class="fact accent">' + priceFact + '</span>',
    '<span class="fact"><b>' + escapeHtml(fmtRange(c.booking.openTime, c.booking.closeTime)) + '</b> ежедневно</span>',
    '<span class="fact">' + c.courts.length + ' крытых корта</span>',
  ];
  // Подписи скидочных окон — то, ради чего владелец их и заводит.
  (c.pricing.rules || []).filter(r => r.showOnHome && r.label).forEach(r => {
    chips.push('<span class="fact">' + escapeHtml(r.label) + ' <b>' + money(r.pricePerHour)
      + '</b> · ' + escapeHtml(fmtRange(r.from, r.to)) + '</span>');
  });

  const cta = el('div', 'cta');
  cta.innerHTML = '<h2>Забронировать корт</h2>'
    + '<div class="facts">' + chips.join('') + '</div>'
    + '<p>Оплата на месте — наличными или переводом.</p>';
  cta.appendChild(btn('Выбрать время', 'btn', () => showView('book')));
  view.appendChild(cta);

  const posts = (state.landing && state.landing.news) || [];
  if (posts.length) {
    view.appendChild(txt('div', 'section-title', 'Новости клуба'));
    view.appendChild(homeNews(posts, c));
  }

  // Открытые тренировки выше афиши: на турнир смотрят, а на тренировку
  // записываются, и окно набора живёт считанные дни.
  if (openPlaySessions().length) {
    view.appendChild(txt('div', 'section-title', 'Открытые тренировки'));
    view.appendChild(homeOpenPlay());
  }

  view.appendChild(txt('div', 'section-title', 'Афиша турниров'));
  view.appendChild(homeEvents());

  const items = (state.landing && state.landing.catalog) || [];
  const goods = items.filter(i => i.category !== 'service');
  if (goods.length) {
    view.appendChild(txt('div', 'section-title', 'Товары клуба'));
    view.appendChild(homeGoods(goods));
  }

  view.appendChild(txt('div', 'section-title', 'Услуги и прокат'));
  view.appendChild(homeServices(c, items.filter(i => i.category === 'service')));

  view.appendChild(txt('div', 'section-title', 'Как нас найти'));
  view.appendChild(homeContacts(c));
}

// Новости приходят из группы клуба и попадают сюда только после того,
// как их там же и одобрили: прямая трансляция чата на витрину — вопрос
// времени до неудобного сообщения на главной.
function homeNews(posts, c) {
  const card = el('div', 'card');

  posts.forEach(n => {
    const item = el('div', 'post');

    if (n.photoUrl) {
      const pic = el('div', 'post-pic');
      const img = document.createElement('img');
      img.src = n.photoUrl;
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', () => pic.remove());
      pic.appendChild(img);
      item.appendChild(pic);
    }

    const when = new Date(n.postedAt);
    item.appendChild(html('div', 'post-when', escapeHtml(
      isNaN(when) ? '' : when.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }))));
    if (n.text) item.appendChild(txt('div', 'post-text', n.text));

    card.appendChild(item);
  });

  if (c.club.telegramGroup) {
    const links = el('div', 'links');
    links.appendChild(link('Все новости в группе клуба', c.club.telegramGroup));
    card.appendChild(links);
  }

  return card;
}

function homeEvents() {
  const card = el('div', 'card');
  const events = state.landing ? state.landing.events : null;

  // Пустая афиша и не загрузившаяся — разные вещи, и говорить о них

// Фотографии товаров — единственное, что страница тянет ссылкой из
// хранилища. Согласованное исключение: десяток фотографий в виде
// data:-строк раздул бы её на мегабайты.
function homeGoods(goods) {
  const card = el('div', 'card');
  const grid = el('div', 'goods-grid');

  goods.forEach(item => {
    const cell = el('div', 'goods-card');

    const pic = el('div', 'goods-pic');
    if (item.photoUrl) {
      const img = document.createElement('img');
      img.src = item.photoUrl;
      img.alt = item.name;
      img.loading = 'lazy';
      // Не отдалась картинка — остаётся заглушка, а не рваная карточка.
      img.addEventListener('error', () => { pic.innerHTML = ''; pic.classList.add('no-pic'); });
      pic.appendChild(img);
    } else {
      pic.classList.add('no-pic');
    }
    cell.appendChild(pic);

    const text = el('div', 'goods-body');
    text.innerHTML = '<div class="t1">' + escapeHtml(item.name) + '</div>'
      + '<div class="t-price">' + escapeHtml(priceLabel(item)) + '</div>'
      + (item.description ? '<div class="t2">' + escapeHtml(item.description) + '</div>' : '');
    text.appendChild(btn('Оставить заявку', 'btn sec sm wide', () => openRequest(item, null)));

  card.appendChild(txt('div', 'empty', 'Про наличие и размеры спросите администратора клуба.'));

function priceLabel(item) {

// Заявка с витрины. Вход не спрашиваем намеренно: человек мог прийти
// на сайт за ракеткой, а не за кортом, и требовать регистрацию ради
// вопроса о цене — верный способ этот вопрос не получить.
function openRequest(item, option) {
  const client = state.auth && state.auth.client;

  const body = el('div');
  body.innerHTML = '<h3>' + escapeHtml(item.name) + '</h3>'
    + '<div class="m-sub">Администратор перезвонит и всё расскажет — про наличие, размер и оплату.</div>';

  // Услугу с тарифами спрашивают конкретную: «перетяжка» без варианта
  // оставляет администратора гадать, срочная она или обычная.
  let picked = option;
  if (!option && item.options && item.options.length) {
    const chips = el('div', 'chips');
    chips.style.marginBottom = '14px';
    item.options.forEach(o => {
      const c = btn(o.name + (o.price == null ? '' : ' · ' + money(o.price)),
        'chip' + (picked && picked.id === o.id ? ' on' : ''), () => {
          picked = o;
          Array.prototype.forEach.call(chips.children, n => n.classList.remove('on'));
          c.classList.add('on');
        });
      chips.appendChild(c);
    });
    body.appendChild(chips);
  }

  let inpName = null;
  let inpPhone = null;

  if (client) {
    body.appendChild(txt('div', 'empty', 'Перезвоним на ' + client.phone + '.'));
  } else {
    const fName = el('label', 'field');
    fName.innerHTML = '<span>Как вас зовут</span>';
    inpName = document.createElement('input');
    inpName.placeholder = 'Иван Петров';
    inpName.autocomplete = 'name';
    fName.appendChild(inpName); body.appendChild(fName);

    const fPhone = el('label', 'field');
    fPhone.innerHTML = '<span>Телефон</span>';
    inpPhone = document.createElement('input');
    inpPhone.autocomplete = 'tel';
    attachPhoneMask(inpPhone);
    fPhone.appendChild(inpPhone); body.appendChild(fPhone);
  }

  const fComment = el('label', 'field');
  fComment.innerHTML = '<span>Что уточнить — необязательно</span>';
  const comment = document.createElement('input');
  comment.placeholder = 'Например: нужна ручка размера 2';
  fComment.appendChild(comment); body.appendChild(fComment);

  const acts = el('div', 'm-acts');
  acts.appendChild(btn('Отмена', 'btn sec', closeModal));
  const send = btn('Отправить', 'btn', async () => {
    if (!client && (!inpName.value.trim() || !inpPhone.value.trim())) {
      toast('Оставьте имя и телефон — иначе перезвонить некуда');
      return;
    }
    send.disabled = true;
    try {
      await api('requestItem', {
        itemId: item.id,
        optionId: picked ? picked.id : null,
        name: inpName ? inpName.value : '',
        phone: inpPhone ? inpPhone.value : '',
        comment: comment.value,
      });
      closeModal();
      toast('Заявка ушла администратору — перезвонит в рабочее время', 4000);
    } catch (e) {
      send.disabled = false;
      toast(errorText(e.code), 4000);
    }
  });
  acts.appendChild(send);
  body.appendChild(acts);

  showModal(body);
  setTimeout(() => (inpName || comment).focus(), 50);
}

function link(label, href) {
  const a = document.createElement('a');
  a.className = 'btn sec sm';
  a.textContent = label;
  a.href = href;
  a.style.textDecoration = 'none';
  if (href.indexOf('http') === 0) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

// Высоту навигации меряем, а не записываем числом: под ней паркуется
// шапка сетки, и разъехавшееся на четыре пикселя число — это полоска
// чужого фона поверх заголовков кортов.
function syncNavHeight() {
  const nav = document.getElementById('nav');
  const h = nav && !nav.hidden ? Math.round(nav.getBoundingClientRect().height) : 0;
  document.documentElement.style.setProperty('--nav-h', h + 'px');

window.addEventListener('resize', syncNavHeight);

function showView(name) {
  state.view = name;
  document.getElementById('viewHome').hidden = name !== 'home';
  document.getElementById('viewBook').hidden = name !== 'book';
  document.getElementById('viewMine').hidden = name !== 'mine';
  document.getElementById('viewProfile').hidden = name !== 'profile';

  if (name === 'mine') renderMine();
